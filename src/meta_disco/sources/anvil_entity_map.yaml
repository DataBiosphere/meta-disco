# The AnVIL entity map (#693, #669): which submitter tables say what about a donor, and which
# column of each names the donor or sample AnVIL's own records were made from. Shape and
# rules: src/meta_disco/entity_map.py; checked against the manifests by `make
# check-entity-map`, imported by `make import-anvil-entities` (src/meta_disco/anvil_entities.py)
# as entity evidence under data/entity_evidence/. The slot map cannot hold this: it is keyed
# by a file-link column, and these rows have none.
#
# Per dataset and table: `identifier`, the column naming the donor (or the sample, where
# AnVIL's `anvil_biosample` is made from the table's rows), read through
# rules/sample_namespaces.yaml at reconcile; and for each of a donor's slots
# (models.DONOR_FIELDS, and its family's, models.FAMILY_FIELDS, #582), the columns whose
# cells it reads. A `mother` or `father` cell names the parent as the source wrote it, PED's
# `0` ("not known") included; reconcile recognises it as a donor, and makes no claim of a `0`.
# A `family_id` cell is taken as written (an empty or blank one makes no claim). A table naming only its
# `identifier` reads no slot: it is there for AnVIL's records made from its rows to tie to
# (`published`, below). Measured on anvil15, 2026-10-16 and (the sample tables) 2026-10-17.
# Each table's comment says why its columns are the donor's sex or population: a sex
# column is read as phenotypic sex wherever it is a sex recorded for the person (reported
# or catalogued), as AnVIL's own `anvil_donor.phenotypic_sex` is filled from such columns;
# a population column is 1000 Genomes' population or superpopulation code; a parent column
# is a PED file's (`motherid`) or names its role (`maternal_id`), measured 2026-10-17.
#
# Left out: AnVIL_ENCORE_293T and AnVIL_ENCORE_RS293, whose donors (`293T`,
# `Ribo-STAMP-293T`, `DOX-RS293`) are engineered lines of one cell line and no rule
# recognises, nor their biosamples' names (`TIAL1-BG293LV06-111B`); T2T_CHRY's SGDP tables, whose donors' identifiers are #559's; MAGE's
# `kgp_sample.sex` (`XX`/`XY`), a sample's karyotype rather than a donor's sex (#702).
catalog: anvil15
datasets:
  ANVIL_1000G_high_coverage_2019:
    # 1000 Genomes' PED file, one row per person: `sex` is PED's 1 = male, 2 = female;
    # `population` and `superpopulation` are 1000 Genomes' codes (GBR, EUR); `motherid` and
    # `fatherid` the parents (`0` on 2,594 and 2,595 of 3,202 rows), `familyid` the family.
    pedigree:
      identifier: pedigree_id
      phenotypic_sex: [sex]
      genetic_ancestry: [population, superpopulation]
      mother: [motherid]
      father: [fatherid]
      family_id: [familyid]
    # One row per sequenced sample, `library_name` the person's Coriell number;
    # `population` is the same 1000 Genomes code the pedigree gives.
    participant:
      identifier: library_name
      genetic_ancestry: [population]
    # The sequenced samples again, keyed by SRA accession; `library_name` is the Coriell
    # number, as on `participant`. AnVIL makes a biosample from each row of both tables.
    sample:
      identifier: library_name
  ANVIL_1000G_PRIMED_data_model:
    # PRIMED's subject table: `reported_sex`, the sex reported for the person.
    subject:
      identifier: subject_id
      phenotypic_sex: [reported_sex]
    # PRIMED's population descriptor: `population_label` is `<population> | <superpopulation>`.
    population_descriptor:
      identifier: subject_id
      genetic_ancestry: [population_label]
    # PRIMED's samples, keyed by the Coriell number.
    sample:
      identifier: sample_id
  ANVIL_HPRC:
    # HPRC's participants, 1000 Genomes and GIAB people: `sex`; `subpopulation`, a
    # 1000 Genomes population code; and `familyid`, 1000 Genomes' family id (GIAB's two
    # trios have their own, `3140` and `3150`).
    participant:
      identifier: participant_id
      phenotypic_sex: [sex]
      genetic_ancestry: [subpopulation]
      family_id: [familyid]
    # HPRC's samples, keyed by the Coriell or GIAB name (56 of 57; `mHomSap3`, no rule's, is not).
    # The cell line's `maternal_id` and `paternal_id` are its donor's parents (a Coriell or GIAB
    # name, `0` on 2 rows; mHomSap3's are mHomSap2 and mHomSap1, no rule's), whose reads are this
    # row's `mat_ilmn` / `pat_ilmn` files.
    sample:
      identifier: sample_id
      mother: [maternal_id]
      father: [paternal_id]
  AnVIL_HPRC_R2:
    # HPRC release 2's sample metadata, a row per person: `sex`, and `population_abbreviation`,
    # a 1000 Genomes code, or another population's (`ASL`, `MKK`) left unmapped.
    # Its `maternal_id`, `paternal_id` and `family_id` are the person's parents and family
    # (null, not `0`, where not known).
    sample_metadata:
      identifier: sample_metadata_id
      phenotypic_sex: [sex]
      genetic_ancestry: [population_abbreviation]
      mother: [maternal_id]
      father: [paternal_id]
      family_id: [family_id]
    # HPRC release 2's Illumina CRAMs, a row per file of 1000 Genomes people: `sample_id` the
    # person's Coriell number, with the same three family columns (a parent `0` where not
    # known; `family_id` always filled, the person's own number where they have no family).
    illumina:
      identifier: sample_id
      mother: [maternal_id]
      father: [paternal_id]
      family_id: [family_id]
  AnVIL_IGVF_Mouse_R1:
    # IGVF's donors, mice: `phenotypic_sex`, IGVF's own name for the field.
    donor:
      identifier: donor_id
      phenotypic_sex: [phenotypic_sex]
    # IGVF's samples, keyed by their IGVF sample accession (`IGVFSM…`).
    sample:
      identifier: sample_id
  AnVIL_MAGE:
    # MAGE's 1000 Genomes samples: `population`, the person's 1000 Genomes code. Its `sex`
    # (XX/XY) is a karyotype, a sample's fact, and is not read here.
    kgp_sample:
      identifier: kgp_sample_id
      genetic_ancestry: [population]
    # MAGE's sequencing libraries: `kgp_sample_id`, the Coriell number of the sample the
    # library was made from (its `coriell_id` is the same number, `GM`-prefixed on 278 of 779).
    sequencing_library:
      identifier: kgp_sample_id
  ANVIL_NIA_CARD_Coriell_Cell_Lines_Open:
    # NIA CARD's subjects, Coriell and GIAB people: `sex`, and `race_ethnicity`, the person's reported
    # ethnicity in the census categories (#699; AnVIL's `anvil_donor.reported_ethnicity` is made from it).
    subject:
      identifier: subject_id
      phenotypic_sex: [sex]
      reported_ethnicity: [race_ethnicity]
    # NIA CARD's samples, keyed by the Coriell or GIAB name, the same as its subject's.
    sample:
      identifier: sample_id
  ANVIL_T2T:
    # T2T's participants, the 1000 Genomes people: `sex`.
    participant:
      identifier: participant_id
      phenotypic_sex: [sex]
  ANVIL_T2T_CHRY:
    # T2T_CHRY's 1000 Genomes samples: `population`, the person's 1000 Genomes code.
    1KGP_CHM13v2_sample:
      identifier: t_1kgp_chm13v2_sample_id
      genetic_ancestry: [population]
# What AnVIL itself publishes for a donor and a sample, in every dataset above: its own
# record of each, attached to an identifier through the submitter row AnVIL made it from (its
# `source_rows` column, `<table>:<datarepo_row_id>`), read in that table's identifier column;
# `repository_id`, AnVIL's own identifier for the record (the same in prod anvil15 and dev's
# 1000G snapshot, measured on #692), which the record it ties to lists (#669); and each
# slot's columns (#699), AnVIL's own column of that name. Measured on anvil15, 2026-10-18:
# `organism_type` on 9,842 of 10,086 donors (Human, Mouse), `reported_ethnicity` on 3 (NIA_CARD),
# `genetic_ancestry` on none; `biosample_type` and `anatomical_site` on 2,168 of 17,181
# biosamples (IGVF, HPRC_R2, NIA_CARD), the site `Unknown` on every one of HPRC_R2's and NIA_CARD's.
published:
  donor:
    table: anvil_donor
    source_rows: source_datarepo_row_ids
    repository_id: donor_id
    phenotypic_sex: [phenotypic_sex]
    genetic_ancestry: [genetic_ancestry]
    organism_type: [organism_type]
    reported_ethnicity: [reported_ethnicity]
  sample:
    table: anvil_biosample
    source_rows: source_datarepo_row_ids
    repository_id: biosample_id
    biosample_type: [biosample_type]
    anatomical_site: [anatomical_site]
