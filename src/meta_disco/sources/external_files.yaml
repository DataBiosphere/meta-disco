    # imported from, as the Schatz lab published them (uploaded once, 2023-03-20). Each map's
    # `named_as` is every path a tar's vcfheader.vcf names for it (`--sample-name-map`); the
    # tars name chrX_PAR1 and chrX_PAR2 maps, and the lab published one chrX_PAR map.
