# Files held outside AnVIL that a dataset's files were made from (#710). Shape and checks:
# src/meta_disco/external_files.py; fetched by `make fetch-external-files` into
# data/external/<dataset>/<host>/<owner>/<repo>/<commit>/<path>, each refused unless its
# sha256 is the one declared here.
#
# A WORKAROUND. #624 asks AnVIL to hold these maps in the snapshot; when it does, the catalog
# maps take over through #621's code, and this entry, its cache and its lineage are deleted.
catalog: anvil15
datasets:
  ANVIL_T2T_CHRY:
