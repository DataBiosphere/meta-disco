# A genotype check of ANVIL_T2T_CHRY's SGDP samples whose sex check could not confirm them (#718).
# Read by src/meta_disco/sgdp_entities.py (load_genotype_checks): `make import-sgdp-entities` links a
# sample its sex check does not confirm where `matched` is the SGDP genome T2T_CHRY's tables pair it
# with (code_rules.SGDP_GENOTYPE_MATCHES). The method, the controls and why each verdict holds:
# docs/studies/sgdp-genome-identity.md.
#
# Each sample's chr22 gVCF (SGDP_GRCh38/) was compared, over `region`, with every genome of both
# `references` (SGDP's lifted from GRCh37) by `bcftools gtcheck -u GT,GT -E 0`, at each reference's
# biallelic SNPs: `mismatches` of the `sites` where both genotypes are known. Under `best`, each
# reference's two genomes with the lowest share of mismatches, for a person; the importer reads only
# `sgdp_id` and `matched`. Pairings the sex check confirmed differed at 33-53 sites (sgdp, imputed
# genotypes) and 0-1 (hgdp); every other genome, at 1.98% of sites or more.
# The catalog whose files were measured: the import refuses another's until a person confirms the record
# still holds for it (#718).
catalog: anvil15
datasets:
  ANVIL_T2T_CHRY:
    measured: "2026-10-22"
    region: chr22:25000000-26000000
    references:
      sgdp: https://sharehost.hms.harvard.edu/genetics/reich_lab/sgdp/phased_data2021/chr.sgdp.pub.22.bcf
      hgdp: https://ngs.sanger.ac.uk/production/hgdp/hgdp_wgs.20190516/hgdp_wgs.20190516.full.chr22.vcf.gz
    samples:
      simons_data_sample_187:
        # SGDP says M, T2T_CHRY's karyotype XX; the genome's chrX shows one X, so the karyotype is the odd one.
        sgdp_id: S_Palestinian-2
        matched: S_Palestinian-2
        best:
          sgdp:
            - {genome: S_Palestinian-2, mismatches: 48, sites: 30788}
            - {genome: S_Russian-1, mismatches: 1017, sites: 30788}
          hgdp:
            - {genome: HGDP00725, mismatches: 0, sites: 25536}
            - {genome: HGDP01400, mismatches: 993, sites: 25129}
      simons_data_sample_304:
        # SGDP gives no sex (U).
        sgdp_id: S_Norwegian-1
        matched: S_Norwegian-1
        best:
          sgdp:
            - {genome: S_Norwegian-1, mismatches: 40, sites: 30799}
            - {genome: S_Bergamo-2, mismatches: 823, sites: 30799}
          hgdp:
            - {genome: HGDP01172, mismatches: 885, sites: 25627}
            - {genome: HGDP00650, mismatches: 941, sites: 25483}
      simons_data_sample_33:
        # SGDP gives no sex (U).
        sgdp_id: B_Australian-3
        matched: B_Australian-3
        best:
          sgdp:
            - {genome: B_Australian-3, mismatches: 60, sites: 30756}
            - {genome: B_Papuan-15, mismatches: 894, sites: 30756}
          hgdp:
            - {genome: HGDP00546, mismatches: 984, sites: 25208}
            - {genome: HGDP00550, mismatches: 972, sites: 24749}
      simons_data_sample_273:
        # Neither release holds S_Naxi-2, and the sample matches no genome of either.
        sgdp_id: S_Naxi-2
        matched: null
        best:
          sgdp:
            - {genome: S_Naxi-3, mismatches: 806, sites: 30783}
            - {genome: S_Icelandic-2, mismatches: 1160, sites: 30783}
          hgdp:
            - {genome: HGDP01345, mismatches: 847, sites: 25435}
            - {genome: HGDP00849, mismatches: 1112, sites: 25244}
