# The AnVIL slot map (#369). Shape and rules: src/meta_disco/slot_map.py. Candidate
# names: manifest_survey.NAME_TOKENS; candidate cells: manifest_survey.FIELD_TOKENS.
# A dataset, table or column with nothing to map is absent.
catalog: anvil15
datasets:
  ANVIL_1000G_high_coverage_2019:
    participant:
      gvcf: &g1000_participant
        platform:
          - {cell: instrument_model}
          - {cell: instrument_platform}
      gvcf_tbi: *g1000_participant
    sample:
      cram: &g1000_sample
        platform:
          - {cell: instrument_model}
        assay_type:
          - {cell: library_strategy}
        data_modality:
          - {cell: library_source}
      gvcf: *g1000_sample
      gvcf_tbi: *g1000_sample
  ANVIL_1000G_PRIMED_data_model:
    plink_file_wide:
      pgen: &primed_plink
        data_type:
          - {table_name: plink}
      psam: *primed_plink
      pvar: *primed_plink
  ANVIL_HPRC:
    assembly_annotation:
      all_flagger: &hprc_annotation
        data_type:
          - {table_name: annotation}
      mat_asat: *hprc_annotation
      mat_dna_brnn: *hprc_annotation
      mat_hsat: *hprc_annotation
      mat_seg_dups: *hprc_annotation
      mat_trf: *hprc_annotation
      pat_asat: *hprc_annotation
      pat_dna_brnn: *hprc_annotation
      pat_hsat: *hprc_annotation
      pat_seg_dups: *hprc_annotation
      pat_trf: *hprc_annotation
      unreliable_only_flagger: *hprc_annotation
      unreliable_only_no_mt_flagger: *hprc_annotation
      mat_chm13_cat_genes: &hprc_annotation_chm13
        data_type:
          - {table_name: annotation}
        reference_assembly:
          - {column_name: chm13}
      pat_chm13_cat_genes: *hprc_annotation_chm13
      mat_hg38_cat_genes: &hprc_annotation_hg38
        data_type:
          - {table_name: annotation}
        reference_assembly:
          - {column_name: hg38}
      pat_hg38_cat_genes: *hprc_annotation_hg38
      mat_repeat_masker: &hprc_annotation_repeat_masker
        data_type:
          - {table_name: annotation}
          - {column_name: repeat_masker}
      pat_repeat_masker: *hprc_annotation_repeat_masker
    assembly_sample:
      mat_chm13_aln_bam: &hprc_sample_chm13
        reference_assembly:
          - {column_name: chm13}
      mat_chm13_aln_bai: *hprc_sample_chm13
      pat_chm13_aln_bam: *hprc_sample_chm13
      pat_chm13_aln_bai: *hprc_sample_chm13
      mat_grch38_aln_bam: &hprc_sample_grch38
        reference_assembly:
          - {column_name: grch38}
      mat_grch38_aln_bai: *hprc_sample_grch38
      pat_grch38_aln_bam: *hprc_sample_grch38
      pat_grch38_aln_bai: *hprc_sample_grch38
    minigraph_cactus:
      grch38_vcf: &hprc_mc_grch38
        reference_assembly:
          - {column_name: grch38}
      grch38_vcf_index: *hprc_mc_grch38
      grch38_xg: *hprc_mc_grch38
    sample:
      hifi:
        platform:
          - {column_name: hifi}
      hic:
        assay_type:
          - {column_name: hic}
      nanopore:
        platform:
          - {column_name: nanopore}
  ANVIL_NIA_CARD_Coriell_Cell_Lines_Open:
    sequencing:
      sequencing_id_fileref:
        reference_assembly:
          - {cell: reference_genome_build}
        platform:
          - {cell: sequencing_platform}
        assay_type:
          - {cell: sequencing_assay}
          - {cell: sequencing_strategy}
