# The AnVIL lineage map (#583). Shape and rules: src/meta_disco/lineage_map.py.
# A table with nothing to map is absent. anvil_activity's columns are FSS's and the
# same in every dataset, so one anchor serves each dataset that has the table.
catalog: anvil15
datasets:
  ANVIL_1000G_high_coverage_2019:
    anvil_activity: &fss_activity
      - child: {column: generated_file_id, key: file_id}
        parent: {column: used_file_id, key: file_id}
        raw_activity: {cell: activity_type}
        activity_id: {cell: activity_id}
      - child: {column: generated_file_id, key: file_id}
        parent: {column: used_biosample_id, key: biosample_id}
        raw_activity: {cell: activity_type}
        activity_id: {cell: activity_id}
  ANVIL_1000G_PRIMED_data_model:
    anvil_activity: *fss_activity
  AnVIL_ENCORE_293T:
    anvil_activity: *fss_activity
  AnVIL_ENCORE_RS293:
    anvil_activity: *fss_activity
  ANVIL_HPRC:
    anvil_activity: *fss_activity
  AnVIL_HPRC_R2:
    anvil_activity: *fss_activity
    # Each derivative table's row is keyed by the assembly it was made from: its `<table>_id`
    # is the `assembly` table's `assembly_id` (`HG03942_mat_hprc_r2_v1.0.1`), and its file is
    # in `location` (#682). Annotations in the assembly's own coordinates, then the assembly's
    # alignments to CHM13 and GRCh38. The chains (#364) and ONT methylation tracks (#558) are
    # keyed the same way and not mapped.
    censat:
      - child: {column: location}
        parent: {column: censat_id, table: assembly, identifier_column: assembly_id, locator_column: assembly}
    censat_centromeres:
      - child: {column: location}
        parent: {column: censat_centromeres_id, table: assembly, identifier_column: assembly_id, locator_column: assembly}
    gaps:
      - child: {column: location}
        parent: {column: gaps_id, table: assembly, identifier_column: assembly_id, locator_column: assembly}
    liftoff_genes:
      - child: {column: location}
        parent: {column: liftoff_genes_id, table: assembly, identifier_column: assembly_id, locator_column: assembly}
    repeat_masker_bed:
      - child: {column: location}
        parent: {column: repeat_masker_bed_id, table: assembly, identifier_column: assembly_id, locator_column: assembly}
    repeat_masker_out:
      - child: {column: location}
        parent: {column: repeat_masker_out_id, table: assembly, identifier_column: assembly_id, locator_column: assembly}
    segdups:
      - child: {column: location}
        parent: {column: segdups_id, table: assembly, identifier_column: assembly_id, locator_column: assembly}
    t2t_sequences:
      - child: {column: location}
        parent: {column: t2t_sequences_id, table: assembly, identifier_column: assembly_id, locator_column: assembly}
    to_ref_chm13_winnowmap:
      - child: {column: location}
        parent: {column: to_ref_chm13_winnowmap_id, table: assembly, identifier_column: assembly_id, locator_column: assembly}
    to_ref_grch38_winnowmap:
      - child: {column: location}
        parent: {column: to_ref_grch38_winnowmap_id, table: assembly, identifier_column: assembly_id, locator_column: assembly}
  AnVIL_IGVF_Mouse_R1:
    anvil_activity: *fss_activity
    file:
      - child: {column: file_path}
        parent: {column: derived_from, table: file, identifier_column: file_id, locator_column: file_path}
  AnVIL_MAGE:
    anvil_activity: *fss_activity
  ANVIL_nhp_dGTEx_V1:
    anvil_activity: *fss_activity
  # NIA CARD's transform wrote its steps to the typed sequencing activity table instead: 6 rows, each
  # generating one file (a hapdup_contigs_1.fasta assembly) from one biosample, no used_file_id (#698).
  ANVIL_NIA_CARD_Coriell_Cell_Lines_Open:
    anvil_sequencingactivity:
      - child: {column: generated_file_id, key: file_id}
        parent: {column: used_biosample_id, key: biosample_id}
        raw_activity: {cell: activity_type}
        activity_id: {cell: sequencingactivity_id}
  ANVIL_T2T:
    anvil_activity: *fss_activity
    participant:
      - {child: {column: samtools_stats}, parent: {column: cram}}
      - {child: {column: mosdepth_global_dist}, parent: {column: cram}}
      - {child: {column: mosdepth_regions_bed}, parent: {column: cram}}
      - {child: {column: mosdepth_regions_dist}, parent: {column: cram}}
      - {child: {column: mosdepth_summary}, parent: {column: cram}}
      - {child: {column: cram_index}, parent: {column: cram}}
      - {child: {column: mosdepth_regions_bed_idx}, parent: {column: mosdepth_regions_bed}}
      - {child: {column: cram}, parent: {column: read_1_fastq}}
      - {child: {column: cram}, parent: {column: read_2_fastq}}
    # One row per 100-kb region of the joint calling: its GenomicsDB workspace tar and
    # the region VCF genotyped from it (#610).
    interval:
      - {child: {column: genotyped_bgzip}, parent: {column: genomics_db_tar}}
    # One row per chromosome, holding two joint callsets side by side: T2T's on CHM13 and
    # NYGC's on GRCh38. Each is paired only within its own chain; a CHM13 file is never
    # made from the GRCh38 file beside it (#610, #617).
    chromosome:
      - {child: {column: chm13_recalibrated_vcf_gz}, parent: {column: chm13_raw_vcf_gz}}
      - {child: {column: chm13_pass_vcf_gz}, parent: {column: chm13_recalibrated_vcf_gz}}
      - {child: {column: grch38_pass_vcf_gz}, parent: {column: grch38_recalibrated_vcf_gz}}
  ANVIL_T2T_CHRY:
    anvil_activity: *fss_activity
    1KGP_CHM13v2_sample:
      - {child: {column: full_samtools_stats}, parent: {column: cram}}
      - {child: {column: chrx_samtools_stats}, parent: {column: cram}}
      - {child: {column: chry_samtools_stats}, parent: {column: cram}}
      - {child: {column: mosdepth_global_dist}, parent: {column: cram}}
      - {child: {column: mosdepth_regions_bed}, parent: {column: cram}}
      - {child: {column: mosdepth_regions_dist}, parent: {column: cram}}
      - {child: {column: mosdepth_summary}, parent: {column: cram}}
      - {child: {column: cram_index}, parent: {column: cram}}
      - {child: {column: mosdepth_regions_index}, parent: {column: mosdepth_regions_bed}}
      - {child: {column: chr1_hcvcf_gz}, parent: {column: cram}}
      - {child: {column: chr1_hcvcf_index}, parent: {column: chr1_hcvcf_gz}}
      - {child: {column: chr2_hcvcf_gz}, parent: {column: cram}}
      - {child: {column: chr2_hcvcf_index}, parent: {column: chr2_hcvcf_gz}}
      - {child: {column: chr3_hcvcf_gz}, parent: {column: cram}}
      - {child: {column: chr3_hcvcf_index}, parent: {column: chr3_hcvcf_gz}}
      - {child: {column: chr4_hcvcf_gz}, parent: {column: cram}}
      - {child: {column: chr4_hcvcf_index}, parent: {column: chr4_hcvcf_gz}}
      - {child: {column: chr5_hcvcf_gz}, parent: {column: cram}}
