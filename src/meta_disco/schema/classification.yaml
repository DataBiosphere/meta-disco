  entity_kind_enum:
    description: >-
      What an identifier names (#693): a sample, the material a file's data was read from,
      or a donor, the person or animal it was collected from. An identifier rule declares
      which (`IdentifierRule.names`).
    permissible_values:
      sample:
        description: A sample, as a file's `samples` names it.
      donor:
        description: A donor, as a `DonorRecord` is keyed.

  classification_status_enum:
    description: >-
      Why a field has (or lacks) a value. Replaces sentinel values that were
      previously smuggled into each dimension enum (not_applicable /
      not_classified). See issues #56, #88.
    permissible_values:
      classified:
        description: A value was determined.
      not_applicable:
        description: The field has no meaning for this file.
      not_classified:
        description: The field is meaningful but no value could be determined.
      conflict:
        description: >-
          Declarations disagreed and no curator rule has answered it (claims
          contract 4.3-4.7). On an inference record, rules at the same tier
          disagreed (#88), and the competing claims stay in the evidence beside a
          `conflict` marker naming them. On a reconciled record (#432), inputs
          declared different answers (inference and a source, or sources among
          themselves), or inference's own conflict stands, or the published source
          spoke with a value no authored row reads while another input declared an
          answer. The value is null either way.

  use_enum:
    description: >-
      Which value the indexer takes for a reconciled slot (#432): this record's, or the
      one the repository already publishes (the not-worse path, until curator rules
      answer conflicts).
    permissible_values:
      meta_disco:
        description: Take this record's value; its status is `classified` or `not_applicable`.
      published:
        description: Keep the repository's published value; the status is `conflict` or `not_classified`.

  credited_to_enum:
    description: >-
      Where a reconciled slot's answer is credited (#552): the reconcile report's slot
      categories, one per slot, so a dimension's counts sum to its files. Held to
      `reconcile.SLOT_CATEGORIES` by tests/test_reconcile.py.
    permissible_values:
      filled_by_published:
        description: The published source declared the value, verbatim.
      filled_by_published_harmonized:
        description: The published source declared the value through a translation row.
      filled_by_submitter:
        description: A submitter table declared the value, verbatim.
      filled_by_submitter_harmonized:
        description: A submitter table declared the value through a translation row.
      filled_by_external:
        description: An external catalog declared the value, verbatim.
      filled_by_external_harmonized:
        description: An external catalog declared the value through a translation row.
      filled_by_inference:
        description: No source declared the value; inference supplied it.
      inherited:
        description: >-
          No source declared the value and inference did not either: it was inherited
          from the file's parents across its `generated_by` (contract 4.9, #571), whose
          record keys the inherited claim names.
      conflict_inference:
        description: Inference's own rules disagreed.
      conflict_sources:
        description: >-
          A conflict inference's rules did not cause, on a slot where the published source
          neither declared a value nor gave an unreviewed one.
      conflict_published:
        description: >-
          A conflict on a slot where the published source declared a value or gave an
          unreviewed one — whichever inputs disagreed; the published value need not be
          the disputed one.
      published_unreviewed:
        description: The published source gave a value no authored row reads, and no input answered.
      not_applicable:
        description: The slot settled `not_applicable`.
      not_classified:
        description: The slot settled `not_classified`.

  activity_type_enum:
    description: >-
      The kind of step that made a file (ADR-0002, #580): AnVIL FSS's `ActivityTypes` as its
      released LinkML schema spells them, plus ten of our own, each under the term it
      narrows. `meaning` is TerraCore's class,
      else EDAM's operation for the same step; a near EDAM operation is a close mapping.
      What each passes is in `rules/activities.yaml`.
    permissible_values:
      Activity:
        description: A step whose kind the source does not state; nothing passes across it.
        meaning: TerraCore:Activity
      SampleCollectionActivity:
        description: >-
          Taking a sample. Neither TerraCore nor EDAM has this class, so no id is recorded.
        is_a: Activity
      SampleTreatmentActivity:
        is_a: Activity
        meaning: TerraCore:SampleTreatmentActivity
      SequenceActivity:
        description: >-
          Sequencing a sample into reads. TerraCore names the same class `SequencingActivity`.
        is_a: Activity
        meaning: TerraCore:SequencingActivity
      AlignmentActivity:
        is_a: Activity
        meaning: TerraCore:AlignmentActivity
        close_mappings:
          - EDAM:operation_3198
      VariantCallActivity:
        description: >-
          Calling variants or genotypes from alignments; a joint genotyping of gVCFs is
          JointGenotypingActivity. EDAM's Variant calling is a close step.
        is_a: Activity
        meaning: TerraCore:VariantCallActivity
        close_mappings:
          - EDAM:operation_3227
      JointGenotypingActivity:
        description: >-
          Genotyping many samples at once from the calls their gVCFs hold, gathered in one
          store: GATK's GenotypeGVCFs reading a GenomicsDB workspace or a CombineGVCFs file. It
          calls no variant the gVCFs did not hold, so the calls keep the kind and origin their
          caller gave them (#678). Our own term; TerraCore has no such class, and EDAM's
          Genotyping is a close step.
        is_a: VariantCallActivity
        close_mappings:
          - EDAM:operation_3196
      ExpressionActivity:
        description: >-
          Quantifying expression. EDAM's RNA-Seq quantification is one kind of it, not the
          same step.
        is_a: Activity
        close_mappings:
          - EDAM:operation_3800
      AnalysisActivity:
        is_a: Activity
        meaning: TerraCore:AnalysisActivity
      ImageActivity:
        description: >-
          Making an image. Neither TerraCore nor EDAM has this class, so no id is recorded.
        is_a: Activity
      IndexActivity:
        is_a: Activity
        meaning: EDAM:operation_0227
      ChecksumActivity:
        description: >-
          Computing a file's checksum. EDAM's only checksum operation is a molecular
          sequence's (operation_3348), not a file's, so no id is recorded.
        is_a: Activity
      QualityControlActivity:
        description: >-
          A report on another file's content: samtools stats, mosdepth coverage. Our own
          term, under FSS's AnalysisActivity, which is too broad to say what passes.
        is_a: AnalysisActivity
        close_mappings:
          - EDAM:operation_3218
      CoverageActivity:
        description: >-
          The read coverage of one alignment file at each position, as a signal track:
          ENCORE's per-strand STAR signal bigWigs (#595). Our own term, under FSS's
          AnalysisActivity; it is not a report on the file, so not QualityControlActivity.
          EDAM's Read depth analysis analyses depth rather than writing it, so it is close.
        is_a: AnalysisActivity
        close_mappings:
          - EDAM:operation_3230
      LiftoverActivity:
        description: >-
          Moving a file's coordinates to another reference. Our own term; TerraCore has no
          such class, and EDAM's Sequence coordinate conversion is the same step.
        is_a: AnalysisActivity
        meaning: EDAM:operation_3267
      VariantProcessingActivity:
        description: >-
          Variants in, variants out, every call kept made from the same reads against the
          same reference: filtering, annotating, normalizing or subsetting a callset (a
          subset drops samples). Our own term, under
          FSS's AnalysisActivity; a record names one of its children (#610). Neither
          TerraCore nor EDAM has this class, so no id is recorded.
        is_a: AnalysisActivity
      VariantFilterActivity:
        description: >-
          Labelling a callset's rows by a filter (GATK's ApplyVQSR) or keeping only those
          that pass (`bcftools view -f PASS`). Our own term; TerraCore has no such class,
          and EDAM's Variant filtering is the same step.
        is_a: VariantProcessingActivity
        meaning: EDAM:operation_3675
      MergeActivity:
        description: >-
          Joining several files of one kind into one: window VCFs into a chromosome VCF,
          FASTQs into one. Our own term; EDAM's Sequence merging (operation_0232) merges
          sequences, not files.
        is_a: Activity
      CohortMergeActivity:
        description: >-
          Joining the files a cohort's list names into one, the list the step's input rather
          than each file: a GenomicsDB workspace built from the gVCFs of a GATK sample-name
          map (#621). Our own term; neither TerraCore nor EDAM has this class, so no id is
          recorded.
        is_a: MergeActivity
      CohortDefinitionActivity:
        description: >-
          Listing the files that are processed together: a GATK sample-name map naming the
          gVCFs one GenomicsDB import joint-calls (#621). A processing cohort, who was
          computed together, not a research cohort a user builds. Our own term; neither
          TerraCore nor EDAM has this class, so no id is recorded.
        is_a: Activity
      AssemblyActivity:
        description: >-
          Assembling reads into sequences. Not an FSS term; EDAM's Sequence assembly is
          the same step.
        is_a: Activity
        meaning: EDAM:operation_0310

  activity_form_enum:
    description: Whether an activity's input or output is a file we hold or an identifier (#580).
    permissible_values:
      file:
      identifier:
        description: A sample or donor identifier (ADR-0002 decision 1), which has no record.

  passed_dimension_enum:
    description: >-
      The dimensions an activity's output can take from an input (#580): the eight
      classification dimensions but `data_type`, which names a file's own kind and never
      passes (ADR-0002 decision 8: a VCF is not an alignment).
    permissible_values:
      data_modality:
      platform:
      reference_assembly:
      assay_type:
      instrument_model:
      variant_kind:
      variant_origin:

  parent_kind_enum:
    description: The kind of file a derivation edge points at.
    permissible_values:
      alignment:
      variants:
      reads:
      sequence:
      intervals:
      signal:
      expression_matrix:
      genotypes:
      any:

  source_type_enum:
    description: >-
      Kind of source behind a claim (provenance model, #90). Every claim carries
      one (#392). Distinct from `tier`, which is the resolution input: two kinds
      share `CONTENT_TIER`.
    permissible_values:
      filename_rule:
        description: >-
          A rule matching on the file name or its extension (tiers 1-2 of
          unified_rules.yaml). The extension is part of the name, so both tiers
          are this kind.
      header_rule:
        description: >-
          A rule matching on fetched header content (tier 3 of
          unified_rules.yaml).
      contig_detection:
        description: >-
          Read from the contig or sequence declarations in the file's own bytes —
          SAM ``@SQ``, VCF ``##contig``, FASTA sequence names, GFA ``SN`` segment
          tags, BED contig names and coordinates.
      content_read:
        description: >-
          Read from the file's bytes, but not from contig declarations — today the
          member names in an archive head. Separate from `contig_detection` so
          neither has to describe the other.
      derivation_inheritance:
        description: >-
          Inherited from a related file rather than determined for this one, as an
          index file inherits its parent's classification.
      external_ground_truth:
        description: >-
          An external catalog or authority published outside AnVIL, e.g. the HPRC
          Data Explorer.
      repository_metadata:
        description: >-
          A table the submitter wrote, carried by the repository — an AnVIL verbatim
          manifest's submitter table.
      repository_activity:
        description: >-
          The repository's own record of a step — AnVIL's `anvil_activity` table, whose
          columns are FSS's and the same in every dataset (#583): which files and
          samples a step used, which files it generated, and what the source calls
          the step. It says how a file was made, not what a file is, so it is written
          only as lineage evidence (`LineageRow`), never as slot evidence.
      published_value:
        description: >-
          The value the repository's own system of record publishes for the file
          (#497) — AnVIL's harmonized `anvil_file` columns, today read as the
          verbatim manifest copies that TDR table (claims contract 7.12). Distinct
          from `repository_metadata` so a reader of a conflict can tell the
          repository's official value from a submitter's opinion.
      wrangler_annotation:
        description: >-
          A human curator's decision, recorded deliberately rather than inferred.
      identifier_rule:
        description: >-
          One of our identifier rules (`rules/sample_namespaces.yaml`), from the identifier
          alone (#693): a rule naming a sample and a donor with one string says the sample
          was collected from the donor with the same identifier.

  importer_source_type_enum:
    description: >-
      The kinds of source an importer may write, and so the kinds an evidence
      file's envelope may declare (#421). A strict subset of `source_type_enum`,
      excluding two groups for two reasons.

      The inference kinds, because a file declaring `filename_rule` would be
      naming our own rule engine as its publisher.

      And `wrangler_annotation`, because a curator does not reach us as evidence.
      The claims contract 1.6 puts it plainly — a curator "is unlike every other
      in how it enters: as rules, not as evidence" — and 1.7 makes a decision
      about a single file a rule whose selection matches one file. Accepting one
      here would let the curator table (#397) be built as an importer against a
      format that takes it and a resolution stage with nowhere to put it.

      Listed rather than derived because LinkML has no enum-subset construct that
      `gen-json-schema` honours; `test_the_external_source_types_are_a_subset`
      pins the two so a value can be added to one and not lost from the other.
      The values carry no description of their own for the same reason the pin
      exists: `source_type_enum` defines these terms, and a second copy of that
      prose could drift from it without any test noticing.
    permissible_values:
      external_ground_truth:
        description: As in `source_type_enum`.
      repository_metadata:
        description: As in `source_type_enum`.
      repository_activity:
        description: As in `source_type_enum`.
      published_value:
        description: As in `source_type_enum`.

  claim_state_enum:
    description: >-
      Why a claim that consulted a source produced no vocabulary value (issue
      #392). The first three (`unmapped`, `no_vocabulary_term`, `declined`) were
      observed in the spike over three real producers on `AnVIL_HPRC_R2`; none of
      them declares a value, so none competes in resolution. `mixed` was added for
      inheritance (contract 4.9, #571): an inherited claim's only, and reconcile weighs it. `mapped` is not a member: a claim that mapped carries a `value`,
      and `not_applicable` / `not_classified` remain statuses, unchanged.
    permissible_values:
      unmapped:
        description: >-
          The source said something and no map entry covers it, e.g.
          `library_selection=RANDOM`. The review queue: a mapping may be owed.
      no_vocabulary_term:
        description: >-
          The raw value was mapped deliberately to nothing because the vocabulary
          has no term for it, e.g. `Hi-C`, `CenSat`. A recorded decision, not a
          gap in the mapping.
      declined:
        description: >-
          This column is not an authority on this dimension, so no claim is made
          from it whatever it says. A property of the (source, column, dimension)
          triple, not of a value: `alignments_v2.location` points at pangenome
          graphs and at a VCF of variants under one column, so neither a
          value-level mapping nor a finer key can fix it.
      mixed:
        description: >-
          An inherited claim only (contract 4.9, #571): the parents in one input role
          gave different answers, or one of them is itself mixed. It is the one state
          that takes part in resolution: alone it leaves the slot `not_classified`,
          and against a value or `not_applicable` from any other declaration it is a
          conflict.

  join_key_enum:
    description: >-
      A key by which a claim is attached to a row in the target system (issue
      #392, extended in #401). One vocabulary in two positions: an evidence file's
      envelope declares which of these it is keyed by (`EvidenceFileEnvelope.
      target_key`), and a claim records which one actually attached it
      (`Evidence.join_key`) once the join has run.

      These are keys of the *target*, not names a source publishes. A source keyed
      by an ENA run accession adds no term here: its importer maps that accession
      to one of these and writes the value in the target's space, which is what
      keeps corpus knowledge in the importer and transform logic out of the join.

      Measured on the AnVIL corpus, 708,088 records. The keys differ enormously in
      how far they can be trusted, which is why the one used is recorded per claim
      (#390).
    permissible_values:
      file_id:
        description: >-
          The target's own file identifier. Present on every AnVIL record and unique on
          every record — with `drs_uri`, a key that needs no scope, and the durable
          one across a re-index (#433).
      entry_id:
        description: >-
          The target's entry identifier, Azul's per-index document id. Present and
          unique on every record of the compact-derived corpus, where
          `(file_md5sum, entry_id)` and `(file_name, entry_id)` are each unique
          corpus-wide — but absent from a corpus derived from a TDR snapshot's tables
          (#499), where a target keyed on it joins nothing.
      drs_uri:
        description: >-
          DRS URI. Present and unique on every record of the AnVIL corpus.
      file_path:
        description: Full path, where the target publishes one.
      file_md5sum:
        description: >-
          Content checksum. Present on every record and non-unique on 1.72% of
          them (12,203 rows): 8,119 of those collide inside a single dataset and
          4,084 across datasets, so a dataset scope narrows the ambiguity without
          removing it. Note that a record
          whose md5 was synthesized from its URL rather than its content can never
          match one carrying a real checksum.
      file_name:
        description: >-
          Bare file name, and often the only key a catalog publishes. The weakest:
          present on every record but non-unique on 69.4%. Collisions are wildly
          per-dataset — 2 rows in 16,271 within `AnVIL_HPRC_R2`, against 99.3%
          within `ANVIL_1000G_PRIMED_data_model` — so it is usable only with a
          dataset scope, which is what `EvidenceTarget.dataset` is for.
      entity_identifier:
        description: >-
          A donor's or sample's identifier as the source wrote it (`HG00096`), the key of
          an entity evidence file (`EntityEvidenceRow`, #693) and of the claims made from
          it. Never a file's key: a slot or lineage evidence file keyed by it is refused.
          Read through `rules/sample_namespaces.yaml` at reconcile, in the envelope's
          target dataset.

  lineage_parent_key_enum:
    description: >-
      What kind of value a `LineageRow`'s `parent` is (#583). A locator says where a
      file is; an identifier says which file or sample.
    permissible_values:
      drs_uri:
        description: A locator, the DRS URI, as a submitter table's file-link column holds it.
      file_id:
        description: AnVIL's own file identifier, as `anvil_activity`'s `used_file_id` holds it.
      biosample_id:
        description: >-
          A sample's identifier, as `anvil_activity`'s `used_biosample_id` holds it. A
          sample is not a file; reconcile builds no input from one (#577).
      external_file:
        description: >-
          A file held outside AnVIL for the child's dataset, by its address
          (`github:<owner>/<repo>@<commit>/<path>`), as `sources/external_files.yaml`
          declares it (#710). A workaround until AnVIL holds the file (#624). Reconcile
          resolves it only to a file declared for the child's dataset.

  identifier_namespace_enum:
    description: >-
      The authority that issued a sample or donor identifier (ADR-0002 decision 1, settled
      by #357). Which strings each recognises is `rules/sample_namespaces.yaml`'s.
    permissible_values:
      coriell:
        description: >-
          The Coriell Institute's repository numbers (`HG`/`NA`/`GM` and five digits), as
          1000 Genomes, HPRC and T2T name their samples. `GM` (a cell line) and `NA` (DNA
          extracted from it) with the same number are one sample.
      giab:
        description: >-
          Genome in a Bottle's names for its reference samples, `HG001` to `HG007`; the same
          people under other names in `coriell` are not joined to them here (#361).
      sra_sample:
        description: An SRA, ENA or DDBJ sample accession (`SRS`/`ERS`/`DRS`).
      biosample:
        description: An NCBI, EBI or DDBJ BioSample accession (`SAMN`/`SAMEA`/`SAMD`).
      igvf:
        description: >-
          The IGVF Data Portal's donor and sample accessions (`IGVFDO` or `IGVFSM` and eight
          capitals or digits, #693, #669), as AnVIL_IGVF_Mouse_R1's `donor` and `sample` tables
          name its mice and their samples.
      dataset_local:
        description: >-
          A name one dataset gives its samples, unique only within it; recognised only by a
          rule declared for that dataset.

  evidence_marker_enum:
    description: >-
      Kind of synthetic resolution marker on an evidence entry (issue #228): a
      note that no claim was made or that claims conflicted, rather than a claim.
    permissible_values:
      not_classified:
        description: No rule or content classifier determined a value.
      conflict:
        description: Claims disagreed at the top tier, so the field is ambiguous.
