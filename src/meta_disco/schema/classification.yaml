  reference_name_source_enum:
    description: >-
      Which part of a file's header a declared reference name was read from
      (issue #354). See ``ReferenceBuild.name_source``.
    permissible_values:
      reference_field:
      command_line:

  assay_type_enum:
    description: >-
      The experimental method that produced a file's data, in terms borrowed from EFO
      (#533), which CELLxGENE requires for assays. `meaning` is the EFO term a value
      names, recorded and never followed at run time; `Histology`'s is OBI's
      `histological assay` as EFO imports it. The values form an `is_a` tree of EFO's
      terms, each under its nearest EFO ancestor among the values; `is_a` names one
      parent, so where EFO gives a term two, the one outside the vocabulary is left
      out (`snRNA-seq`'s `transcription profiling by high throughput sequencing`). The
      loss that matters is `SHARE-seq`'s: EFO places it under single-cell RNA
      sequencing and scATAC-seq, so it sits under `sc/snRNA-seq`, the first's parent
      here, and a filter on the `ATAC-seq` subtree does not reach it (#567). Where EFO has no term as narrow as a
      source, the value is our own, carries no `meaning`, and sits under the EFO term
      it narrows: EFO has single-cell ATAC-seq terms but none for single-nucleus, so
      `snATAC-seq` sits under `sc/snATAC-seq`. A record holds one term, the most
      specific its evidence supports; a consumer that filters on a parent walks `is_a`.
    permissible_values:
      WGS:
        description: >-
          EFO's whole genome shotgun sequencing: EFO has no term labelled whole genome
          sequencing, and OBI's whole genome sequencing assay is not among its imports.
        meaning: EFO:0003744
      WES:
        meaning: EFO:0005396
      "RNA-seq":
        meaning: EFO:0008896
      "sc/snRNA-seq":
        description: >-
          Single-cell or single-nucleus RNA-seq, EFO's parent of both: the term for a
          file whose evidence says single-cell but not which.
        is_a: "RNA-seq"
        meaning: EFO:0920118
      "snRNA-seq":
        is_a: "sc/snRNA-seq"
        meaning: EFO:0009809
      "SHARE-seq":
        description: Joint chromatin accessibility and RNA from the same nuclei.
        is_a: "sc/snRNA-seq"
        meaning: EFO:0022962
      "ATAC-seq":
        meaning: EFO:0007045
      "sc/snATAC-seq":
        is_a: "ATAC-seq"
        meaning: EFO:0920117
      "snATAC-seq":
        description: >-
          Single-nucleus ATAC-seq. Our own term: EFO's children of sc/snATAC-seq are
          single-cell only, so no EFO term is as narrow, and it records none.
        is_a: "sc/snATAC-seq"
      "ChIP-seq":
        meaning: EFO:0002692
      "Bisulfite-seq":
        meaning: EFO:0003753
      "Methylation array":
        meaning: EFO:0002759
      "Genotyping array":
        description: >-
          EFO's genotyping by array: polymorphisms in DNA read on an array (an Illumina
          genotyping BeadChip, #603). None of EFO's parents of it (genotyping, DNA assay,
          assay by array) is a value here, so it names no `is_a`.
        meaning: EFO:0002767
      Histology:
        meaning: OBI:0600020

