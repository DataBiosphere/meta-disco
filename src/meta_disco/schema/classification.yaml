  variant_kind_enum:
    description: >-
      The kinds of variant a callset holds (ADR-0003, #654), read from the caller that made
      it. EDAM states a callset's kind through the operation that made it, not as a data
      subtype, so each term records that operation as its `meaning` where EDAM has one.
    permissible_values:
      small:
        description: >-
          Single-nucleotide variants and short insertions and deletions, as a small-variant
          caller (GATK HaplotypeCaller, DeepVariant) calls them. EDAM splits this between
          SNP detection (operation_0484) and indel detection (operation_0452) under Variant
          calling (operation_3227), whose own definition also takes in structural variants;
          no one EDAM term is exactly this, so none is recorded.
      structural:
        description: >-
          Structural variants (deletions, insertions, duplications, inversions, breakends,
          typically 50 bp or more), as a structural-variant caller (Sniffles, SVIM) calls
          them.
        meaning: EDAM:operation_3228

  variant_origin_enum:
    description: >-
      Where a callset's variants arose (ADR-0003, #658), read from the caller that made it:
      Sequence Ontology's two children of variant_origin (SO:0001762).
    permissible_values:
      germline:
        description: >-
          Variants present from the embryo on, in every cell, as a germline caller (GATK
          HaplotypeCaller and joint genotyping, DeepVariant, Sniffles in its default mode)
          calls them.
        meaning: SO:0001778
      somatic:
        description: >-
          Variants arisen after the embryo split, in some cells only, as a somatic caller
          (GATK Mutect2) calls them against a matched normal.
        meaning: SO:0001777

  phenotypic_sex_enum:
    description: >-
      A donor's phenotypic sex (#693), in AnVIL's values: AnVIL's published
      `anvil_donor.phenotypic_sex` writes `Female` and `Male`, and its data model's coding
      system for the slot is PATO's phenotypic sex (PATO:0001894), whose children are the
      `meaning`s. A value no source writes is not listed; one is added when a source does.
    permissible_values:
      Female:
        meaning: PATO:0000383
      Male:
        meaning: PATO:0000384

  organism_type_enum:
    description: >-
      A donor's organism (#699), in AnVIL's values: AnVIL's published
      `anvil_donor.organism_type` writes `Human` and `Mouse`, and its data model suggests
      NCBITaxon for the slot, whose species terms are the `meaning`s. A value no source writes
      is not listed.
    permissible_values:
      Human:
        meaning: NCBITaxon:9606
        description: Homo sapiens
      Mouse:
        meaning: NCBITaxon:10090
        description: Mus musculus

  reported_ethnicity_enum:
    description: >-
      A donor's reported ethnicity (#699), in AnVIL's values, which are the US census's
      categories. AnVIL's data model suggests HANCESTRO, but HANCESTRO has no term for these
      categories (its nearest, `European American`, `African American` and `Hispanic or
      Latin`, are narrower), so no value has a `meaning`. A value no source writes is not
