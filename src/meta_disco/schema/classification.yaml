id: https://github.com/DataBiosphere/meta-disco/blob/main/src/meta_disco/schema/classification.yaml
name: meta_disco_classification
title: Meta-Disco File Classification Model
description: >-
  Full classification data model for meta-disco: the eight metadata dimensions,
  per-field evidence, classification status, and typed derivation edges. Supersedes
  the retired anvil_file.yaml stub (issue #33) and realizes the data-model decision
  record in docs/derived-file-data-model.md.

  Authoring source of truth. `make gen` generates JSON Schema and Pydantic from
  this file (via `gen-json-schema` / `gen-pydantic`) — do not hand-edit the
  generated copies. The schema's vocabulary backs the rule drift check
  (tests/test_rule_vocabulary.py), and `ClassificationRecord` now matches the
  pipeline output shape (`{..., "classifications": {...}}`, see
  docs/derived-file-data-model.md section 5a) so whole records validate against it
  (schema/tests/test_output_validation.py, run closed=False, so any unmodeled key is
  tolerated; in practice the pipeline's only such extras are the fastq scalar hints
  inside `classifications` — modeling them is a #134 follow-up).
  Adopting typed records in the pipeline is done: `run()` parses each routed record
  into a typed view at the load boundary (`src/meta_disco/records.py`, #172).

prefixes:
  linkml: https://w3id.org/linkml/
  anvil: https://github.com/DataBiosphere/meta-disco/schema/
  EFO: http://www.ebi.ac.uk/efo/EFO_
  OBI: http://purl.obolibrary.org/obo/OBI_
  EDAM: http://edamontology.org/
  SO: http://purl.obolibrary.org/obo/SO_
  TerraCore: "https://datamodel.terra.bio/TerraCore#"
  MODAL: "https://datamodel.terra.bio/BioCoreTerms#"
  insdc.gca: "https://identifiers.org/insdc.gca:"
  HANCESTRO: http://purl.obolibrary.org/obo/HANCESTRO_
  PATO: http://purl.obolibrary.org/obo/PATO_
  NCBITaxon: http://purl.obolibrary.org/obo/NCBITaxon_
default_prefix: anvil
default_range: string

imports:
  - linkml:types

# =============================================================================
# CLASSES
# =============================================================================
classes:

  ClassificationRecord:
    tree_root: true
    description: >-
      One classified file. `classifications` carries the file's identity (the
      eight dimension fields — what it is); generated_by names the step that made it
      and the files it used (where it came from; ADR-0002). Matches the
      pipeline output shape.
    slots:
      - md5sum
      - file_name
      - file_format
      - file_size
      - entry_id
      - file_id
      - drs_uri
      - dataset_title
      - classifications
      - generated_by
      - samples

  Classifications:
    description: >-
      The eight metadata dimensions for one file, each a Classification entry.
      The pipeline also emits some file-type-specific scalar hints here (e.g.
      fastq's is_paired_end / instrument_hint); those are not modeled yet and
      pass under the gate's closed=False mode (see #134 follow-up).
    slots:
      - data_modality
      - data_type
      - reference_assembly
      - assay_type
      - platform
      - instrument_model
      - variant_kind
      - variant_origin
    slot_usage:
      data_modality:
        range: DataModalityClassification
        required: true
      data_type:
        range: DataTypeClassification
        required: true
      reference_assembly:
        range: ReferenceAssemblyClassification
        required: true
      assay_type:
        range: AssayTypeClassification
        required: true
      platform:
        range: PlatformClassification
        required: true
      instrument_model:
        range: InstrumentModelClassification
        required: true
      variant_kind:
        range: VariantKindClassification
        required: true
      variant_origin:
        range: VariantOriginClassification
        required: true

  Classification:
    abstract: true
    description: >-
      A single classified field: its resolved value (null unless status is
      'classified'), a status sentinel, and the evidence behind it. Subclasses
      narrow `value` to the right enum per dimension. A reconciled record (#432)
      carries the same entry plus `use`, `inferred` and `credited_to` (#552); an
      inference record carries none of them. A donor's or sample's slot (#693, #699) carries
      `use` and neither of the other two, its subclass requiring it.
    slots:
      - value
      - status
      - evidence
      - use
      - inferred
      - credited_to

  InferredConclusion:
    abstract: true
    description: >-
      What inference concluded for a slot before reconciliation (#432): its tier-resolved
      status and value, as the inference record states them. On a reconciled record so
      it reads alone (contract 6.10) — inference's evidence cannot rebuild it without
      re-running tier resolution. Subclasses narrow `value` to the dimension's enum, as
      the Classification subclasses do.
    slots:
      - value
      - status

  DataModalityInferred:
    is_a: InferredConclusion
    slot_usage:
      value:
        range: data_modality_enum

  DataTypeInferred:
    is_a: InferredConclusion
    slot_usage:
      value:
        range: data_type_enum

  ReferenceAssemblyInferred:
    is_a: InferredConclusion
    slot_usage:
      value:
        range: reference_assembly_enum

  AssayTypeInferred:
    is_a: InferredConclusion
    slot_usage:
      value:
        range: assay_type_enum

  PlatformInferred:
    is_a: InferredConclusion
    slot_usage:
      value:
        range: platform_enum

  InstrumentModelInferred:
    is_a: InferredConclusion
    slot_usage:
      value:
        range: instrument_model_enum

  VariantKindInferred:
    is_a: InferredConclusion
    slot_usage:
      value:
        range: variant_kind_enum
        multivalued: true

  VariantOriginInferred:
    is_a: InferredConclusion
    slot_usage:
      value:
        range: variant_origin_enum

  DataModalityClassification:
    is_a: Classification
    slot_usage:
      value:
        range: data_modality_enum
      inferred:
        range: DataModalityInferred

  DataTypeClassification:
    is_a: Classification
    slot_usage:
      value:
        range: data_type_enum
      inferred:
        range: DataTypeInferred

  ReferenceAssemblyClassification:
    is_a: Classification
    slots:
      - build
    slot_usage:
      value:
        range: reference_assembly_enum
      inferred:
        range: ReferenceAssemblyInferred

  AssayTypeClassification:
    is_a: Classification
    slot_usage:
      value:
        range: assay_type_enum
      inferred:
        range: AssayTypeInferred

  PlatformClassification:
    is_a: Classification
    slot_usage:
      value:
        range: platform_enum
      inferred:
        range: PlatformInferred

  InstrumentModelClassification:
    is_a: Classification
    slot_usage:
      value:
        range: instrument_model_enum
      inferred:
        range: InstrumentModelInferred

  VariantKindClassification:
    is_a: Classification
    description: >-
      The one dimension whose value is a list (ADR-0003): a callset can hold small variants
      and structural ones at once, and a list names both without a combined term. Each
      claim in `evidence` declares one kind, a string; the list is the settled value.
    slot_usage:
      value:
        range: variant_kind_enum
        multivalued: true
      inferred:
        range: VariantKindInferred

  VariantOriginClassification:
    is_a: Classification
    slot_usage:
      value:
        range: variant_origin_enum
      inferred:
        range: VariantOriginInferred

  ReferenceBuild:
    description: >-
      The specific reference build a file was aligned to (issue #340): the
      observations a header offers about its reference, and the build they
      identify, if any. Where the header's contig lengths detect a family, the
      build resolves inside it, and the build has a term of its own (the CHM13
      releases and hybrids), that term is the value of ``reference_assembly``
      (issue #473); the patch within a GRC release, which the vocabulary does
      not name, stays here.

      ``chr1_m5``, ``chry_m5``, ``name`` and ``name_source`` are OBSERVED, read
      from the file's own header. ``base`` and ``version`` are DERIVED by
      matching those observations against a table of known builds. ``version``
      is null unless the evidence identifies exactly one build; ``base`` is
      filled whenever every candidate agrees on the family, which is often true
      when the version is not. An ambiguous file keeps its observations rather
      than being assigned a nearest match.

      Not a claim itself: it carries no tier and never competes in claim
      resolution. It sets the value only through the contig-detection claim,
      which takes the build's term in place of the family's. Absent entirely when
      nothing was observed.

      Declared as class-local ``attributes`` rather than global ``slots``:
      ``name``, ``base`` and ``version`` are the kind of identifier that collides
      across a shared namespace, and nothing outside this class needs them.
    attributes:
      base:
        range: reference_family_enum
        description: >-
          Assembly family of the resolved build (``CHM13``, ``GRCh38``), derived by
          the resolver from exact signatures. Where both are known it is the value
          or an ancestor of it, since a contradicting one is dropped (#345);
          recorded here so a build is readable on its own; null when no single
          family was identified. Range-constrained to the families rather than
          merely documented as such, so a table entry naming a release, a hybrid or
          anything outside the vocabulary fails validation instead of passing.
      version:
        description: >-
          Build version within the family. Free text by necessity: T2T releases
          (``v1.0``, ``v1.1``, ``v2.0``) and GRC patches (``p12``) are not the same
          kind of thing, and CHM13 has no patch concept. Where a build grafts a
          chromosome from elsewhere the origin is part of the version
          (``v1.0+GRCh38chrY``), because that is a real difference in the reference.
          Null unless the evidence identifies exactly one build.
      chr1_m5:
        description: >-
          MD5 of the chr1 sequence, from SAM ``@SQ M5``. Identifies the sequence, not
          the packaging: two references with different decoy or alt content share this
          value when their chr1 is the same. Null for VCF, whose ``##contig`` md5
          attribute is optional in the specification and unpopulated in practice.
      chry_m5:
        description: >-
          MD5 of the chrY sequence, from SAM ``@SQ M5``. Recorded because chr1 alone
          cannot separate some builds — CHM13 v2.0 is v1.1 plus a chrY, so their
          autosomes are identical. One build can appear with more than one value here
          at identical chrY length; the header cannot say why, so both are recorded
          as observations and neither is preferred.
      name:
        description: >-
          Reference filename as the file declares it, from SAM ``@SQ UR`` or VCF
          ``##reference`` when present, else from a program command line in the
          header (``@PG CL``, ``##GATKCommandLine``; issue #354) — ``name_source``
          says which. An observation about the file, not a statement about the
          reference's content: one name can denote references that differ, and
          differently-named references can be identical.
      name_source:
        range: reference_name_source_enum
        description: >-
          Where ``name`` was read from. ``reference_field`` is the field that
          exists to carry it; ``command_line`` is the command line of the program
          that produced the file, one step further from the file, and taken only
          when the header declares contigs, every command line that names a
          reference names the same one, and (for VCF) the file carries no liftover
          INFO fields. Null when ``name`` is null.

  ClaimSource:
    description: >-
      Identity of a source that produced a claim, for a source that is not one of
      our rules (issue #392): an external catalog, a submitter manifest, a curator
      table. Names the source, the table or file within it, and the column the raw
      value was read from — the granularity at which a mapping is reviewed and at
      which a column can be `declined` as an authority for a dimension.

      A claim from one of our own rules carries `rule_id` and no source object.
      An external claim carries this *and* a `rule_id`, which names the mapping
      entry that turned the raw value into one of ours — an identity mapping
      included, since a source value that happens to spell a vocabulary term is a
      coincidence of spelling rather than an agreement about meaning. The one
      external claim with no rule is `unmapped`, which means exactly that no entry
      exists for the raw value (#401).

      Declared as class-local ``attributes`` rather than global ``slots``:
      ``name``, ``url``, ``dataset``, ``table`` and ``column`` are words too
      generic to own in a shared namespace, and nothing outside this class needs
      them. Evidence files (#401) carry all of these but ``column`` once per file in
      their envelope, and put ``column`` on each claim — one shape, factored, not
      a second one.
    attributes:
      name:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          Name of the source, e.g. ``AnVIL`` or ``HPRC Data Explorer``. Required:
          a source object with no name identifies nothing, and ``to_dict`` omits
          null members, so an unnamed source would serialize as a bare url or
          column with no owner.
      url:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          URL the source was read from, if it has one. Null for a source with no
          published address, such as a curator table held in this repository.
      dataset:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The collection within the source that the claim came from — an AnVIL
          dataset title, an HPRC release, an ENA study accession. Null for a
          source with no such level.

          Carried on the claim and not only on the evidence file's envelope because
          it is what makes `column` legible: the same column name means different
          things in different datasets, and a consumer reading this evidence
          cannot go back to the file the claim arrived in (#401).
      table:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The table or file within the source that the claim came from, e.g. an
          AnVIL verbatim manifest table name. Null when the source is a single
          undivided file.
      column:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The column within that table the raw value was read from. Null when the
          source has no column structure.

  EvidenceFileSource:
    description: >-
      Where a whole evidence file's claims were read from (issue #401) — the `source`
      on a `EvidenceFileEnvelope`.

      Three levels, because a source is not flat: a repository publishes datasets,
      and a dataset has tables. The AnVIL manifests are `AnVIL / AnVIL_HPRC_R2 /
      alignments_v2`; the HPRC Data Explorer is `HPRC Data Explorer / R2 /
      sequencing-data`; ENA is `ENA / <study accession> / read_run`, where
      `read_run` is literally the `result=` parameter its API takes and the fields
      it returns are the columns. A source with no middle level leaves `dataset`
      null, as `table` may be null.

      Distinct from `ClaimSource` rather than reusing it. A row's source carries a
      `column`, which belongs to the row because one table's rows are read from
      several columns; a file's source carries a `dataset`, which belongs to the
      file because every row in it came from the same one. Modeling them as one
      class would let an envelope name a column that could disagree with every
      line in the file.
    attributes:
      repository:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          What publishes the source — `AnVIL`, `HPRC Data Explorer`, `ENA`.
          Required and non-empty: a source that names no repository identifies
          nothing.
      dataset:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The collection within that repository the claims were read from. Null
          for a source with no such level.
      table:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The table or file within the dataset — `alignments_v2`,
          `sequencing-data`, ENA's `read_run`. Null for a source with no table
          structure. The column within it stays on each claim.
      url:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          Where the source was read from, if it has a public address. Null for a
          source with none, such as a curator table held in this repository.

  EvidenceTarget:
    description: >-
      The system an evidence file's claims are *about* (issue #401) — the `target` on
      a `EvidenceFileEnvelope`.

      An evidence file says "the row in this system whose this key is that value". The
      target names the system, so an importer is not implicitly bound to AnVIL and
      the file records which system it resolved its keys against.

      The mapping from the source's own names to these is the importer's
      knowledge: the source calls its collection `R2`, the target calls the same
      thing `AnVIL_HPRC_R2`. The importer records both sides and the run performs
      equality lookup only.
    attributes:
      system:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The system the claims are about — `anvil` today. Required: a claim with
          no target is about nothing.
      dataset:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The scope the join runs within, in the *target's* name for it. Not
          decoration: keyed by `file_name` alone, 69% of the AnVIL corpus's
          708,088 rows carry a non-unique key, and 20% remain non-unique scoped by
          dataset title alone — but within `AnVIL_HPRC_R2` the collision rate is 2
          rows in 16,271. A filename join is unusable without a dataset scope and
          reliable with one.

          Null for a source whose key is unique across the whole target
          (`file_id`, `entry_id`, `drs_uri`), where a corpus-wide match is correct.
      version:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          Which generation of the target the importer resolved against — an AnVIL
          catalog such as `anvil15`. Null when the importer did not resolve
          against a particular generation, which is the ordinary case for a source
          that publishes names and values rather than reading our catalog.

          Inference reports it and refuses nothing on it. The reconcile stage (#432)
          uses it as a gate: where the run's input envelope names a catalog, it reads
          only the files whose version equals that catalog, and leaves the rest (an
          older generation's history, or a null version) unread. Nothing offline
          establishes which generation is current beyond that — AnVIL deletes a
          superseded catalog rather than keeping it to be compared against.


  EvidenceRow:
    description: >-
      One line of an evidence file after the envelope (#401, amended by #421): an
      observation, not an answer. It reads "about the row in the envelope's
      `target` whose `target_key` equals `target_key_value`, the source wrote
      `raw_value` for `field`".

      **It declares nothing.** No `value`, no `status`, no `claim_state`, no
      `rule_id` and no `tier` — an importer maps structure and the rule engine maps
      meaning (contract 1.1, 1.3). The claim that reconcile eventually makes from
      this row is an `Evidence`, which is the class that carries those; this one is
      what the source said before anyone interpreted it. Validated `closed`, like the
      envelope, and `source_evidence._entry_from_line` refuses each retired member
      by name, so a producer written against #401's format is told what to write
      instead rather than having the member silently dropped.

      **Where this gate is weaker than the reader.** `column` is optional, LinkML
      models an optional slot as nullable (`gen-json-schema` emits
      `type: [string, null]`), so `{"column": null}` is valid here by construction
      — and `_entry_from_line` refuses it, because the writer omits a member it
      does not have and a written-out null is a line this writer could not have
      produced. The envelope, read through the model generated from this schema,
      accepts such a null as the absent member it means (#494); a row is read by
      hand, on the hot path, and keeps the stricter rule.

      The reader is deliberately the stricter of the two, which is the safe
      direction: a producer that validates here and writes explicit nulls is
      refused at read, rather than publishing a file we would later read as
      though the member were absent. Accepting it would be exactly the silent
      normalization every other member refuses.
      `test_a_line_whose_column_is_an_explicit_null_is_refused` pins it.

      Deliberately outside the `ClassificationRecord` tree and referenced by no
      slot in it, for the reason `EvidenceFileEnvelope` is: it describes an
      artefact exchanged *between* runs. Modeled here so that a producer can
      validate a whole evidence file — both its line kinds — against the schema
      rather than against the reader alone.
    slots:
      - raw_value
    slot_usage:
      raw_value:
        required: true
        description: >-
          What the source wrote, verbatim (contract 1.4) — not casefolded, trimmed,
          corrected or suppressed. The same slot an `Evidence` claim carries beside
          its mapped value; on a row it is the whole content, because a row maps
          nothing.

          No pattern and no enum, deliberately: a source's spellings are its own, a
          value our vocabulary has no word for is the review queue's input rather
          than an error (contract 3.7), and an empty cell is something the source
          published, whose meaning is a rule's to decide.
    attributes:
      field:
        required: true
        pattern: "^(data_modality|data_type|platform|reference_assembly|assay_type|instrument_model|variant_kind|variant_origin|samples)\\Z"
        description: >-
          The slot this row speaks to, spelled `field` on the wire and in the code
          (contract 2.1). One of the eight classification dimensions, or `samples`
          (#357): which sample a submitter table says the file's data comes from, read
          through `rules/sample_namespaces.yaml` and never the value map.

          Pinned by pattern rather than by an enum because the dimension names are
          slot *names* in this schema and not a vocabulary it declares;
          `test_the_row_field_pattern_lists_every_dimension` holds it to
          `models.EVIDENCE_FIELDS`.
      target_key_value:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The value to match against the envelope's `target_key`, already in the
          target's value space — the importer owns the mapping between its own key
          and the target's. Empty is refused: a row with nothing to match on can
          attach to no file.
      column:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The column the raw value was read from. The one member of the source
          that varies within a file — repository, dataset, table and url are on
          the envelope — and absent for a source whose table has no columns to
          name.

  LineageRow:
    description: >-
      One line of a lineage evidence file after the envelope (#583): a source saying
      one file was made from one parent. It reads "the row in the envelope's
      `target` whose `target_key` equals `target_key_value` was made from `parent`,
      a `parent_key_type`". The envelope is an `EvidenceFileEnvelope`, as a slot
      evidence file's is; the lines differ, so the two are written under separate
      roots, and the readers of each root read only that root.

      **It declares nothing**, as an `EvidenceRow` declares nothing: no activity, no
      role, no value, no status, no rule id. `raw_activity` is what the source calls
      the step, verbatim; which activity and role that means is the activity
      translation table's (#584), and finding the parent among our files is
      reconcile's (#577).

      One line per (child, parent) pair: a source row naming two parents, or two
      generated files, is written as one line for each pair.

      **At least one of `parent` and `parent_source_identifier`.** A parent named by
      a locator, by AnVIL's identifier or by a sample's identifier is written as
      `parent`. One named by the source's own identifier is written as the locator
      the source's own table gives it, with the identifier kept as
      `parent_source_identifier`; when that table has no row for it, or rows naming
      several locators, the line carries the identifier alone, so the link is
      still reported. `parent_key_type` is present exactly when `parent` is,
      `raw_activity_column` exactly when `raw_activity` is, and `parent_dataset` only
      with `parent` and never the envelope's own target dataset. gen-pydantic emits no
      class rules, so `lineage_evidence` enforces them at write and at read
      (`check_row`, and `_check_row_in` for the one that needs the envelope).
    attributes:
      target_key_value:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The child, as the envelope's `target_key` names it: AnVIL's `file_id` for
          `anvil_activity`, the DRS URI for a submitter table.
      parent:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The parent, in the form `parent_key_type` names. Written whether or not it
          is one of the dataset's files: reconcile (#577) will report a parent
          outside the dataset, and dropping it here would hide it.
      parent_key_type:
        range: lineage_parent_key_enum
        description: >-
          Which kind of value `parent` is. Named `_type` because
          `ActivityInput.parent_key` is a value, the parent's record key.
      parent_source_identifier:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The source's own identifier for the parent, where the source named the
          parent by one (IGVF's `derived_from` accessions, or the ENA run whose
          reads a T2T_CHRY CRAM holds), kept beside the locator the importer found
          for it.
      parent_dataset:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The dataset the parent is in, where it is not the child's own (#594).
          Absent on every line whose parent is looked for in the child's dataset.
          Written only by the ENA run lineage importer (`ena_lineage`), for a pair of
          datasets its map declares (`sources/ena_run_lineage_map.yaml`); reconcile
          resolves a line carrying it only where that map declares the child's dataset
          taking its reads from this one, and counts any other as
          `undeclared_dataset`.
      raw_activity:
        description: >-
          What the source calls the step, verbatim (contract 1.4), where the source
          names it — `anvil_activity`'s `activity_type`, e.g. `Indexing` or
          `Quantificatioin: salmon`. The empty string is kept; a null or empty-list
          cell is omitted. No pattern and no enum, for `EvidenceRow.raw_value`'s reason.
      activity_id:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The source's id for the step, where it has one (`anvil_activity`'s
          `activity_id`), so lines from one step can be told apart from another's.
      child_column:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: The column the child was read from.
      parent_column:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: The column the parent (or its source identifier) was read from.
      raw_activity_column:
        pattern: "^[^\\r\\n]+\\Z"
        description: The column `raw_activity` was read from; present exactly when it is.

  EntityEvidenceRow:
    description: >-
      One line of an entity evidence file after the envelope (#693): a source saying, about
      one donor, what it wrote for one of the donor's slots, or, about one donor or sample,
      the repository's own identifier for it (#669). It reads "about the donor (or sample)
      the source names `target_key_value` (read from `identifier_column`), the source wrote
      `raw_value` in `column`". The envelope is an `EvidenceFileEnvelope` keyed by
      `entity_identifier`; the lines are written under their own root,
      `data/entity_evidence/`, because every reader of `data/source_evidence/` takes each file
      there as a file's slot lines.

      **It declares nothing**, as an `EvidenceRow` declares nothing: the identifier is the
      string as written, recognised through `rules/sample_namespaces.yaml` at reconcile, and
      the value is the value map's to translate. `entity_evidence` refuses an answer on a
      line by name.
    slots:
      - raw_value
    slot_usage:
      raw_value:
        required: true
        description: What the source wrote, verbatim, as on an `EvidenceRow`.
    attributes:
      field:
        required: true
        pattern: "^(phenotypic_sex|genetic_ancestry|organism_type|reported_ethnicity|mother|father|family_id|biosample_type|anatomical_site|donor_repository_id|sample_repository_id)\\Z"
        description: >-
          The donor slot this line speaks to (a `mother`, `father` or `family_id` line's
          `raw_value` read as written at reconcile, never translated, #582), a sample's slot
          (`biosample_type`, `anatomical_site`, #699; the line is then about the sample the source
          names), or `donor_repository_id` /
          `sample_repository_id` where `raw_value` is the repository's own identifier for the
          donor or sample (#669), which reconcile lists on the record and never translates.
          Pinned to `models.DONOR_FIELDS`, `models.FAMILY_FIELDS`, `models.SAMPLE_SLOTS` and
          `models.REPOSITORY_ID_FIELDS` by
          `test_the_entity_row_field_pattern_lists_every_entity_field`.
      target_key_value:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The identifier the source wrote for the donor, or for the sample on a
          `sample_repository_id` line, verbatim.
      column:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: The column `raw_value` was read from.
      identifier_column:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: The column `target_key_value` was read from.
      identifier_table:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The table `target_key_value` was read from, where it is not the envelope's: AnVIL's
          published `anvil_donor` and `anvil_biosample` name their donor or sample only through
          the submitter row each was made from (`source_datarepo_row_ids`), so their lines take
          the identifier from that row's table.

  EvidenceFileEnvelope:
    description: >-
      What an evidence file records once, for every row in it (issue #401, amended
      by #421). An
      importer runs out of band from classification — when a catalog refreshes,
      with network — and writes an evidence file of `EvidenceRow`s; a run reads it
      and reports this provenance, so that what a run found, and how old it was,
      is on the record. Inference reads each file's envelope and none of its rows;
      the reconcile stage (#432) reads the rows and joins them to the run's records.

      It names both sides of the join, symmetrically: `source` / `source_version`
      / `source_key`, and `target` / `target.version` / `target_key`. A line then
      reads "this row is about the row in `target` whose `target_key` equals its
      `target_key_value`; about that row's `field`, the source wrote its
      `raw_value`."

      **The reader is this class.** `source_evidence` reads line 1 through the
      pydantic model gen-pydantic emits from this schema (#494), so what this gate
      refuses and what the reader refuses are one definition rather than two kept in
      step. An explicit null on an optional member, such as
      `source: {repository: HPRC, table: null}`, is valid here — LinkML models an
      optional slot as nullable — and the reader accepts it as the absent member it
      means, though the writer never emits one. The one known divergence is a
      calendar-invalid `fetched_at` (see that slot).

      The key *names* are here rather than on each line because they do not change
      within a file — every claim an importer writes is keyed the same way — so
      repeating them on a few million lines would be this block written out again.
      Only the key value varies, so only that is on the line. It is the same
      factoring that keeps a source's repository, url and table here while
      `column` stays on each claim.

      Deliberately outside the `ClassificationRecord` tree, and referenced by no
      slot in it: an envelope describes an artefact exchanged *between* runs and
      never appears in a classified record. It is modeled here so that the file a
      claim arrives in is defined where the claim itself is, rather than in an
      importer. On disk the file is NDJSON — this envelope wrapped in a
      `evidence_file` key on line 1, one row per line after it — because millions
      of claims must not be read through a whole-file parse (#374);
      `src/meta_disco/source_evidence.py` is the reader and writer.

      Declared as class-local `attributes` for the reason `ClaimSource` is: these
      are words too generic to own in a shared namespace.
    rules:
      - description: >-
          A file keyed by `file_name` must name the dataset that scopes it. The key
          is non-unique on 69.4% of the AnVIL corpus's 708,088 rows and on 20% even
          scoped by dataset title, against 2 rows in 16,271 within
          `AnVIL_HPRC_R2` — so an unscoped filename claim attaches to rows a join
          cannot choose between. `source_evidence.require_scoped_target` refuses the
          same envelope at write and at read, because gen-pydantic does not emit class
          rules; this rule is what stops a producer validating against the schema
          alone and publishing a file the reader will not read (#401 review).
        preconditions:
          slot_conditions:
            target_key:
              equals_string: file_name
        postconditions:
          slot_conditions:
            target:
              range_expression:
                slot_conditions:
                  dataset:
                    required: true
    attributes:
      source:
        range: EvidenceFileSource
        required: true
        inlined: true
        description: >-
          Where the claims were read from — repository, dataset and table.
          `inlined` for the reason `Evidence.source` is: line 1 carries the whole
          object, and without the declaration a class-valued slot is read as a
          reference rather than as the object the file holds.
      source_type:
        range: importer_source_type_enum
        required: true
        description: >-
          Which kind of external source this file was read from. On the envelope
          rather than on every row for the reason the key names are: one
          repository, dataset and table is one kind of source, so it is checked
          once per file rather than a few million times, and reconcile reads it
          from here when it stamps the claim it makes from a row (#421).

          Restricted to the kinds an importer may write. A file declaring
          `filename_rule` would be naming our own rule engine as its publisher,
          and one declaring `wrangler_annotation` would be a curator arriving as
          evidence, which contract 1.6 routes to rules instead.
      source_version:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The version of the source the claims were taken from — a release tag, a
          publication date, a catalog generation. Required even where the source
          publishes no version of its own: an evidence file that cannot say what it
          was built from cannot be reasoned about later.
      source_key:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The key the *source* publishes its rows by, in the source's own name for
          it — `filename`, `run_accession`, `object_id`. Recorded as provenance:
          the values on each line are already in the target's space, so the run
          never reads this, but a person auditing the file needs to know which
          column of the source produced them.
      target:
        range: EvidenceTarget
        required: true
        inlined: true
        description: >-
          The system the claims are about, the scope within it, and the generation
          resolved against.
      target_key:
        range: join_key_enum
        required: true
        description: >-
          Which key of the target each line's `target_key_value` is to be matched
          against. Drawn from `join_key_enum`.
      fetched_at:
        required: true
        pattern: "^\\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])[T ]([01]\\d|2[0-3]):[0-5]\\d(:[0-5]\\d(\\.\\d+)?)?([+-]([01]\\d|2[0-3]):[0-5]\\d|Z)?\\Z"
        description: >-
          When the importer read the source, ISO 8601, with a time of day and not
          a date alone. A run reports the age of every evidence file it finds from
          this, so that a person can see an artefact going stale before it is
          wrong — and two imports on the same day, which is where that report
          matters most, are only distinguishable if the time is recorded. A
          date-only value is refused rather than read as midnight, which would be
          a precision the file never stated.

          Constrained by pattern rather than `range: datetime`, which was measured
          and does not do the job: LinkML coerces the value before matching, so a
          bare `2026-09-01` is accepted under a datetime range — and the pattern is
          then never applied. An evidence file would pass this schema and be reported
          unreadable by the reader, which is the mismatch this class's tests exist
          to prevent.

          The trade is deliberate: a consumer generating models from this schema
          gets a string rather than a datetime. The reader parses it either way,
          and the pattern says what the string must look like, so what is given up
          is a type hint and what is bought is that both sides refuse the same
          files.

          The pattern spells out the field ranges rather than accepting any
          non-newline text after the separator, because the loose form let
          `2026-09-01Tfoo` and `2026-13-45T99:99:99` through the gate for the
          reader to refuse. Measured across seventeen shapes, the two sides now
          agree on sixteen. The one that remains is a date no regex can rule out:
          `2026-02-30T09:14:03` is well-formed and not a day, so the reader stays
          the authority on whether a well-shaped timestamp is a real instant
          (#401 review).

          The offset is `±HH:MM` or `Z` and nothing more. An offset carrying
          seconds, `+01:00:30`, is a shape `datetime.fromisoformat` happens to
          take and RFC 3339 does not have; the reader parses with pydantic, which
          refuses it, and no source emits one — so the pattern refuses it too
          rather than admitting a file the reader will not read (#494 review).

  Evidence:
    description: >-
      One piece of supporting evidence. Either a claim (declares a value, a
      status, or a claim_state, and carries a source_type), or a synthetic
      resolution marker (carries marker, no rule_id) recording that no claim was
      made or that claims conflicted.

      A claim from one of our rules or content classifiers carries rule_id + tier,
      except an inherited one (`derivation_inheritance`, made at reconcile, contract
      4.9, #571), which carries no tier — it never reaches the rule ladder — and names
      the step it crossed in `activity`, `parent_role` and `parent_keys`.
      A claim from an external source (issue #392) carries `source` as well as a
      rule_id — the mapping entry it fired, not a rule of ours — and no tier,
      because an import does not compete on the rule ladder (#401). It carries the
      raw value it read and, once the join has run, how it was matched to our file. Evidence that is
      neither — the note left when a fetch or the input contract failed — carries
      a rule_id and a reason but declares nothing.
    slots:
      - rule_id
      - marker
      - reason
      - value
      - status
      - claim_state
      - tier
      - competing_values
      - source_type
      - source
      - raw_value
      - join_key
      - match_exact
      - activity
      - parent_role
      - parent_keys
    slot_usage:
      # A rule's claimed value / status for this dimension, and the rule tier it
      # fired at. status is optional on evidence (only sentinel-bearing evidence
      # carries it), unlike the required status on a Classification entry.
      status:
        required: false
      # On an inherited claim only (contract 4.9, #571): the step it crossed, the role
      # its parents play in it, and their record keys. Required on a step, not here.
      activity:
        required: false

  GeneratedBy:
    description: >-
      The one step that made a file and the inputs it used (PROV's `wasGeneratedBy` and
      `used`, ADR-0002 decision 3, #580). `named_by` lists every source that named the
      step; each input lists its own.
    slots:
      - activity
    attributes:
      named_by:
        range: Attribution
        multivalued: true
        inlined_as_list: true
        required: true
      inputs:
        range: ActivityInput
        multivalued: true
        inlined_as_list: true
        required: true
        description: The inputs the step used, each in one of the roles its activity declares.

  ActivityInput:
    description: >-
      One input a step used, in one role (PROV's `hadRole`). With `parent_key` it is
      `internal`, without it `external` (ADR-0002 decision 2). An external input with a
      `parent_ref` is a file held outside AnVIL for the dataset (#710), which a role that
      reads through its parents reads through as it does a catalog file.
    slots:
      - parent_file
      - parent_key
      - parent_ref
      - parent_kind
    attributes:
      role:
        required: true
        description: One of the roles its activity declares in `rules/activities.yaml`.
      named_by:
        range: Attribution
        multivalued: true
        inlined_as_list: true
        required: true
      parent_dataset:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The dataset `parent_key`'s record is in, where it is not the child's own: only an
          input resolved through the run lineage map's declared exception (#594, ADR-0002
          decision 2), such as a T2T_CHRY CRAM's reads in ANVIL_T2T. Absent on every input
          whose parent is in the child's dataset.
    slot_usage:
      parent_file:
        required: true

  Attribution:
    description: >-
      One source that named a step, an input (ADR-0002 decision 6) or a file's samples
      (#357): sources that agree are each listed. Samples inherited from a parent (#668)
      name the step crossed and the parent, as an inherited claim does.
    slots:
      - source_type
      - rule_id
      - activity_id
      - source
      - activity
      - parent_role
      - parent_keys
    slot_usage:
      source_type:
        required: true
      rule_id:
        required: true
        description: >-
          The rule or translation row that turned what the source says into this step,
          input or sample list: for inference's, a `code_rules.EDGE_RULES` id for a step or
          input and a `code_rules.SAMPLE_RULES` id for samples; for a submitter table's
          samples, the identifier rule (`rules/sample_namespaces.yaml`) that read the cell;
          for inherited samples, `code_rules.SAMPLES_INHERITED_FROM_PARENT`'s id.
      # On inherited samples only (#668): the step crossed, the role its parent plays in
      # it, and the parents' record keys. Required on a step, not here.
      activity:
        required: false

  SampleReference:
    description: >-
      Which samples a file's data comes from (#357): the run's sample list it points to,
      how many members that list has, and every source that named it. A joint VCF names
      thousands of samples, so
      the members are written as a `SampleList` and each file points to one: once in each
      producer file that points to it (`sample_lists`), and once across the run in the
      reconciled `sample_lists.ndjson.gz`.
    attributes:
      list_id:
        required: true
        pattern: "^[0-9a-f]{16}\\Z"
        description: >-
          The `SampleList` this file points to: a digest of its sorted members, so two files
          naming the same samples point to the same list.
      count:
        range: integer
        required: true
        minimum_value: 1
        description: How many members the list has.
      named_by:
        range: Attribution
        multivalued: true
        inlined_as_list: true
        required: true
        description: >-
          Every source that named these samples: the file's own content, a header or a sample
          map's rows (`code_rules.SAMPLE_RULES`),
          a submitter-table column, the file's parent across a step that passes samples
          (#668), or each of them where they agree.

  ExternalList:
    description: >-
      A list of files held outside AnVIL for a dataset, as reconcile read it (#710, a
      workaround until AnVIL holds the list, #624): a GATK sample-name map that
      `sources/external_files.yaml` declares, the step listing the dataset's files it
      names as members, and the samples its rows name. Written once per run in the
      reconciled `external_lists.ndjson.gz`; an `ActivityInput.parent_ref` points here.
    attributes:
      ref:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: The list's address, `github:<owner>/<repo>@<commit>/<path>`.
      dataset:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: The dataset the list is held for, the only one whose files it names.
      file_name:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
      sha256:
        required: true
        pattern: "^[0-9a-f]{64}\\Z"
        description: The sha256 of the list's text, as declared and as read.
      generated_by:
        range: GeneratedBy
        description: >-
          The list's members, each a file of the dataset carrying the name a row gives.
          Absent where a row's name is carried by no file of the dataset or by several, or
          two rows give one name: a cohort missing a member is not the cohort.
      samples:
        range: SampleReference
        description: >-
          The samples the list's rows name, where every one is recognised and a reconciled
          file settles to them (so the list they point to is in `sample_lists.ndjson.gz`).

  SampleList:
    description: >-
      One distinct set of samples files point to (#357): written once in each producer file
      that points to it, so two producer files may each hold the same list, and once across
      the whole run in the reconciled `sample_lists.ndjson.gz`.
    attributes:
      list_id:
        required: true
        pattern: "^[0-9a-f]{16}\\Z"
        description: A digest of the sorted members; `SampleReference.list_id` points here.
      members:
        range: EntityIdentifier
        multivalued: true
        inlined_as_list: true
        required: true

  EntityIdentifier:
    description: >-
      A sample or donor, named by the authority that issued its identifier (ADR-0002
      decision 1). Two identifiers name the same sample only when namespace and id match,
      and, for `dataset_local`, the dataset too.
    attributes:
      id:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The identifier, as its namespace writes it: a source's string as written, except
          where an identifier rule declares a rewrite (`GM19908` is written `NA19908`,
          #357).
      namespace:
        range: identifier_namespace_enum
        required: true
      dataset:
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The dataset the identifier is local to: set exactly when the namespace is
          `dataset_local`, and then part of its identity.
    rules:
      - description: >-
          A `dataset_local` identifier names its dataset: without it, a name like
          `simons_data_sample_12` would match the same name in any dataset.
          gen-pydantic does not emit class rules; `sample_identity` builds identifiers only
          from rules its loader holds to the same pairing.
        preconditions:
          slot_conditions:
            namespace:
              equals_string: dataset_local
        postconditions:
          slot_conditions:
            dataset:
              required: true
      - description: >-
          Only a `dataset_local` identifier names a dataset: a `coriell` identifier with
          one would not equal the same sample named elsewhere.
        preconditions:
          slot_conditions:
            dataset:
              required: true
        postconditions:
          slot_conditions:
            namespace:
              equals_string: dataset_local

  IdentifierRules:
    description: >-
      The shape of `rules/sample_namespaces.yaml` (#357): how a source's string becomes an
      `EntityIdentifier`. Read through the generated model by `meta_disco.sample_identity`.
    attributes:
      rules:
        range: IdentifierRule
        multivalued: true
        inlined_as_list: true
        required: true

  IdentifierRule:
    description: >-
      One way a string is recognised as an identifier: a pattern matched against the whole
      string, the namespace it is in, and, for a `dataset_local` rule, the one dataset it
      applies in.
    attributes:
      id:
        required: true
        pattern: "^[a-z][a-z0-9_]*\\Z"
        description: The rule's id, cited as `rule_id` by a source the rule recognised.
      namespace:
        range: identifier_namespace_enum
        required: true
      match:
        required: true
        description: A regular expression the whole string must match.
      write:
        description: >-
          A replacement template giving the identifier from the match, where it is not the
          string as written: literal text and numbered group references (a backslash and a digit
          1 to 9), nothing else.
          Absent: the string as written.
      dataset:
        pattern: "^[^\\r\\n]+\\Z"
        description: The one dataset a `dataset_local` rule applies in; set exactly on those.
      names:
        range: entity_kind_enum
        multivalued: true
        required: true
        description: >-
          What a string the rule recognises names: a sample, a donor, or both (#693). A rule
          naming both says one string is a sample and the donor it was collected from, as a
          Coriell number names a cell line and the person it came from; the sample's
          `collected_from` is then that donor. A file's samples are read only through rules
          naming `sample`, and a donor's identifier only through rules naming `donor`.
      rationale:
        required: true
        description: Why a string matching the pattern names one sample or donor in this namespace.

  DonorRecord:
    description: >-
      One donor (#693, ADR-0002 decision 1 as amended): the person or animal samples were
      collected from, keyed by its identifier, so one record gathers what every dataset's
      tables say about one person, and each property is settled once, by the rule a file's
      dimensions are settled by (`reconcile.settle`). Reconcile writes one per donor that
      entity evidence names, a sample's `collected_from` points to, a repository's own
      identifier ties to, or another donor's `mother` or `father` claim names (#582), in
      `reconciled/donors.ndjson.gz`. A file reaches its donors through its `samples` and each
      sample's `collected_from`; no donor property is copied onto a file (epic #692,
      decision 5). Each slot carries `use` (#699), as a reconciled file's does: `meta_disco`
      where it is `classified` or `not_applicable`, else `published`, where a reader shows what
      the repository publishes: its own rows' values are in the slot's `evidence` where it has
      any (AnVIL has no field for a family, and its `Unknown` leaves no claim).
    attributes:
      identifier:
        range: EntityIdentifier
        required: true
        inlined: true
      phenotypic_sex:
        range: PhenotypicSexClassification
        required: true
        inlined: true
      genetic_ancestry:
        range: GeneticAncestryClassification
        required: true
        inlined: true
      organism_type:
        range: OrganismTypeClassification
        required: true
        inlined: true
      reported_ethnicity:
        range: ReportedEthnicityClassification
        required: true
        inlined: true
      mother:
        range: ParentClassification
        required: true
        inlined: true
        description: The donor's mother (#582), from every source that names her.
      father:
        range: ParentClassification
        required: true
        inlined: true
        description: The donor's father (#582), from every source that names him.
      family_id:
        range: FamilyIdClassification
        required: true
        inlined: true
      repository_ids:
        range: RepositoryIdentifier
        multivalued: true
        inlined_as_list: true
        description: >-
          Every identifier a repository gave a record of its own for this donor (#669),
          AnVIL's `donor_id`s: a person has an AnVIL donor in each dataset whose donors are
          made from a row naming them, and the datasets give them one or more distinct ids
          (PRIMED's and T2T's are one). Absent where none ties to the donor.

  RepositoryIdentifier:
    description: >-
      A repository's own identifier for a donor or sample (#669): AnVIL's `donor_id` or
      `biosample_id`, the key of the explorer's donor and biosample pages. It ties to our
      record through the submitter row AnVIL made its record from (`source_datarepo_row_ids`),
      read in that row's table's identifier column (`sources/anvil_entity_map.yaml`). Many may
      tie to one record; one tying to two records is refused at reconcile, and an AnVIL record
      whose source rows name two identifier strings is counted and skipped at import. A UUID
      can be both a donor's and a sample's: a tie is per kind.
    attributes:
      id:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: The repository's identifier, as it wrote it.
      repository:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: The repository that issued it (`anvil`).
      dataset:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: >-
          The dataset whose table holds it. The same identifier in two datasets is listed
          once for each.
      table:
        required: true
        pattern: "^[^\\r\\n]+\\Z"
        description: The repository's table holding it (`anvil_donor`, `anvil_biosample`).

  PhenotypicSexClassification:
    is_a: Classification
    description: A donor's phenotypic sex, settled from every source that states it (#693).
    slot_usage:
      use:
        required: true
      value:
        range: phenotypic_sex_enum

  GeneticAncestryClassification:
    is_a: Classification
    description: >-
      A donor's genetic ancestry, settled from every source that states it (#693): the most
      specific term the sources support, where they nest.
    slot_usage:
      use:
        required: true
      value:
        range: genetic_ancestry_enum

  OrganismTypeClassification:
    is_a: Classification
    description: A donor's organism (#699), settled from every source that states it.
    slot_usage:
      use:
        required: true
      value:
        range: organism_type_enum

  ReportedEthnicityClassification:
    is_a: Classification
    description: A donor's reported ethnicity (#699), settled from every source that states it.
    slot_usage:
      use:
        required: true
      value:
        range: reported_ethnicity_enum

  BiosampleTypeClassification:
    is_a: Classification
    description: What kind of material a sample is (#699), settled from every source that states it.
    slot_usage:
      use:
        required: true
      value:
        range: biosample_type_enum

  AnatomicalSiteClassification:
    is_a: Classification
    description: >-
      Where in the body a sample was taken (#699): the source's string as written, as
      AnVIL's `anvil_biosample.anatomical_site` writes it, an `Unknown` making no claim. A
      pooled sample's site is the repository's join of its members' (`Brain, Heart`, IGVF's
      `MultiplexedSample`); mapping sites to an ontology, as a list, is #702.
    slot_usage:
      use:
        required: true

  ParentClassification:
    is_a: Classification
    description: >-
      A donor's mother or father (#582): the parent's identifier, so the parent's own
      `DonorRecord` is found by equality with its `identifier`. The relation is the Kinship
      Ontology's `isBiologicalChildOf` (KIN:032), child to parent, as a PED file states it; a
      parent's children and a donor's siblings are derived from it, never stored. Each
      source's parent string is recognised as a donor through `rules/sample_namespaces.yaml`
      in the source's dataset, and its claim cites the rule that recognised it; PED's `0`
      ("not known") makes no claim. Two sources naming different identifiers are a `conflict`,
      even where the two are one person in two namespaces (GIAB's `HG004` is Coriell's
      `NA24143`), until a crosswalk between namespaces exists (#674).
    slot_usage:
      use:
        required: true
      value:
        range: EntityIdentifier
        inlined: true
      evidence:
        range: ParentEvidence

  ParentEvidence:
    is_a: Evidence
    description: >-
      A claim on a donor's `mother` or `father` (#582): its `value` is the parent's
      identifier, the shape `ParentClassification.value` takes, where every other claim's is
      a string.
    slot_usage:
      value:
        range: EntityIdentifier
        inlined: true

  FamilyIdClassification:
    is_a: Classification
    description: >-
      The family a donor belongs to (#582), as a PED file's family id names it: the string
      as the source wrote it, so it means something only among datasets that share a
      numbering (1000 Genomes' family ids, which HPRC and HPRC_R2 reuse). It groups
      relatives no parent link joins, such as siblings whose parents were not sequenced; a
      person with no relative listed often has their own id as their family id, as PED files
      do.
      Two sources writing different ids are a `conflict`.
    slot_usage:
      use:
        required: true

  SampleRecord:
    description: >-
      One sample (#693): every sample a reconciled file names, and every sample a
      repository's own sample record ties to (#669), in `reconciled/samples.ndjson.gz`, with
      the donor it was collected from where a rule says, and what the repository's own
      record of it says (#699), each slot settled and carrying `use` as a donor's does.
    attributes:
      identifier:
        range: EntityIdentifier
        required: true
        inlined: true
      collected_from:
        range: CollectedFrom
        inlined: true
        description: Absent where nothing names the sample's donor.
      biosample_type:
        range: BiosampleTypeClassification
        required: true
        inlined: true
      anatomical_site:
        range: AnatomicalSiteClassification
        required: true
        inlined: true
      repository_ids:
        range: RepositoryIdentifier
        multivalued: true
        inlined_as_list: true
        description: >-
          Every identifier a repository gave a record of its own for this sample (#669),
          AnVIL's `biosample_id`s. Absent where none ties to the sample.

  CollectedFrom:
    description: >-
      The donor a sample was collected from, and every source that said so (#693). Today
      the one source is an identifier rule naming both a sample and a donor
      (`IdentifierRule.names`), cited by its id with `source_type: identifier_rule`.
    attributes:
      donor:
        range: EntityIdentifier
        required: true
        inlined: true
      named_by:
        range: Attribution
        multivalued: true
        inlined_as_list: true
        required: true

  ActivityDeclarations:
    description: >-
      The shape of `rules/activities.yaml` (#580): per activity, its output and its input
      roles. Read through the generated model by `meta_disco.activities`.
    attributes:
      activities:
        range: ActivityDeclaration
        multivalued: true
        inlined_as_list: true
        required: true

  ActivityDeclaration:
    description: One kind of step, its output, and its inputs by role.
    attributes:
      term:
        range: activity_type_enum
        required: true
      output:
        range: ActivityEnd
        inlined: true
        description: >-
          What the step makes. Absent: taken with `inputs` from the nearest `is_a` ancestor
          that declares both, which must be `abstract`.
      inputs:
        range: InputRole
        multivalued: true
        inlined_as_list: true
        description: >-
          The step's input roles. Absent, with `output`: the term takes both from its
          nearest `is_a` ancestor that declares both, which must be `abstract` (#610).
      abstract:
        range: boolean
        description: >-
          True for a term that only declares what its children pass; no step is written
          with it.
      reason:
        required: true
        description: Why the step passes what it passes.

  ActivityEnd:
    description: An input or output of a step, a file or an identifier, and a file's kinds.
    attributes:
      form:
        range: activity_form_enum
        multivalued: true
        required: true
      kind:
        range: data_type_enum
        multivalued: true
        description: >-
          The `data_type` terms a file here may carry, dotted children included. Absent:
          any kind.

  InputRole:
    is_a: ActivityEnd
    description: One input role a kind of step declares, in `rules/activities.yaml`.
    attributes:
      role:
        required: true
        description: The part the input plays (`reads`, `reference`, `indexed`).
      required:
        range: boolean
        required: true
        description: Whether the step always has this input.
      many:
        range: boolean
        required: true
        description: Whether an output has several inputs in this role.
      passes:
        range: passed_dimension_enum
        multivalued: true
        description: "What the output takes from an input in this role. Absent: nothing."
      read_through:
        description: >-
          A role of the parent's own step whose inputs this role takes its values from, in
          place of the parent's own (#621): a sample map passes nothing itself, and a
          GenomicsDB workspace's `input_list` takes what the map's `member`s settle to.
          Absent: the parents' own answers.
      passes_samples:
        range: boolean
        description: >-
          Whether the output takes its parent's settled `samples` (#668): an index, checksum,
          QC report or coverage track describes exactly its parent's samples, and a cohort's
          merge exactly its list's. Taken from the parent itself, never read through it.
          Absent: no samples pass.

# =============================================================================
# SLOTS
# =============================================================================
slots:
  md5sum:
    description: MD5 checksum of the file; primary key for records.
    identifier: true
  file_name:
    description: The file name.
  file_format:
    description: File extension / compound extension (e.g. .bam, .vcf.gz).
  file_size:
    description: File size in bytes.
    range: integer
  entry_id:
    description: >-
      Source catalog entry identifier the record was classified from: Azul's per-index
      document id. Where present it is unique within a run and regenerated when the
      catalog is re-indexed, so it scopes a weaker key rather than outliving a refresh
      (#433). Null on a record whose input came from a TDR snapshot's tables rather
      than the compact manifest (#499), and on every HPRC record. An AnVIL record's
      durable identity is `file_id`; an HPRC record's is the URL hash it carries in
      `md5sum` (`record_keys.SOURCE_RECORD_KEYS`).
  file_id:
    description: >-
      The repository's own file identifier, and the durable one: it survives a catalog
      re-index, which `entry_id` does not (#433). It is the join key, not the handle
      a resolver takes — that is `drs_uri`.
  drs_uri:
    description: >-
      The file's DRS URI: what a resolver dereferences to reach the bytes. Carried,
      never derived from `file_id` — thousands of records wrap a different object id,
      so a reconstructed URI resolves to the wrong file or to nothing (#433).
  dataset_title:
    description: Title of the dataset the file belongs to.
  classifications:
    description: The eight classified dimensions for this file.
    range: Classifications
    required: true
    inlined: true

  # --- the eight dimensions (ranges narrowed to *Classification in slot_usage) ---
  data_modality:
    description: The biological signal the file carries.
  data_type:
    description: The content type of the file (biological or descriptive class).
  reference_assembly:
    description: The reference genome the file's coordinates are expressed against.
  assay_type:
    description: The experimental assay that produced the upstream data.
  platform:
    description: >-
      The vendor whose sequencer or array scanner read the data, for example Illumina or
      PacBio.
    comments:
      - "Array scanners added under #603."
  instrument_model:
    description: >-
      The instrument model that read the data, within its platform: for example
      Illumina NovaSeq 6000 or Illumina iScan under Illumina. Not applicable where the
      platform is not applicable.
    comments:
      - "Vocabulary from ENA/SRA instrument-model strings, with EFO ids where EFO has the same model (#532)."
      - "Illumina iScan, an array scanner SRA does not list, added under #603."
  variant_kind:
    description: >-
      The kinds of variant a callset holds, small variants or structural ones, from the
      caller that made it. A list, since one callset can hold both. Not applicable to a
      file that holds no variants.
    comments:
      - "Its own dimension under ADR-0003 (one slot per axis), #654."
  variant_origin:
    description: >-
      Whether a callset's variants are germline (carried from conception, in every cell) or
      somatic (arisen later, in some cells), from the caller that made it. Not applicable to
      a file that holds no variants.
    comments:
      - "Its own dimension under ADR-0003 (one slot per axis), #658; named for Sequence Ontology's variant_origin (SO:0001762), whose two children are its values."

  generated_by:
    description: >-
      The step that made the file and the inputs it used, by role (ADR-0002 decisions 3,
      6, #580); null where no step is recorded.
    range: GeneratedBy
    inlined: true

  samples:
    description: >-
      The samples the file's data comes from (#357), as a pointer to the run's sample list;
      null where no source names a sample, or where its sources name different ones.
    range: SampleReference
    inlined: true

  # --- Classification sub-fields ---
  value:
    description: The resolved value; null unless status is 'classified'.
    required: false
  status:
    description: Whether the field was classified, is not applicable, etc.
    range: classification_status_enum
    required: true
  evidence:
    range: Evidence
    multivalued: true
    inlined_as_list: true
  use:
    description: >-
      On a reconciled record only (#432), a file's or a donor's or sample's (#699): whether the
      indexer takes this record's value (`meta_disco`, when the status is `classified` or
      `not_applicable`) or keeps what the repository publishes (`published`, when it is
      `conflict` or `not_classified`). Computed by reconcile so an export is structure only.
    range: use_enum
    required: false
  credited_to:
    description: >-
      On a reconciled record only (#552): where this slot's answer is credited, the
      per-slot category the reconcile report counts. The rule is
      `reconcile.credited_to`'s. It attributes and never decides: the value was
      settled before it is read.
    range: credited_to_enum
    required: false
  inferred:
    description: >-
      On a reconciled record only (#432): what inference concluded for this slot.
    range: InferredConclusion
    required: false
    inlined: true

  # --- ReferenceBuild link (issue #340) ---
  build:
    description: >-
      The specific reference build behind this dimension's coarse value. Named
      ``build`` rather than ``reference`` because ``Evidence.reference`` already
      means a provenance pointer. ReferenceBuild's own fields are class-local
      attributes, so they add nothing to the global slot namespace.
    range: ReferenceBuild
    required: false

  # --- Evidence sub-fields ---
  rule_id:
    description: >-
      Identifier of the rule or content classifier that produced this evidence.
      Absent on synthetic resolution markers, which carry `marker` instead.
  marker:
    description: >-
      Kind of synthetic resolution marker, when this entry is not a claim but a
      note about the outcome: `not_classified` (no rule determined a value) or
      `conflict` (claims disagreed at the top tier). The marker's `status` is the
      status the field resolved to — `conflict` on a conflict marker (#88).
      Absent on real claims.
    range: evidence_marker_enum
  reason:
    description: Human-readable rationale.
  tier:
    description: The tier at which this evidence fired.
    range: integer
  competing_values:
    description: >-
      On a `conflict` marker, the disagreeing top-tier values that made the field
      ambiguous. Absent on claims and on the `not_classified` marker.
    multivalued: true
    range: string
  source_type:
    description: >-
      Kind of source that produced this claim (provenance, #90; populated on every
      claim by #392) — see `source_type_enum` for the kinds. Absent on a synthetic
      marker and on the note left by a failed fetch or input contract, neither of
      which is a claim.
    range: source_type_enum
  claim_state:
    description: >-
      The state of a claim that produced no vocabulary value — see
      `claim_state_enum` for what each state means. Present instead of `value` or
      `status`, and only on such a claim: one that mapped successfully carries a
      `value`, and the two sentinels are carried in `status` as before.
    range: claim_state_enum
  source:
    description: >-
      The external source that produced this claim, for a claim that is not from
      one of our rules. Absent on a rule or content claim, which carries `rule_id`.
    range: ClaimSource
    inlined: true
  raw_value:
    description: >-
      What the source actually said, before mapping — `Revio` beside a mapped
      `PACBIO`. The mapping is the reviewable decision, and storing only the
      mapped value makes it unauditable. Also present on an `unmapped` or
      `no_vocabulary_term` claim, where it is the whole content of the claim.
    range: string
  join_key:
    description: >-
      Which key attached this claim to our record: a file's, or for a donor's slot the
      identifier the source wrote (`entity_identifier`, #693). Recorded per claim rather than
      per source because identity is the risky step and sources publish different
      keys: md5 collides on 1.72% of the corpus's rows and the HPRC catalog publishes
      only file names (#390). Absent on a claim our own inference produced, which
      was never joined to anything.
    range: join_key_enum
  match_exact:
    description: >-
      Whether the join on `join_key` was an exact match rather than a normalized
      or partial one. Absent whenever `join_key` is.
    range: boolean

  # --- GeneratedBy and ActivityInput sub-fields ---
  activity:
    description: >-
      The kind of step that made the file (`activity_type_enum`); what passes from each
      input role is declared per term in `rules/activities.yaml`.
    range: activity_type_enum
    required: true
  activity_id:
    description: >-
      The source's own id for the step (`anvil_activity.activity_id`), where it gives one.
  parent_file:
    description: >-
      The input file's name: the matched record's own spelling where the input resolves
      (a file-name rule matches case-insensitively, so it may differ in case from the name
      worked out from the child), otherwise as the source that names the input wrote it.
  parent_key:
    description: >-
      The parent's record key (`record_keys.SOURCE_RECORD_KEYS`: AnVIL's `file_id`, HPRC's
      URL hash in `md5sum`), set only when the parent resolves to exactly one record of
      the child's dataset (ADR-0002 decision 2), or of the dataset an input's
      `parent_dataset` names under that decision's declared exception (#594). Named for the key rather than
      `parent_file_id` because HPRC's key is not a `file_id`.
  parent_ref:
    pattern: "^[^\\r\\n]+\\Z"
    description: >-
      The parent as a source wrote it when that is not a bare name (ADR-0002 decision 2).
      Written today only for a file held outside AnVIL for the child's dataset (#710, a
      workaround until #624): its address, `github:<owner>/<repo>@<commit>/<path>`, as
      `sources/external_files.yaml` declares it, and its record in the reconciled
      `external_lists.ndjson.gz`. Such an input has no `parent_key`.
  parent_kind:
    description: The kind of file the parent is.
    range: parent_kind_enum
  parent_role:
    description: >-
      On an inherited claim (contract 4.9, #571), or an inherited sample attribution (#668):
      the input role of the step whose parents gave the claim or the samples, a role its
      `activity` declares in `rules/activities.yaml`.
  parent_keys:
    description: >-
      On an inherited claim (contract 4.9, #571), or an inherited sample attribution (#668):
      the record keys of the parents, in that role, whose settled answers or samples gave
      it — each one's record in the same run, or, for a list held outside AnVIL for the
      dataset (#710), its address, its line in the reconciled `external_lists.ndjson.gz`.
    multivalued: true

# =============================================================================
# ENUMS  (the controlled vocabulary — the canonical source of truth)
# =============================================================================
enums:

  data_modality_enum:
    description: >-
      The biological signal a file carries: "the biological nature of the information
      gathered as the result of an Activity, independent of the technology or methods
      used to produce the information", in the words of AnVIL's Findability Subset
      (FSS), whose recommended values for its `data_modality` field are the Broad's
      MODAL ontology (github.com/broadinstitute/modal) term for term (#563). This enum
      is that tree: each value spells its MODAL term as a dotted path, `is_a` names its
      parent, and `meaning` is its MODAL id. The dotted value stands in for FSS's
      wording ("DNA methylation" for `epigenomic.methylation`) until labels are added.
      Single-cell versus bulk is not a modality here, since it is a property of the
      experiment, so `assay_type` records it (`sc/snRNA-seq`, `snRNA-seq`, #533). A record
      holds one term, the most specific its evidence supports, which may be a parent:
      nothing emits a `genomic` child yet, so a WGS library is `genomic`. A consumer that
      filters on a parent walks `is_a`.
    permissible_values:
      genomic:
        meaning: MODAL:0000010
      "genomic.assembly":
        is_a: genomic
        meaning: MODAL:0000011
      "genomic.exome":
        is_a: genomic
        meaning: MODAL:0000012
      "genomic.genotyping":
        is_a: genomic
        meaning: MODAL:0000013
      "genomic.whole_genome":
        is_a: genomic
        meaning: MODAL:0000014
      transcriptomic:
        meaning: MODAL:0000026
      "transcriptomic.spatial":
        is_a: transcriptomic
        meaning: MODAL:0000027
      "transcriptomic.nontargeted":
        is_a: transcriptomic
        meaning: MODAL:0000028
      "transcriptomic.targeted":
        is_a: transcriptomic
        meaning: MODAL:0000029
      epigenomic:
        meaning: MODAL:0000002
      "epigenomic.3d_contact_maps":
        is_a: epigenomic
        meaning: MODAL:0000003
      "epigenomic.dna_binding":
        is_a: epigenomic
        meaning: MODAL:0000004
      "epigenomic.dna_binding.histone_modification":
        is_a: epigenomic.dna_binding
        meaning: MODAL:0000005
      "epigenomic.dna_binding.transcription_factor":
        is_a: epigenomic.dna_binding
        meaning: MODAL:0000006
      "epigenomic.chromatin_accessibility":
        is_a: epigenomic
        meaning: MODAL:0000007
      "epigenomic.methylation":
        is_a: epigenomic
        meaning: MODAL:0000008
      "epigenomic.rna_binding":
        is_a: epigenomic
        meaning: MODAL:0000009
      imaging:
        meaning: MODAL:0000015
      "imaging.electrophysiology":
        is_a: imaging
        meaning: MODAL:0000016
      "imaging.medical_imaging":
        is_a: imaging
        meaning: MODAL:0000017
      "imaging.medical_imaging.ct_scan":
        is_a: imaging.medical_imaging
        meaning: MODAL:0000018
      "imaging.medical_imaging.electrocardiogram":
        is_a: imaging.medical_imaging
        meaning: MODAL:0000019
      "imaging.medical_imaging.mri":
        is_a: imaging.medical_imaging
        meaning: MODAL:0000020
      "imaging.medical_imaging.x_ray":
        is_a: imaging.medical_imaging
        meaning: MODAL:0000021
      "imaging.microscopy":
        is_a: imaging
        meaning: MODAL:0000022
      metabolomic:
        meaning: MODAL:0000023
      microbiome:
        meaning: MODAL:0000024
      proteomic:
        meaning: MODAL:0000025

  data_type_enum:
    description: >-
      Content type, spanning two classes. BIOLOGICAL: the bytes are the signal.
      DESCRIPTIVE: the bytes are about another file. (See data-model doc 8c.)
      A dotted value is a child of the value before its last dot, and `is_a` names
      that parent (`annotations.coverage` is an `annotations`). A record holds one term.
      Inference settles its claims by tier; where reconcile meets two values that nest, the
      deeper one is the value. A consumer that filters on a parent walks `is_a`. A variant
      callset's kind and origin are not terms here: they are `variant_kind` and
      `variant_origin` (ADR-0003, #657).
    permissible_values:
      # --- biological class ---
      alignments:
      reads:
      sequence:
      assembly:
      "assembly.reference":   # a published reference genome (e.g. GRCh38/CHM13); de-novo stays `assembly`
        is_a: assembly
      pangenome:              # a sequence graph (GFA/rGFA/GBZ/vg/GBWT/xg); linear sequence is FASTA (`sequence`/`assembly`)
      "pangenome.reference":  # a graph used as an alignment reference (e.g. HPRC minigraph-cactus)
        is_a: pangenome
      variants:
        description: >-
          Variant calls, with nothing narrower stated in this tree. The unnarrowed parent,
          not "unknown": the file is known to hold variants. What kind they are is
          `variant_kind`'s to say, from the caller that made the file (#654).
        meaning: EDAM:data_3498
      "variants.gvcf":
        is_a: variants
        description: >-
          One sample's calls, with a reference-confidence record covering every other
          position: one record per position, or a block (`END=`) per run of positions,
          each with a `<NON_REF>` ALT. It is the input to joint calling (#607). No
          `meaning`: EDAM names gVCF a format (format_4018), beside VCF, and has no data
          term for it. Under ADR-0003 the format is the file's, not its data type's; it is
          the one format term in this tree, kept until a format slot exists (#657). Its
          calls' origin is `variant_origin`'s. Assigned by the content rule `vcf_gvcf`.
      genotypes:
      expression_matrix:      # a features × samples abundance matrix
      quantification:         # one sample's per-feature abundance table (e.g. Salmon quant.sf); not a features × samples matrix (cf. expression_matrix)
      annotations:
      "annotations.coverage":
        is_a: annotations
        description: >-
          Read depth along the genome, measured from an alignment: per base or
          per window, raw or normalized (e.g. a mosdepth `regions.bed.gz`, or a
          STAR `Signal.Unique.strand+.bw`). No `meaning`: EDAM has no data term
          for coverage or read depth, only the process (operation_3230).
      peaks:
      raw_signal:
      array_signal:
      images:
      # --- descriptive class ---
      index:
      checksum:
      qc_report:
        description: >-
          A quality-control report about another file, such as samtools stats,
          a mosdepth summary or distribution, or bcftools stats.
        meaning: EDAM:data_3914
      log:
      interval_set:
      sample_map:
        description: >-
          A list naming the files processed together, one per sample: a GATK sample-name
          map, each row a sample name and its gVCF's path (#621). No `meaning`: EDAM has no
          data term for it.

  reference_assembly_enum:
    description: >-
      Reference assemblies, named as NCBI names them (issue #473). A file gets the
      most specific term its evidence supports, and `is_a` records the terms as a
      hierarchy. A record carries only its own term, so a filter on a parent
      includes the terms below it only where the consumer walks the hierarchy
      (`schema_vocab.value_ancestors`); `value == "CHM13"` alone does not.

      GRC assemblies are named at the major release: contig lengths are identical
      across patch releases, so contig lengths can never tell a patch (#399). Where
      a header's declared reference name does tell one, the patch stays on
      `ReferenceBuild.version`. `CHM13`
      is every CHM13 release, and is also the term for a CHM13 file whose release
      cannot be told. Under it are NCBI's T2T releases, and under each release the
      references that graft another genome's chrY onto it. NCBI names none of those
      hybrids, so each is spelled as the reference FASTA that files declare,
      extension dropped. A hybrid is its own coordinate system on chrY and its parent
      release everywhere else, which is why it sits under that release.

      `meaning` is recorded where one term is one NCBI assembly: the three T2T
      releases and the two monkey assemblies (#636). The GRC terms each span their
      patch releases, and `CHM13` spans the T2T releases.
    permissible_values:
      GRCh37:
      GRCh38:
      CHM13:
        description: Any CHM13 release, or CHM13 whose release cannot be told.
      T2T-CHM13v1.0:
        is_a: CHM13
        meaning: insdc.gca:GCA_009914755.2
      T2T-CHM13v1.1:
        is_a: CHM13
        meaning: insdc.gca:GCA_009914755.3
      T2T-CHM13v2.0:
        is_a: CHM13
        meaning: insdc.gca:GCA_009914755.4
      t2t-chm13.20200921.withGRCh38chrY.chrEBV.chrYKI270740v1r:
        is_a: T2T-CHM13v1.0
        description: T2T-CHM13v1.0 with GRCh38's chrY grafted on.
      CHM13Y_EBV_v1.1:
        is_a: T2T-CHM13v1.1
        description: T2T-CHM13v1.1 with GRCh38's chrY grafted on.
      t2t-chm13.20200921.HG002chrY.chrEBV:
