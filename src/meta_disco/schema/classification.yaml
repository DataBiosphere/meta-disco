id: https://github.com/DataBiosphere/meta-disco/blob/main/src/meta_disco/schema/classification.yaml
name: meta_disco_classification
title: Meta-Disco File Classification Model
description: >-
  Full classification data model for meta-disco: the five metadata dimensions,
  per-field evidence, classification status, and typed derivation edges. Supersedes
  the retired anvil_file.yaml stub (issue #33) and realizes the data-model decision
  record in docs/derived-file-data-model.md.

  Authoring source of truth. `make gen` generates JSON Schema and Pydantic from
  this file (via `gen-json-schema` / `gen-pydantic`) — do not hand-edit the
  generated copies. The schema's vocabulary backs the rule drift check
  (tests/test_rule_vocabulary.py), and `ClassificationRecord` now matches the
  pipeline output shape (`{..., "classifications": {...}}`, see
  docs/derived-file-data-model.md section 5a) so whole records validate against it
  (schema/tests/test_output_validation.py, run closed=False, so any unmodeled key is
  tolerated; in practice the pipeline's only such extras are the fastq scalar hints
  inside `classifications` — modeling them is a #134 follow-up).
  Adopting typed records in the pipeline is done: `run()` parses each routed record
  into a typed view at the load boundary (`src/meta_disco/records.py`, #172).

prefixes:
  linkml: https://w3id.org/linkml/
  anvil: https://github.com/DataBiosphere/meta-disco/schema/
default_prefix: anvil
default_range: string

imports:
  - linkml:types

# =============================================================================
# CLASSES
# =============================================================================
classes:

  ClassificationRecord:
    tree_root: true
    description: >-
      One classified file. `classifications` carries the file's identity (the
      five dimension fields — what it is); derived_from is a typed edge to the
      file it was derived from (where it came from). Matches the pipeline output
      shape (see docs/derived-file-data-model.md section 5a).
    slots:
      - md5sum
      - file_name
      - file_format
      - file_size
      - entry_id
      - dataset_title
      - classifications
      - derived_from

  Classifications:
    description: >-
      The five metadata dimensions for one file, each a Classification entry.
      The pipeline also emits some file-type-specific scalar hints here (e.g.
      fastq's is_paired_end / instrument_model); those are not modeled yet and
      pass under the gate's closed=False mode (see #134 follow-up).
    slots:
      - data_modality
      - data_type
      - reference_assembly
      - assay_type
      - platform
    slot_usage:
      data_modality:
        range: DataModalityClassification
        required: true
      data_type:
        range: DataTypeClassification
        required: true
      reference_assembly:
        range: ReferenceAssemblyClassification
        required: true
      assay_type:
        range: AssayTypeClassification
        required: true
      platform:
        range: PlatformClassification
        required: true

  Classification:
    abstract: true
    description: >-
      A single classified field: its resolved value (null unless status is
      'classified'), a status sentinel, and the evidence behind it. Subclasses
      narrow `value` to the right enum per dimension.
    slots:
      - value
      - status
      - evidence

  DataModalityClassification:
    is_a: Classification
    slot_usage:
      value:
        range: data_modality_enum

  DataTypeClassification:
    is_a: Classification
    slot_usage:
      value:
        range: data_type_enum

  ReferenceAssemblyClassification:
    is_a: Classification
    slots:
      - build
    slot_usage:
      value:
        range: reference_assembly_enum

  AssayTypeClassification:
    is_a: Classification
    slot_usage:
      value:
        range: assay_type_enum

  PlatformClassification:
    is_a: Classification
    slot_usage:
      value:
        range: platform_enum

  ReferenceBuild:
    description: >-
      The specific reference build a file was aligned to, refining the coarse
      family in ``reference_assembly.value`` (issue #340). Two files can both be
      ``CHM13`` and be aligned to builds whose coordinates differ; this says
      which one.

      ``chr1_m5``, ``chry_m5``, ``name`` and ``name_source`` are OBSERVED, read
      from the file's own header. ``base`` and ``version`` are DERIVED by
      matching those observations against a table of known builds. ``version``
      is null unless the evidence identifies exactly one build; ``base`` is
      filled whenever every candidate agrees on the family, which is often true
      when the version is not. An ambiguous file keeps its observations rather
      than being assigned a nearest match.

      Not a claim: it carries no tier, never competes in claim resolution, and
      cannot change which ``value`` won. Absent entirely when nothing was
      observed.

      Declared as class-local ``attributes`` rather than global ``slots``:
      ``name``, ``base`` and ``version`` are the kind of identifier that collides
      across a shared namespace, and nothing outside this class needs them.
    attributes:
      base:
        range: reference_assembly_enum
        description: >-
          Assembly family of the resolved build. Duplicates the coarse value when
          both are known, so a build is readable on its own; null when no single
          family was identified. Range-constrained rather than merely documented
          as such, so a table entry naming a family outside the vocabulary fails
          validation instead of passing as free text.
      version:
        description: >-
          Build version within the family. Free text by necessity: T2T releases
          (``v1.0``, ``v1.1``, ``v2.0``) and GRC patches (``p12``) are not the same
          kind of thing, and CHM13 has no patch concept. Where a build grafts a
          chromosome from elsewhere the origin is part of the version
          (``v1.0+GRCh38chrY``), because that is a real difference in the reference.
          Null unless the evidence identifies exactly one build.
      chr1_m5:
        description: >-
          MD5 of the chr1 sequence, from SAM ``@SQ M5``. Identifies the sequence, not
          the packaging: two references with different decoy or alt content share this
          value when their chr1 is the same. Null for VCF, whose ``##contig`` md5
          attribute is optional in the specification and unpopulated in practice.
      chry_m5:
        description: >-
          MD5 of the chrY sequence, from SAM ``@SQ M5``. Recorded because chr1 alone
          cannot separate some builds — CHM13 v2.0 is v1.1 plus a chrY, so their
          autosomes are identical. One build can appear with more than one value here
          at identical chrY length; the header cannot say why, so both are recorded
          as observations and neither is preferred.
      name:
        description: >-
          Reference filename as the file declares it, from SAM ``@SQ UR`` or VCF
          ``##reference`` when present, else from a program command line in the
          header (``@PG CL``, ``##GATKCommandLine``; issue #354) — ``name_source``
          says which. An observation about the file, not a statement about the
          reference's content: one name can denote references that differ, and
          differently-named references can be identical.
      name_source:
        range: reference_name_source_enum
        description: >-
          Where ``name`` was read from. ``reference_field`` is the field that
          exists to carry it; ``command_line`` is the command line of the program
          that produced the file, one step further from the file, and taken only
          when the header declares contigs, every command line that names a
          reference names the same one, and (for VCF) the file carries no liftover
          INFO fields. Null when ``name`` is null.

  ClaimSource:
    description: >-
      Identity of a source that produced a claim, for a source that is not one of
      our rules (issue #392): an external catalog, a submitter manifest, a curator
      table. Names the source, the table or file within it, and the column the raw
      value was read from — the granularity at which a mapping is reviewed and at
      which a column can be `declined` as an authority for a dimension.

      A claim from one of our own rules carries `rule_id` instead and needs no
      source object; a claim carries at least one of the two.

      Declared as class-local ``attributes`` rather than global ``slots``:
      ``name``, ``url``, ``table`` and ``column`` are words too generic to own in
      a shared namespace, and nothing outside this class needs them. Claim files
      (#401) carry these same four fields once per file in their envelope rather
      than repeating them on every claim — one shape, factored, not a second one.
    attributes:
      name:
        description: >-
          Name of the source, e.g. ``AnVIL`` or ``HPRC Data Explorer``.
      url:
        description: >-
          URL the source was read from, if it has one. Null for a source with no
          published address, such as a curator table held in this repository.
      table:
        description: >-
          The table or file within the source that the claim came from, e.g. an
          AnVIL verbatim manifest table name. Null when the source is a single
          undivided file.
      column:
        description: >-
          The column within that table the raw value was read from. Null when the
          source has no column structure.

  Evidence:
    description: >-
      One piece of supporting evidence. Either a claim (declares a value, a
      status, or a claim_state, and carries a source_type), or a synthetic
      resolution marker (carries marker, no rule_id) recording that no claim was
      made or that claims conflicted.

      A claim from one of our rules or content classifiers carries rule_id + tier;
      a claim from an external source (issue #392) carries source instead, with
      the raw value it read and how it was matched to our file. Evidence that is
      neither — the note left when a fetch or the input contract failed — carries
      a rule_id and a reason but declares nothing.
    slots:
      - rule_id
      - marker
      - reason
      - value
      - status
      - claim_state
      - tier
      - competing_values
      - source_type
      - source
      - raw_value
      - join_key
      - match_exact
    slot_usage:
      # A rule's claimed value / status for this dimension, and the rule tier it
      # fired at. status is optional on evidence (only sentinel-bearing evidence
      # carries it), unlike the required status on a Classification entry.
      status:
        required: false

  DerivationEdge:
    description: >-
      Typed link from a derived file to the file it was derived from. The verb
      (relation) and parent_kind are the type — knowable from the filename;
      parent_md5sum is the grounding, which may be null when the parent cannot
      be resolved. See docs/derived-file-data-model.md.
    slots:
      - relation
      - parent_md5sum
      - parent_file
      - parent_kind

# =============================================================================
# SLOTS
# =============================================================================
slots:
  md5sum:
    description: MD5 checksum of the file; primary key for records.
    identifier: true
  file_name:
    description: The file name.
  file_format:
    description: File extension / compound extension (e.g. .bam, .vcf.gz).
  file_size:
    description: File size in bytes.
    range: integer
  entry_id:
    description: Source catalog entry identifier the record was classified from.
  dataset_title:
    description: Title of the dataset the file belongs to.
  classifications:
    description: The five classified dimensions for this file.
    range: Classifications
    required: true
    inlined: true

  # --- the five dimensions (ranges narrowed to *Classification in slot_usage) ---
  data_modality:
    description: The biological signal the file carries.
  data_type:
    description: The content type of the file (biological or descriptive class).
  reference_assembly:
    description: The reference genome the file's coordinates are expressed against.
  assay_type:
    description: The experimental assay that produced the upstream data.
  platform:
    description: The sequencing platform / instrument family.

  derived_from:
    description: Typed derivation edge to the parent file, if this is a derived file.
    range: DerivationEdge

  # --- Classification sub-fields ---
  value:
    description: The resolved value; null unless status is 'classified'.
    required: false
  status:
    description: Whether the field was classified, is not applicable, etc.
    range: classification_status_enum
    required: true
  evidence:
    range: Evidence
    multivalued: true
    inlined_as_list: true

  # --- ReferenceBuild link (issue #340) ---
  build:
    description: >-
      The specific reference build behind this dimension's coarse value. Named
      ``build`` rather than ``reference`` because ``Evidence.reference`` already
      means a provenance pointer. ReferenceBuild's own fields are class-local
      attributes, so they add nothing to the global slot namespace.
    range: ReferenceBuild
    required: false

  # --- Evidence sub-fields ---
  rule_id:
    description: >-
      Identifier of the rule or content classifier that produced this evidence.
      Absent on synthetic resolution markers, which carry `marker` instead.
  marker:
    description: >-
      Kind of synthetic resolution marker, when this entry is not a claim but a
      note about the outcome: `not_classified` (no rule determined a value) or
      `conflict` (claims disagreed at the top tier). Absent on real claims.
    range: evidence_marker_enum
  reason:
    description: Human-readable rationale.
  tier:
    description: The tier at which this evidence fired.
    range: integer
  competing_values:
    description: >-
      On a `conflict` marker, the disagreeing top-tier values that made the field
      ambiguous. Absent on claims and on the `not_classified` marker.
    multivalued: true
    range: string
  source_type:
    description: >-
      Kind of source that produced this claim (provenance, #90; populated on every
      claim by #392). Deliberately not derivable from `tier`: `contig_detection`
      and `content_read` share a tier, and `signal_inference` fires at a rule tier
      without being a rule. Absent on a synthetic marker and on the note left by a
      failed fetch or input contract, neither of which is a claim.
    range: source_type_enum
  claim_state:
    description: >-
      Why a claim that consulted a source produced no vocabulary value (issue
      #392). Present instead of `value` or `status`, and only on such a claim: a
      claim that mapped successfully carries a `value`, and the two sentinels are
      carried in `status` as before. A claim in one of these states declares
      nothing, so it never competes in resolution and cannot make a field
      conflict — it is a review queue and an audit trail, not an answer.
    range: claim_state_enum
  source:
    description: >-
      The external source that produced this claim, for a claim that is not from
      one of our rules. Absent on a rule or content claim, which carries `rule_id`.
    range: ClaimSource
    inlined: true
  raw_value:
    description: >-
      What the source actually said, before mapping — `Revio` beside a mapped
      `PACBIO`. The mapping is the reviewable decision, and storing only the
      mapped value makes it unauditable. Also present on an `unmapped` or
      `no_vocabulary_term` claim, where it is the whole content of the claim.
    range: string
  join_key:
    description: >-
      Which key attached this claim to our file. Recorded per claim rather than
      per source because identity is the risky step and sources publish different
      keys: md5 collides on 1.28% of the corpus and the HPRC catalog publishes
      only file names (#390). Absent on a claim our own inference produced, which
      was never joined to anything.
    range: join_key_enum
  match_exact:
    description: >-
      Whether the join on `join_key` was an exact match rather than a normalized
      or partial one. Absent whenever `join_key` is.
    range: boolean

  # --- DerivationEdge sub-fields ---
  relation:
    description: The derivation verb.
    range: relation_enum
    required: true
  parent_md5sum:
    description: md5sum of the parent file; null if the edge is ungrounded.
  parent_file:
    description: Name of the parent file.
  parent_kind:
    description: The kind of file the parent is.
    range: parent_kind_enum

# =============================================================================
# ENUMS  (the controlled vocabulary — the canonical source of truth)
# =============================================================================
enums:

  data_modality_enum:
    description: The biological signal a file carries. Dotted values are hierarchical.
    permissible_values:
      genomic:
        # meaning: <OBI/EDAM CURIE>   # LinkML supports ontology mapping here
      "transcriptomic.bulk":
      "transcriptomic.single_cell":
      "epigenomic.chromatin_accessibility":
      "epigenomic.histone_modification":
      "epigenomic.methylation":
      "imaging.histology":

  data_type_enum:
    description: >-
      Content type, spanning two classes. BIOLOGICAL: the bytes are the signal.
      DESCRIPTIVE: the bytes are about another file. (See data-model doc 8c.)
    permissible_values:
      # --- biological class ---
      alignments:
      reads:
      sequence:
      assembly:
      "assembly.reference":   # a published reference genome (e.g. GRCh38/CHM13); de-novo stays `assembly`
      pangenome:              # a sequence graph (GFA/rGFA/GBZ/vg/GBWT/xg); linear sequence is FASTA (`sequence`/`assembly`)
      "pangenome.reference":  # a graph used as an alignment reference (e.g. HPRC minigraph-cactus)
      variants:
      "variants.germline":
      "variants.somatic":
      "variants.structural":
      "variants.cnv":
      genotypes:
      expression_matrix:      # a features × samples abundance matrix
      quantification:         # one sample's per-feature abundance table (e.g. Salmon quant.sf); not a features × samples matrix (cf. expression_matrix)
      annotations:
      peaks:
      signal:
      raw_signal:
      array_signal:
      images:
      # --- descriptive class ---
      index:
      checksum:
      statistics:
      log:
      interval_set:

  reference_assembly_enum:
    permissible_values:
      GRCh37:
      GRCh38:
      CHM13:
      # GRCm39:  # mouse — pending issue #15

  reference_name_source_enum:
    description: >-
      Which part of a file's header a declared reference name was read from
      (issue #354). See ``ReferenceBuild.name_source``.
    permissible_values:
      reference_field:
      command_line:

  assay_type_enum:
    permissible_values:
      WGS:
      WES:
      "RNA-seq":
      "ATAC-seq":
      "ChIP-seq":
      "Bisulfite-seq":
      "Methylation array":
      Histology:

  platform_enum:
    permissible_values:
      ILLUMINA:
      PACBIO:
      ONT:
      MGI:
      ELEMENT:
      ULTIMA:

  classification_status_enum:
    description: >-
      Why a field has (or lacks) a value. Replaces sentinel values that were
      previously smuggled into each dimension enum (not_applicable /
      not_classified). See issues #56, #88.
    permissible_values:
      classified:
        description: A value was determined.
      not_applicable:
        description: The field has no meaning for this file.
      not_classified:
        description: The field is meaningful but no value could be determined.
      conflict:
        description: Multiple rules disagreed at the same tier.

  relation_enum:
    description: >-
      Derivation verbs we can currently detect. subset_of / merged_from /
      member_of are intentionally held back until detectable (data-model doc 8d).
    permissible_values:
      index_of:
      checksum_of:
      summarizes:
      lifted_over_from:
      derived_from:   # generic fallback: related, verb unknown

  parent_kind_enum:
    description: The kind of file a derivation edge points at.
    permissible_values:
      alignment:
      variants:
      reads:
      sequence:
      intervals:
      signal:
      expression_matrix:
      genotypes:
      any:

  source_type_enum:
    description: >-
      Kind of source behind a claim (provenance model, #90). Every claim carries
      one (#392). Distinct from `tier`, which is the resolution input: two kinds
      share `CONTENT_TIER`, and one fires at a rule tier without being a rule.
    permissible_values:
      filename_rule:
        description: >-
          A rule matching on the file name or its extension (tiers 1-2 of
          unified_rules.yaml). The extension is part of the name, so both tiers
          are this kind.
      header_rule:
        description: >-
          A rule matching on fetched header content (tier 3 of
          unified_rules.yaml).
      contig_detection:
        description: >-
          Read from the contig or sequence declarations in the file's own bytes —
          SAM ``@SQ``, VCF ``##contig``, FASTA sequence names, GFA ``SN`` segment
          tags, BED contig names and coordinates.
      content_read:
        description: >-
          Read from the file's bytes, but not from contig declarations — today the
          member names in an archive head. Separate from `contig_detection` so
          neither has to describe the other.
      signal_inference:
        description: >-
          Derived from dimensions this file has already resolved, plus its format
          and size, rather than read from the file — the assay_type inference.
      derivation_inheritance:
        description: >-
          Inherited from a related file rather than determined for this one, as an
          index file inherits its parent's classification.
      external_ground_truth:
        description: >-
          An external catalog or authority published outside AnVIL, e.g. the HPRC
          Data Explorer.
      repository_metadata:
        description: >-
          Metadata the repository publishes about the file, e.g. an AnVIL verbatim
          manifest table.
      wrangler_annotation:
        description: >-
          A human curator's decision, recorded deliberately rather than inferred.

  claim_state_enum:
    description: >-
      Why a claim that consulted a source produced no vocabulary value (issue
      #392). Each state was observed in the spike over three real producers on
      `AnVIL_HPRC_R2`. None of them declares a value, so none competes in
      resolution. `mapped` is not a member: a claim that mapped carries a `value`,
      and `not_applicable` / `not_classified` remain statuses, unchanged.
    permissible_values:
      unmapped:
        description: >-
          The source said something and no map entry covers it, e.g.
          `library_selection=RANDOM`. The review queue: a mapping may be owed.
      no_vocabulary_term:
        description: >-
          The raw value was mapped deliberately to nothing because the vocabulary
          has no term for it, e.g. `Hi-C`, `CenSat`. A recorded decision, not a
          gap in the mapping.
      declined:
        description: >-
          This column is not an authority on this dimension, so no claim is made
          from it whatever it says. A property of the (source, column, dimension)
          triple, not of a value: `alignments_v2.location` points at pangenome
          graphs and at a VCF of variants under one column, so neither a
          value-level mapping nor a finer key can fix it.

  join_key_enum:
    description: >-
      The key by which an external source's claim was attached to one of our files
      (issue #392). Sources publish different keys and they differ in
      trustworthiness, so which one was used is recorded per claim (#390).
    permissible_values:
      file_path:
        description: Full path — the entry identity, and the only unique key.
      file_md5sum:
        description: >-
          Content checksum. Not unique across the corpus: 2,026 md5s are
          registered in more than one dataset.
      drs_uri:
        description: DRS URI, where the source publishes one.
      file_name:
        description: >-
          Bare file name. The weakest key and the only one some catalogs publish —
          79.6% coverage on HPRC_R2.

  evidence_marker_enum:
    description: >-
      Kind of synthetic resolution marker on an evidence entry (issue #228): a
      note that no claim was made or that claims conflicted, rather than a claim.
    permissible_values:
      not_classified:
        description: No rule or content classifier determined a value.
      conflict:
        description: Claims disagreed at the top tier, so the field is ambiguous.
