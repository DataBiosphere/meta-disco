# Meta-Disco Unified Classification Rules
# ========================================
#
# PURPOSE
# -------
# This file contains all rules for classifying biological data files (BAM, CRAM,
# FASTQ, VCF, BED, etc.) to determine their data_modality (genomic, transcriptomic,
# epigenomic), reference_assembly (GRCh38, GRCh37, CHM13), and other metadata.
#
# The rule engine is used by the AnVIL Explorer and Terra Data Repository to
# automatically classify files based on filename patterns, file size, and
# optionally BAM/VCF/FASTQ headers.
#
#
# HOW THE RULE ENGINE WORKS
# -------------------------
# 1. EXTENSION EXTRACTION: The engine first extracts the file extension,
#    handling compound extensions like .vcf.gz, .fastq.gz, .g.vcf.gz
#
# 2. RULE FILTERING: Only rules matching the file's extension are considered.
#    Rules without an 'extensions' constraint apply to ALL files.
#
# 3. TIERED EXECUTION: Rules execute in tier order (1 → 2 → 3):
#    - Tier 1: Extension-only rules (fastest, always available)
#    - Tier 2: Filename pattern rules
#    - Tier 3: Header-based rules (requires reading file headers)
#
# 4. CONDITION EVALUATION: All conditions in 'when' must match (AND logic).
#    If any condition fails, the rule is skipped.
#
# 5. EFFECT APPLICATION: When a rule matches, each effect in 'then' becomes one
#    claim on its field. Every matching rule's claims are kept; none is skipped
#    because a field already has a value.
#
# 6. RESOLUTION: After all rules run, each field resolves from its claims: they
#    agree, or the highest tier wins, or same-tier claims disagree and the field is
#    a conflict. A not_applicable is a declaration like a value: it wins only by
#    tier, and against a value at its own tier the field is a conflict (#523).
#
# 7. REASONS: Each matching rule adds its rationale to the reasons list.
#
#
# KEY CONCEPTS
# ------------
# - data_modality: What biological data type (genomic, transcriptomic.bulk,
#   epigenomic.methylation, imaging.histology, etc.)
#
# - data_type: File content type (alignments, variants, reads, peaks, signal, etc.)
#
# - reference_assembly: Reference genome (GRCh38, GRCh37, CHM13, or null for
#   unaligned/raw data)
#
# - assay_type: Experimental method (WGS, WES, RNA-seq, ATAC-seq, ChIP-seq, etc.)
#
# - platform: Sequencing platform (ILLUMINA, PACBIO, ONT, MGI)
#
# - instrument_model: Sequencing instrument model, in ENA/SRA's spelling
#   (Illumina NovaSeq 6000, Revio, PromethION)
#
#
# FILE STRUCTURE (Multi-document YAML)
# ------------------------------------
# This file contains multiple YAML documents separated by '---':
#
# (The extension_map — extension -> file-type category — moved in-code to
#  meta_disco.file_name in #252, so it is no longer a document here.)
# 1. rules: The classification rules (main content)
# 2. validators: Python validator configurations for complex logic
# 3. reference_contig_lengths: Chromosome sizes for reference detection
# (Assay-type inference, which read other rules' answers, was removed in #88; the
#  Illumina instrument-prefix table, a vendor numbering convention, in #532.)
#
#
# RULE SCHEMA
# -----------
# - id: unique rule identifier (required)
# - tier: 1=extension, 2=filename, 3=header (required)
# - scope: extension|filename|header|vcf_header|fastq_header|file_size (required)
# - when: conditions that must all match (required)
# - then: effects to apply when rule matches (required)
# - rationale: explanation for this classification (recommended)
#
#
# CONDITION TYPES (in 'when')
# ---------------------------
# Extension/filename conditions:
# - extensions: list of clean core file extensions to match (e.g., [".bam",
#     ".cram"]). The parser peels every compression/archive container (.gz, .tar,
#     .zip, ...) off the name first, then recognizes the core underneath (#245), so
#     a core matches every compressed spelling: ".vcf" matches sample.vcf,
#     sample.vcf.gz, and sample.vcf.bgz alike (never list ".vcf.gz" here). An
#     archive container with no inner format (graph.tar.gz) has no core and matches
#     nothing — a container is not a content type. gVCF keeps its own core
#     (".g.vcf"): both classify as data_type variants, but ".g.vcf" derives
#     Format.GVCF (vs Format.VCF), so the distinction is not lost.
# - format: canonical file format to match (e.g., FASTA) — collapses the
#     spelling/compression variants of one format (.fa/.fasta/.fa.gz/.fasta.gz)
#     to a single identity, so key on this instead of re-listing extensions
#     (see EXTENSION_TO_FORMAT in meta_disco.file_name; issue #243)
# - filename_pattern: regex pattern for filename (case-insensitive)
#     A short bare token (`10x`, `cpg`, `rna`) tests as an unanchored substring and
#     so can match inside an opaque accession — `10X` sits inside IGVFFI1310XKZG,
#     which classified one FASTQ single-cell on three characters of an identifier
#     (#430). Anchor such a token on its left with `(^|[._-])`; that stops the
#     accession match while keeping `scRNAseq_R1` and `10xGenomics`, which a
#     trailing `([._-]|$)` would reject. A token of nine or more characters may
#     stay bare: it cannot fit the eight-character variable part of an IGVF
#     accession, and `WORD_FORMING` in test_rule_vocabulary lists each one with
#     its reason. An alternative that matches no file in either catalog is
#     deleted rather than anchored — the rule set is the minimum the data can
#     verify, grown explicitly for a new case or dataset.
#     `test_no_pattern_matches_inside_an_accession` enforces the anchoring.
# - dataset_pattern: regex pattern for dataset title
# - file_format: required format (.bam, .cram, etc)
#
# File size conditions:
# - file_size_min_gb: minimum file size in GB
# - file_size_max_gb: maximum file size in GB
#
# There are no state conditions: a rule has an opinion or not, and never reads
# what another rule said. Disagreement is settled only by tier, or by a curator
# (#88). A rule that names an assay declares the modality that assay implies in
# its own `then`, from the same evidence; no step derives one slot from another
# slot's answer.
#
# Header conditions (tier 3):
# - header_section: BAM header section (@HD, @RG, @PG, @SQ)
# - header_field: field within section (PL, PN, SN, AS, DS)
# - header_pattern: regex pattern to match in field value
# - header_absent: true if header section should NOT exist
# - vcf_header_type: VCF header line type (##reference, ##source, ##contig)
# - vcf_pattern: regex pattern for VCF header content
# - fastq_pattern: regex pattern for FASTQ read name
#
#
# EFFECT TYPES (in 'then')
# ------------------------
# Classification fields:
# - data_modality: set data modality (genomic, transcriptomic.bulk, etc.)
# - data_type: set data type (alignments, variants, reads, peaks, etc.)
# - reference_assembly: set reference (GRCh38, GRCh37, CHM13)
# - assay_type: set assay type (WGS, WES, RNA-seq, ATAC-seq, etc.)
# - platform: set sequencing platform (ILLUMINA, PACBIO, ONT, MGI)
# - instrument_model: set instrument model (Illumina NovaSeq 6000, Revio, etc.)
#
#
#
# TIPS FOR REVIEWING/EDITING RULES
# --------------------------------
# 1. Rule order does not matter: every matching rule's claims are kept and resolved
# 2. A pattern should match only what it can vouch for; two rules at one tier that
#    disagree on a file make a conflict, which is the intended outcome
# 3. A more specific signal belongs at a higher tier, not in an earlier position
# 4. No fallback rules: a rule never fills a field only because others left it empty
# 5. Confidence should reflect certainty: 0.95 for definitive, 0.60-0.80 for heuristics
# 6. Always provide a rationale explaining the classification logic
# 7. Test regex patterns - they're case-insensitive by default
#
#
# CONSOLIDATED FROM
# -----------------
# 1. rules/classification_rules.yaml (extension, filename rules)
# 2. src/meta_disco/header_classifier.py (header rules)
# 3. BED coordinate rules below + header_classifier.classify_from_bed_signals
# 4. scripts/classify_images.py (image extensions)
# 5. scripts/classify_auxiliary_genomic.py (FAST5/POD5/PLINK)

# =============================================================================
# UNIFIED RULES
# =============================================================================

rules:

  # ===========================================================================
  # EXTENSION-BASED RULES (tiers 1–2)
  # ===========================================================================
  # Tier 1: broad fallbacks (index files — reference_assembly left open)
  # Tier 2: definitive claims for files a name alone settles — checksum, log,
  #         upload, timestamp, images, nanopore raw, FASTQ baseline. Most name a
  #         kind in `data_type` and mark the data-describing dimensions
  #         not_applicable; `upload` and `timestamp` name no kind the vocabulary
  #         has, so they mark only statuses.

  # ---------------------------------------------------------------------------
  # Index files. `data_type` is the file's own kind, and the extension settles it —
  # the same answer `classify_index_files` gives from the same evidence (#437).
  #
  # It claims nothing else, which finishes what #106 began. That issue removed
  # `reference_assembly: not_applicable` from blanket rules like this one, because a
  # file named for CHM13 *is* associated with CHM13 and the stamp — terminal in the
  # evaluator until #523 — was blocking `filename_ref_*` from saying so. It left `data_modality`
  # and `platform` explicitly to be reconsidered. This is that reconsideration: the
  # dimensions a parent supplies all behave alike now, and none is stamped.
  #
  # They *do* apply to an index file. The matched path in `classify_index_files`
  # proves it by inheriting `genomic` / `CHM13` / `ILLUMINA` / `WGS` from the parent;
  # a `.bai` that has a reference assembly but no data modality was never coherent.
  # A rule that cannot see the parent cannot determine them, and `not_applicable`
  # would assert they cannot apply — a confident wrong answer, which coverage counts
  # as classified. Leaving them unclaimed is what `declined_record` does, for the same
  # reason, so the two agree.
  #
  # Contrast `checksum_file` below, which *does* claim `reference_assembly:
  # not_applicable`: a checksum is about bytes and has no coordinate space. An index
  # has one — it indexes coordinates into that assembly.
  #
  # The two claimants never see the same file — `classify_run` passes the index
  # output into the catch-all's skip set — so this is not a second opinion. It answers
  # an index file the producer did not reach: a partial run where it has not run, or a
  # name whose index extension the producer's literal-suffix match misses while
  # `FileName.parse` finds it (an uppercase `.BAI`, a wrapped `.fai.gz`).
  # ---------------------------------------------------------------------------
  - id: index_file
    tier: 1
    scope: extension
    when:
      extensions: [".bai", ".crai", ".tbi", ".csi", ".fai", ".gzi", ".idx", ".pbi"]
    then:
      data_type: index
    rationale: "Index file — an index; what it indexes is the parent's to say"

  # ---------------------------------------------------------------------------
  # Checksum files — `data_type` says what the file is, the rest do not apply.
  # Same correction as the index rule above (#437): `checksum` is a term in
  # `data_type_enum`, and stamping the dimension `not_applicable` asserted the file
  # has no kind when the vocabulary has a word for its kind.
  # ---------------------------------------------------------------------------
  - id: checksum_file
    tier: 2
    scope: extension
    when:
      extensions: [".md5"]
    then:
      data_type: checksum
      status:
        data_modality: not_applicable
        reference_assembly: not_applicable
        assay_type: not_applicable
        platform: not_applicable
        instrument_model: not_applicable
    rationale: "Checksum file — a checksum, and no data of its own"

  # ---------------------------------------------------------------------------
  # Log files - not applicable
  # ---------------------------------------------------------------------------
  - id: log_file
    tier: 2
    scope: extension
    when:
      extensions: [".log"]
    then:
      data_type: log
      status:
        data_modality: not_applicable
        reference_assembly: not_applicable
        assay_type: not_applicable
        platform: not_applicable
        instrument_model: not_applicable
    rationale: "Log file — a log, and no data of its own"

  # ---------------------------------------------------------------------------
  # VCF files - genomic by default
  # ---------------------------------------------------------------------------
  - id: variant_default_genomic
    tier: 1
    scope: extension
    when:
      extensions: [".vcf", ".bcf", ".gvcf", ".g.vcf"]
    then:
      data_modality: genomic
      data_type: variants
    rationale: "VCF files contain variant calls (genomic data)"

  # ---------------------------------------------------------------------------
  # PLINK genotype files
  # ---------------------------------------------------------------------------
  - id: plink_genomic
    tier: 1
    scope: extension
    when:
      extensions: [".pgen", ".pvar", ".psam"]
    then:
      data_modality: genomic
      data_type: genotypes
    rationale: "PLINK files contain genotype data (genomic)"

  # ---------------------------------------------------------------------------
  # Methylation array files
  # ---------------------------------------------------------------------------
  - id: idat_methylation
    tier: 1
    scope: extension
    when:
      extensions: [".idat"]
    then:
      data_modality: epigenomic.methylation
      data_type: array_signal
      assay_type: Methylation array
    rationale: "IDAT files are Illumina methylation array data"

  # ---------------------------------------------------------------------------
  # Single-cell matrix files
  # ---------------------------------------------------------------------------
  - id: sc_matrix_default
    tier: 1
    scope: extension
    when:
      extensions: [".h5ad", ".loom", ".mtx"]
    then:
      data_modality: transcriptomic.single_cell
      data_type: expression_matrix
    rationale: "Single-cell matrix format indicates scRNA-seq"

  # ---------------------------------------------------------------------------
  # Histology images (SVS)
  # ---------------------------------------------------------------------------
  - id: image_svs_histology
    tier: 2
    scope: extension
    when:
      extensions: [".svs"]
    then:
      data_modality: imaging.histology
      data_type: images
      assay_type: Histology
      status:
        platform: not_applicable
        instrument_model: not_applicable
        reference_assembly: not_applicable
    rationale: "SVS files are Aperio whole-slide histology images used for pathology analysis"

  # ---------------------------------------------------------------------------
  # Images - derived/QC plots
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------------
  # Histology images (SVS)
  # ---------------------------------------------------------------------------
  - id: image_derived
    tier: 2
    scope: extension
    when:
      extensions: [".png", ".jpg", ".jpeg", ".tiff", ".tif"]
    then:
      data_type: images
      status:
        data_modality: not_applicable
        platform: not_applicable
        instrument_model: not_applicable
        reference_assembly: not_applicable
        assay_type: not_applicable
    rationale: "Image files are derived visualizations (QC plots, assembly graphs) — not primary experimental data"

  # ---------------------------------------------------------------------------
  # Nanopore raw signal files
  # ---------------------------------------------------------------------------
  - id: nanopore_fast5
    tier: 2
    scope: extension
    when:
      extensions: [".fast5"]
    then:
      data_type: raw_signal
      platform: ONT
      status:
        reference_assembly: not_applicable
    rationale: "FAST5 files contain raw Oxford Nanopore electrical signal data. Reference not applicable until basecalling/alignment"

  - id: nanopore_pod5
    tier: 2
    scope: extension
    when:
      extensions: [".pod5"]
    then:
      data_type: raw_signal
      platform: ONT
      status:
        reference_assembly: not_applicable
    rationale: "POD5 files contain raw Oxford Nanopore electrical signal data (newer format replacing FAST5)"

  # ---------------------------------------------------------------------------
  # FASTQ/FQ - raw sequencing reads (unaligned, no reference)
  # ---------------------------------------------------------------------------
  - id: reads_base
    tier: 2
    scope: extension
    when:
      extensions: [".fastq", ".fq"]
    then:
      data_type: reads
      status:
        reference_assembly: not_applicable
    rationale: "FASTQ files contain raw sequencing reads. Reference not applicable until alignment"

  # ---------------------------------------------------------------------------
  # FASTA files - sequence data (assembly, reference, or transcriptome)
  # ---------------------------------------------------------------------------
  - id: fasta_base
    tier: 1
    scope: extension
    when:
      format: FASTA
    then:
      data_type: sequence
      status:
        platform: not_applicable
        instrument_model: not_applicable
        assay_type: not_applicable
    rationale: "FASTA file detected; header inspection needed to determine if de novo assembly, reference genome, or transcript sequences"

  # ---------------------------------------------------------------------------
  # Pangenome / sequence graphs (GFA, rGFA, GBZ, vg, GBWT, xg)
  # ---------------------------------------------------------------------------
  # data_type describes structure: linear sequence is FASTA (`sequence`,
  # refining to `assembly`/`assembly.reference`); a sequence graph is
  # `pangenome`. The reference-graph case (HPRC
  # minigraph-cactus, used as the alignment coordinate system) refines to
  # `pangenome.reference` via a tier-2 filename rule below. reference_assembly is
  # left to the shared filename_ref_* rules (an mc graph's grch38/chm13 token).
  - id: pangenome_graph
    tier: 1
    scope: extension
    when:
      extensions: [".gfa", ".rgfa", ".gbz", ".vg", ".gbwt", ".xg"]
    then:
      data_modality: genomic
      data_type: pangenome
      status:
        platform: not_applicable
        instrument_model: not_applicable
        assay_type: not_applicable
    rationale: "Sequence-graph formats (GFA/rGFA/GBZ/vg/GBWT/xg) encode a pangenome graph — a genomic assembly product, so no sequencing platform or assay applies"

  # ===========================================================================
  # TIER 2: FILENAME-BASED RULES
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Alignment files - assay/platform indicators in the filename
  # ---------------------------------------------------------------------------
  - id: alignment_isoseq_filename
    tier: 2
    scope: filename
    when:
      extensions: [".bam", ".cram"]
      filename_pattern: "(?i)\\.flnc\\."
    then:
      data_modality: transcriptomic.bulk
      data_type: alignments
    rationale: "Filename contains IsoSeq indicator (flnc = full-length non-chimeric transcript reads)"

  - id: alignment_hifi_filename
    tier: 2
    scope: filename
    when:
      extensions: [".bam", ".cram", ".sam"]
      filename_pattern: "(?i)(^|[._-])hifi|_pb_"
    then:
      data_type: alignments
      platform: PACBIO
    rationale: "HiFi names PacBio's read chemistry: it says the platform, not the assay or the modality — Iso-Seq is HiFi too (#430)"

  - id: alignment_star_aligner
    tier: 2
    scope: filename
    when:
      extensions: [".bam", ".cram", ".sam"]
      filename_pattern: "(?i)Aligned\\.sortedByCoord|_STAR_|\\.star\\."
    then:
      data_modality: transcriptomic.bulk
      data_type: alignments
      assay_type: RNA-seq
    rationale: "STAR aligner output indicates RNA-seq"

  # ---------------------------------------------------------------------------
  # Pangenome reference graphs (minigraph-cactus)
  # ---------------------------------------------------------------------------
  # HPRC minigraph-cactus (`mc`) graphs are the published pangenome references
  # used as the coordinate system for graph alignment (e.g. vg Giraffe), so they
  # refine the tier-1 `pangenome` base to `pangenome.reference`. Scoped to graph
  # extensions so the `-mc-` token can't match unrelated files. PGGB and
  # single-sample assembly graphs stay `pangenome` (not alignment references).
  - id: pangenome_reference_mc
    tier: 2
    scope: filename
    when:
      extensions: [".gfa", ".rgfa", ".gbz", ".vg", ".gbwt", ".xg"]
      filename_pattern: "(?i)-mc-"
    then:
      data_modality: genomic
      data_type: pangenome.reference
    rationale: "Minigraph-Cactus (mc) HPRC graphs are published pangenome references used as the alignment coordinate system"

  # ---------------------------------------------------------------------------
  # Reference assembly in filename
  # ---------------------------------------------------------------------------
  # A name or dataset that mentions a reference says nothing about whether the
  # file can have one, so these four rules claim only on the file kinds that hold
  # coordinates on a reference: alignments, variants, intervals and signal tracks,
  # sequence and its companions (a `.dict` sequence dictionary, `.sizes` contig
  # lengths), pangenome graphs and the vg indexes built from them, GFF3 annotations,
  # PLINK genotypes and variants (`.pgen` / `.pvar`; a `.psam` is a sample table with
  # no coordinates), and the indexes `.bai` / `.crai` / `.tbi` / `.csi` / `.fai` (not
  # `.idx`, `.pbi` or `.gzi`, which `index_file` lists too).
  #
  # Chains and whole-genome alignments (`.chain`, `.paf`, `.delta`, `.hal`) relate two
  # coordinate spaces. They are listed because in the corpus the other side of one
  # whose name carries a reference is a de novo assembly or a graph's haplotypes, so
  # the name's reference is the only one the file has (#526). One whose name carries
  # two references (`t2t-chm13-v1.0.hg38.over.chain`) gets two claims at this tier
  # and ends a `conflict`, which is what it is to a single `reference_assembly`. The list
  # is an include list rather than an exclude list so that a file kind it does not
  # name — a log, a checksum, a PDF, an archive with no inner format, a text table,
  # or one the name parser does not recognize — gets no claim until someone adds it
  # on purpose (#523). An archive whose name keeps an inner format
  # (`x.GRCh38.bam.tar.gz`) parses to that format's extension, so it is claimed as
  # the content it holds, the way the tar producer claims its `data_type` from the
  # members it reads. The anchor is defined here and reused by the other three rules.
  - id: filename_ref_grch38
    tier: 2
    scope: filename
    when:
      extensions: &reference_bearing_extensions
        [".bam", ".cram", ".sam",
         ".vcf", ".bcf", ".gvcf", ".g.vcf",
         ".bed", ".narrowpeak", ".broadpeak", ".bigwig", ".bw", ".bedgraph",
         ".fasta", ".fa", ".fna", ".dict", ".sizes",
         ".gfa", ".rgfa", ".gbz", ".vg", ".gbwt", ".xg",
         ".snarls", ".dist", ".min", ".gg", ".hapl", ".trans",
         ".chain", ".paf", ".delta", ".hal",
         ".gff3",
         ".pgen", ".pvar",
         ".bai", ".crai", ".tbi", ".csi", ".fai"]
      filename_pattern: "(?i)hg38|grch38|hs38"
    then:
      reference_assembly: GRCh38
    rationale: "Filename contains GRCh38/hg38 reference indicator"

  - id: filename_ref_grch37
    tier: 2
    scope: filename
    when:
      extensions: *reference_bearing_extensions
      filename_pattern: "(?i)hg19|grch37|hs37|b37"
    then:
      reference_assembly: GRCh37
    rationale: "Filename contains GRCh37/hg19 reference indicator"

  - id: filename_ref_chm13
    tier: 2
    scope: filename
    when:
      extensions: *reference_bearing_extensions
      filename_pattern: "(?i)chm13|t2t|CHM13v2|hs1"
    then:
      reference_assembly: CHM13
    rationale: "Filename contains CHM13/T2T reference indicator"

  # ---------------------------------------------------------------------------
  # Dataset-based reference rules
  # ---------------------------------------------------------------------------
  # dataset_t2t_reference was removed — replaced by coordinate-based detection
  # via fetchers.fetch_bed_signals, which reads actual BED file content from S3.
  # The blanket dataset rule misclassified GRCh38 liftover/comparison files
  # in T2T datasets as CHM13.

  - id: dataset_1000g_reference
    tier: 2
    scope: filename
    when:
      extensions: *reference_bearing_extensions
      dataset_pattern: "ANVIL_1000G_PRIMED_data_model"
    then:
      reference_assembly: GRCh38
    rationale: "1000 Genomes Project high-coverage data uses GRCh38 reference"

  # ---------------------------------------------------------------------------
  # FASTA assembly indicators
  # ---------------------------------------------------------------------------
  - id: fasta_assembly_filename
    tier: 2
    scope: filename
    when:
      format: FASTA
      filename_pattern: "(?i)(^|[._-])(assembly(?!\\d)|hap[12])|[._](pat|mat)(ernal)?[._]"
    then:
      data_modality: genomic
      data_type: assembly
      status:
        reference_assembly: not_applicable
    rationale: "Filename contains assembly/assembler indicator — de novo assembly"

  - id: fasta_haplotype_filename
    tier: 2
    scope: filename
    when:
      format: FASTA
      filename_pattern: "(?i)haplotype|(^|[._-])(phased|hapdup)"
    then:
      data_modality: genomic
      data_type: assembly
      status:
        reference_assembly: not_applicable
    rationale: "Filename contains haplotype/phasing indicator — de novo assembly"

  # ---------------------------------------------------------------------------
  # BED file classification rules (applied by classify_from_bed_signals)
  # ---------------------------------------------------------------------------
  - id: bed_methylation
    tier: 2
    scope: filename
    when:
      extensions: [".bed"]
      filename_pattern: "(?i)modbam2bed|(^|[._-])cpg"
    then:
      data_modality: epigenomic.methylation
      data_type: annotations
    rationale: "BED file is modbam2bed output or names CpG methylation calls; which assay produced them is not in the name"

  - id: bed_expression
    tier: 2
    scope: filename
    when:
      extensions: [".bed"]
      filename_pattern: "(?i)(^|[._-])(TMM|counts)|leafcutter|\\.TSS\\."
    then:
      data_modality: transcriptomic.bulk
      data_type: annotations
      assay_type: RNA-seq
    rationale: "BED file contains gene expression quantification or splicing data"

  - id: bed_assembly_qc
    tier: 2
    scope: filename
    when:
      extensions: [".bed"]
      filename_pattern: "(?i)(\\.hap[12]\\.|[\\./_]paternal[\\./_]|[\\./_]maternal[\\./_]|\\.dip\\.bed|\\.switch\\.|(^|[._-])flagger|\\.lowQ\\.|unreliable|issues\\.bed|_genbank\\.)"
    then:
      data_modality: genomic
      data_type: annotations
    rationale: "BED file is assembly QC output (haplotype regions, error flags) on de novo genomic assemblies"

  - id: bed_regions
    tier: 2
    scope: filename
    when:
      extensions: [".bed"]
      filename_pattern: "\\.regions\\.bed"
    then:
      data_modality: genomic
      data_type: annotations
    rationale: "BED file contains genomic analysis regions (callable, target, etc.)"

  # ---------------------------------------------------------------------------
  # Signal track classification
  # ---------------------------------------------------------------------------
  - id: signal_rnaseq
    tier: 2
    scope: filename
    when:
      extensions: [".bigwig", ".bw", ".bigWig", ".bedGraph"]
      filename_pattern: "(?i)rna|transcriptome|coverage"
    then:
      data_modality: transcriptomic.bulk
      data_type: signal
    rationale: "Signal track with RNA/coverage indicator"

  # ---------------------------------------------------------------------------
  # Intervals - target/capture region files (reference data, not primary)
  # ---------------------------------------------------------------------------
  - id: intervals_targets
    tier: 1
    scope: filename
    when:
      extensions: [".bed"]
      filename_pattern: "(?i)(^|[._-])(targets?|regions?|capture|exome)"
    then:
      status:
        data_modality: not_applicable
        data_type: not_applicable
        assay_type: not_applicable
        platform: not_applicable
        instrument_model: not_applicable
    rationale: "Target/capture region file — reference data, not primary experimental data"

  # ---------------------------------------------------------------------------
  # Text files - QC stats (not primary data)
  # ---------------------------------------------------------------------------
  - id: text_stats
    tier: 2
    scope: filename
    when:
      extensions: [".txt", ".tsv"]
      filename_pattern: "(?i)\\.stats\\.txt$|samtools\\.stats|(^|[._-])mosdepth"
    then:
      status:
        data_modality: not_applicable
        data_type: not_applicable
        assay_type: not_applicable
        platform: not_applicable
        instrument_model: not_applicable
    rationale: "QC/stats file — supplementary data, not primary experimental data"

  - id: text_expression
    tier: 2
    scope: filename
    when:
      extensions: [".txt", ".tsv", ".csv"]
      filename_pattern: "(?i)expression|tpm\\.txt|fpkm\\.txt"
    then:
      data_modality: transcriptomic.bulk
      data_type: expression_matrix
    # No bare `counts.txt`: a count says nothing about what is counted, so a gene-count
    # table is left unclassified too. ANVIL_T2T's chrN.<population>.counts.txt are
    # chromosome/bin/count tables, not expression matrices (#485).
    rationale: "Filename contains `expression`, `tpm.txt` or `fpkm.txt`"

  - id: salmon_quant
    tier: 2
    scope: filename
    when:
      extensions: [".sf"]
      filename_pattern: "(?i)(^|[._])quant\\.sf$"
    then:
      data_modality: transcriptomic.bulk
      data_type: quantification
      assay_type: RNA-seq
    rationale: "Salmon/Sailfish transcript-level quantification (quant.sf)"

  # ===========================================================================
  # TIER 3: HEADER-BASED RULES (BAM/CRAM @RG, @PG, @SQ)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Platform detection from @RG PL field
  # ---------------------------------------------------------------------------
  - id: platform_pacbio
    tier: 3
    scope: header
    when:
      extensions: [".bam", ".cram"]
      header_section: "@RG"
      header_field: "PL"
      header_pattern: "PACBIO"
    then:
      platform: PACBIO
    rationale: "PL:PACBIO indicates PacBio long-read sequencing"

  - id: platform_illumina
    tier: 3
    scope: header
    when:
      extensions: [".bam", ".cram"]
      header_section: "@RG"
      header_field: "PL"
      header_pattern: "ILLUMINA"
    then:
      platform: ILLUMINA
    rationale: "PL:ILLUMINA in @RG header — definitive Illumina platform tag"

  - id: platform_ont
    tier: 3
    scope: header
    when:
      extensions: [".bam", ".cram"]
      header_section: "@RG"
      header_field: "PL"
      header_pattern: "ONT"
    then:
      platform: ONT
    rationale: "PL:ONT indicates Oxford Nanopore long-read sequencing"

  # ---------------------------------------------------------------------------
  # Instrument model from the @RG PM field (#532). The SAM spec defines PM as the
  # platform model but leaves its text free, so each rule matches one whole value
  # that names exactly one ENA/SRA model, and declares the platform that model
  # implies from the same evidence. Values that name several are not read:
  # `SEQUELII` (Sequel II and Sequel IIe both), `SEQUEL` (written on Sequel II runs
  # too: in the corpus it sits on m64 movies, and a submitter says Sequel II on 124
  # such files), `NovaSeq` (a family), and the ONT
  # flow-cell positions and device serials (`1A`, `PC48B200`) written into the
  # same field. Nor is any read-name serial prefix (`A00297`, `m84046`): that is a
  # vendor numbering convention no standard states, not the file naming its model.
  # ---------------------------------------------------------------------------
  - id: instrument_model_revio
    tier: 3
    scope: header
    when:
      extensions: [".bam", ".cram"]
      header_section: "@RG"
      header_field: "PM"
      header_pattern: "^REVIO$"
    then:
      instrument_model: Revio
      platform: PACBIO
    rationale: "@RG PM is REVIO, which names the PacBio Revio; the model implies the platform"

  - id: instrument_model_novaseq_x
    tier: 3
    scope: header
    when:
      extensions: [".bam", ".cram"]
      header_section: "@RG"
      header_field: "PM"
      header_pattern: "^NovaSeq X$"
    then:
      instrument_model: Illumina NovaSeq X
      platform: ILLUMINA
    rationale: "PM:NovaSeq X names the Illumina NovaSeq X, and so the platform; `NovaSeq X Plus` is a different value and not matched"

  - id: ont_basecall_dna
    tier: 3
    scope: header
    when:
      extensions: [".bam", ".cram"]
      header_section: "@RG"
      header_field: "DS"
      header_pattern: "basecall_model=[^;\\s]*dna_"
    then:
      data_modality: genomic
    rationale: "ONT basecall model containing dna_ indicates DNA sequencing (genomic data). Handles both modern (dna_r10...) and legacy date-prefixed (2021-05-05_dna_r9...) formats"

  - id: program_star
    tier: 3
    scope: header
    when:
      extensions: [".bam", ".cram"]
      header_section: "@PG"
      header_field: "PN"
      header_pattern: "STAR"
    then:
      data_modality: transcriptomic.bulk
      data_type: alignments
      assay_type: RNA-seq
    rationale: "STAR (Spliced Transcripts Alignment to a Reference) is the most widely used RNA-seq aligner. Presence strongly indicates RNA-seq data"




  - id: program_bwa
    tier: 3
    scope: header
    when:
      extensions: [".bam", ".cram"]
      header_section: "@PG"
      header_field: "PN"
      header_pattern: "bwa"
    then:
      data_modality: genomic
      data_type: alignments
    rationale: "BWA (Burrows-Wheeler Aligner) is the standard short-read aligner for DNA sequencing. Commonly used for WGS, WES, and ChIP-seq"

  - id: program_minimap2
    tier: 3
    scope: header
    when:
      extensions: [".bam", ".cram"]
      header_section: "@PG"
      header_field: "PN"
      header_pattern: "minimap2"
    then:
      data_modality: genomic
      data_type: alignments
    rationale: "Minimap2 is a versatile aligner for long reads (PacBio, ONT) and assemblies. Can also be used for direct RNA with -ax splice preset"

  - id: program_ccs
    tier: 3
    scope: header
    when:
      extensions: [".bam", ".cram"]
      header_section: "@PG"
      header_field: "PN"
      header_pattern: "ccs"
    then:
      platform: PACBIO
    rationale: "The 'ccs' program generates HiFi reads from PacBio subreads. Confirms PacBio platform (used for both WGS and IsoSeq)"







  - id: unaligned_no_sq
    tier: 3
    scope: header
    when:
      extensions: [".bam", ".cram"]
      header_section: "@SQ"
      header_absent: true
    then:
      status:
        reference_assembly: not_applicable
    rationale: "Absence of @SQ lines indicates unaligned reads. Common for PacBio HiFi deliverables before alignment"

  # ===========================================================================
  # TIER 3: VCF HEADER RULES
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # VCF reference detection
  #
  # The human primary-assembly GenBank accession GCA_000001405 encodes the
  # assembly in its version: .1-.14 are GRCh37 (frozen at GRCh37.p13 = .14),
  # and .15 onward are GRCh38 (.15 base, .16+ are GRCh38 patches). So the
  # accession sub-patterns below split at that boundary: <=14 -> GRCh37 (a
  # closed range), >=15 -> GRCh38 (open-ended, to catch future patches). The
  # durable fix is an accession->assembly deriver (see follow-up issue).
  # ---------------------------------------------------------------------------
  - id: vcf_ref_grch38
    tier: 3
    scope: vcf_header
    when:
      extensions: [".vcf", ".bcf", ".gvcf", ".g.vcf"]
      vcf_header_type: "##reference"
      vcf_pattern: "(?i)(grch38|hg38|hs38|GCA_000001405\\.(1[5-9]|[2-9]\\d|\\d{3,}))"
    then:
      reference_assembly: GRCh38
    rationale: "##reference line containing GRCh38, hg38, or the GRCh38 GenBank accession indicates variants called against GRCh38"


  - id: vcf_ref_chm13
    tier: 3
    scope: vcf_header
    when:
      extensions: [".vcf", ".bcf", ".gvcf", ".g.vcf"]
      vcf_header_type: "##reference"
      vcf_pattern: "(?i)(chm13|t2t|hs1)"
    then:
      reference_assembly: CHM13
    rationale: "##reference line containing CHM13 or T2T indicates variants called against T2T-CHM13"

  - id: vcf_contig_grch38
    tier: 3
    scope: vcf_header
    when:
      extensions: [".vcf", ".bcf", ".gvcf", ".g.vcf"]
      vcf_header_type: "##contig"
      vcf_pattern: "(?i)(grch38|hg38|hs38|GCA_000001405\\.(1[5-9]|[2-9]\\d|\\d{3,}))"
    then:
      reference_assembly: GRCh38
    rationale: "##contig assembly subfield naming GRCh38, hg38, hs38, or the GRCh38 GenBank accession declares the reference genome"


  - id: vcf_contig_chm13
    tier: 3
    scope: vcf_header
    when:
      extensions: [".vcf", ".bcf", ".gvcf", ".g.vcf"]
      vcf_header_type: "##contig"
      vcf_pattern: "(?i)(chm13|t2t|hs1)"
    then:
      reference_assembly: CHM13
    rationale: "##contig assembly subfield naming CHM13, T2T, or hs1 declares the reference genome"

  # ---------------------------------------------------------------------------
  # VCF germline variant callers
  # ---------------------------------------------------------------------------
  - id: vcf_gatk_haplotypecaller
    tier: 3
    scope: vcf_header
    when:
      extensions: [".vcf", ".bcf", ".gvcf", ".g.vcf"]
      vcf_header_type: "##source"
      vcf_pattern: "(?i)haplotypecaller"
    then:
      data_modality: genomic
      data_type: variants.germline
    rationale: "GATK HaplotypeCaller is the standard germline SNV/indel caller"














  - id: vcf_svim
    tier: 3
    scope: vcf_header
    when:
      extensions: [".vcf", ".bcf"]
      vcf_header_type: "##source"
      vcf_pattern: "(?i)svim"
    then:
      data_modality: genomic
      data_type: variants.structural
    rationale: "SVIM detects structural variants from long-read sequencing data (PacBio/ONT)"

  - id: vcf_sniffles
    tier: 3
    scope: vcf_header
    when:
      extensions: [".vcf", ".bcf"]
      vcf_header_type: "##source"
      vcf_pattern: "(?i)sniffles"
    then:
      data_modality: genomic
      data_type: variants.structural
    rationale: "Sniffles is a long-read SV caller optimized for PacBio and ONT data"





  - id: vcf_info_sv
    tier: 3
    scope: vcf_header
    when:
      extensions: [".vcf", ".bcf"]
      vcf_header_type: "##INFO"
      vcf_pattern: "^(SVTYPE|SVLEN|CIPOS|CIEND|MATEID|IMPRECISE)$"
    then:
      data_type: variants.structural
    rationale: "Standard SV INFO fields (SVTYPE, SVLEN, CIPOS, etc.) indicate structural variant calls"

  - id: fastq_illumina_modern
    tier: 3
    scope: fastq_header
    when:
      extensions: [".fastq", ".fq"]
      fastq_pattern: "^@[A-Z0-9-]+:\\d+:[A-Z0-9]+:\\d+:\\d+:\\d+:\\d+"
    then:
      platform: ILLUMINA
    rationale: "Modern Illumina read names (Casava 1.8+) follow the format @instrument:run:flowcell:lane:tile:x:y"



  - id: fastq_illumina_hiseq_desc
    tier: 3
    scope: fastq_header
    when:
      extensions: [".fastq", ".fq"]
      fastq_pattern: " HS2[05]00[-_]"
    then:
      platform: ILLUMINA
    rationale: "HiSeq 2000/2500 instrument identifier found in read description"

  - id: fastq_illumina_ena_hiseq
    tier: 3
    scope: fastq_header
    when:
      extensions: [".fastq", ".fq"]
      fastq_pattern: "^@[EDS]RR\\d+\\.\\d+ HS2[05]00"
    then:
      platform: ILLUMINA
    rationale: "ENA/SRA-reformatted read names with HiSeq 2000/2500 instrument ID in description"

  # ---------------------------------------------------------------------------
  # PacBio read name patterns
  # ---------------------------------------------------------------------------
  - id: fastq_pacbio_ccs
    tier: 3
    scope: fastq_header
    when:
      extensions: [".fastq", ".fq"]
      fastq_pattern: "^@m\\d+[A-Za-z]*_\\d+_\\d+/\\d+/ccs"
    then:
      platform: PACBIO
      data_type: reads
    rationale: "PacBio CCS (HiFi) read names follow @movie/zmw/ccs format. The 'ccs' suffix indicates high-accuracy long reads (>Q20)"


  - id: fastq_pacbio_generic
    tier: 3
    scope: fastq_header
    when:
      extensions: [".fastq", ".fq"]
      fastq_pattern: "^@m\\d+[A-Za-z]*_\\d+_\\d+/\\d+"
    then:
      platform: PACBIO
      data_type: reads
    rationale: "Generic PacBio read names follow @movie/zmw format"

  # ---------------------------------------------------------------------------
  # ONT read name patterns
  # ---------------------------------------------------------------------------
  - id: fastq_ont_uuid
    tier: 3
    scope: fastq_header
    when:
      extensions: [".fastq", ".fq"]
      fastq_pattern: "^@[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}"
    then:
      platform: ONT
      data_type: reads
    rationale: "ONT read names are UUIDs (format: 8-4-4-4-12 hex characters). Uniquely identifies Oxford Nanopore data"

  - id: fastq_ont_metadata
    tier: 3
    scope: fastq_header
    when:
      extensions: [".fastq", ".fq"]
      fastq_pattern: "runid=[a-f0-9]+"
    then:
      platform: ONT
      data_type: reads
    rationale: "ONT reads often include 'runid=' metadata in the header line"

  # ---------------------------------------------------------------------------
  # MGI/BGI read name patterns
  # ---------------------------------------------------------------------------



  - id: fastq_modality_unknown
    tier: 3
    scope: fastq_header
    when:
      extensions: [".fastq", ".fq"]
    then:
      status:
        data_modality: not_classified
    rationale: "FASTQ modality cannot be determined from reads alone — could be genomic, transcriptomic, or epigenomic depending on assay"



---
# =============================================================================
# VALIDATOR CONFIGURATIONS
# =============================================================================
# Complex matching logic that requires Python code

validators:
  contig_length_detector:
    description: "Detect reference assembly from chromosome lengths in @SQ or ##contig lines"
    module: "meta_disco.validators.contig_lengths"
    function: "detect_reference_from_contigs"
    applies_to: ["header", "vcf_header"]

  max_position_detector:
    description: "Detect reference assembly by ruling out references where variant positions exceed chromosome lengths"
    module: "meta_disco.validators.contig_lengths"
    function: "detect_reference_from_max_positions"
    applies_to: ["vcf_header"]

  illumina_read_parser:
    description: "Parse Illumina read names to extract instrument, flowcell, lane"
    module: "meta_disco.validators.read_name_parsers"
    function: "parse_illumina_read_name"
    applies_to: ["fastq_header"]

  pacbio_read_parser:
    description: "Parse PacBio read names to extract movie, ZMW, read type"
    module: "meta_disco.validators.read_name_parsers"
    function: "parse_pacbio_read_name"
    applies_to: ["fastq_header"]

  ont_read_parser:
    description: "Parse ONT read names to extract UUID and metadata"
    module: "meta_disco.validators.read_name_parsers"
    function: "parse_ont_read_name"
    applies_to: ["fastq_header"]

