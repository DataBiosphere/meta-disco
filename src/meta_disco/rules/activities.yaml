# What each activity takes in and passes on (#580). Shape: the LinkML class
# `ActivityDeclarations`. `kind` absent: any; `passes` absent: nothing; `passes_samples`
# absent: no samples (#668).
activities:
  - term: Activity
    output: {form: [file, identifier]}
    inputs:
      - {role: input, form: [file, identifier], required: true, many: true}
    reason: >-
      The step is not known, so nothing is known to pass: a generic `derived_from` in the
      source (IGVF's `file.derived_from` between two content types no term names) or an
      `activity_type` of `Unknown`, whose rows name files and samples alike.
  - term: SampleCollectionActivity
    output: {form: [identifier]}
    inputs:
      - {role: donor, form: [identifier], required: true, many: false}
    reason: >-
      A sample taken from a donor, the donor read from the sample's own row
      (`anvil_biosample.donor_id`, a submitter donor column); an identifier has no
      dimensions to pass.
  - term: SampleTreatmentActivity
    output: {form: [identifier]}
    inputs:
      - {role: sample, form: [identifier], required: true, many: false}
    reason: One sample made from another; an identifier has no dimensions to pass.
  - term: SequenceActivity
    output: {form: [file], kind: [reads, raw_signal]}
    inputs:
      - {role: sample, form: [identifier], required: true, many: true}
    reason: >-
      Reads made from a sample. Its input is a sample identifier, which has no dimensions;
      the reads' own platform and assay come from their own evidence.
  - term: AlignmentActivity
    output: {form: [file], kind: [alignments]}
    inputs:
      - role: reads
        form: [file]
        kind: [reads]
        required: true
        many: true
        passes: [data_modality, assay_type, platform, instrument_model]
      - role: reference
        form: [file]
        kind: [sequence, assembly, pangenome]
        required: true
        many: false
        passes: [reference_assembly]
    reason: >-
      An alignment is its reads placed on a reference: the sequencer and the library pass
      from the reads, and the reference assembly from the reference it was aligned to.
  - term: AssemblyAlignmentActivity
    output: {form: [file], kind: [alignments]}
    inputs:
      - role: query
        form: [file]
        kind: [assembly]
        required: true
        many: false
        passes: [data_modality, assay_type, platform, instrument_model]
      - role: reference
        form: [file]
        kind: [sequence, assembly, pangenome]
        required: true
        many: false
        passes: [reference_assembly]
    reason: >-
      An assembly's contigs placed on a reference (HPRC_R2's winnowmap BAMs on CHM13 and
      GRCh38, #682): what the assembly says of its signal, library and sequencer passes, as a
      read alignment's reads' does, and the reference assembly from the reference. It has no
      reads, so it declares its own roles rather than AlignmentActivity's, whose reads are
      required. An alignment names its own samples, so none pass. Where no source names the
      reference file, the step is flagged for its missing `reference`, as an AlignmentActivity's
      is, and the alignment's reference assembly is its own, from its @SQ lines.
  - term: VariantCallActivity
    output: {form: [file], kind: [variants, genotypes]}
    inputs:
      - role: calls_from
        form: [file]
        kind: [alignments]
        required: true
        many: true
        passes: [data_modality, assay_type, platform, instrument_model, reference_assembly]
    reason: >-
      Variants are called in the coordinates of the alignments they are called from, so the
      reference passes with the sequencer and the library. The variant kind does not: the
      caller decides it (#654). A joint genotyping of gVCFs is JointGenotypingActivity.
  - term: JointGenotypingActivity
    output: {form: [file], kind: [variants, genotypes]}
    inputs:
      - role: genotyped_from
        form: [file]
        kind: [variants]
        required: true
        many: false
        passes: [data_modality, assay_type, platform, instrument_model, reference_assembly, variant_kind, variant_origin]
    reason: >-
      GATK's GenotypeGVCFs genotypes the calls one store of gVCFs holds (a GenomicsDB
      workspace, or a CombineGVCFs file) across every sample in it, and calls no variant the
      gVCFs did not hold: the caller that made them decided the calls' kind and origin, so
      both pass, with what the store's reads and reference say (#678).
  - term: ExpressionActivity
    output: {form: [file], kind: [quantification, expression_matrix]}
    inputs:
      - role: quantified
        form: [file]
        kind: [reads]
        required: true
        many: true
        passes: [data_modality, assay_type, platform, instrument_model]
    reason: >-
      A quantification counts the library its reads came from, so the sequencer and the library
      pass. The reference does not (#595): salmon and kallisto quantify against a transcriptome,
      not the reads' reference, and FASTQ reads say `not_applicable`, which would pass on as a
      false claim about the quantification. The input is reads only: a step counting genome
      alignments (featureCounts on a genome BAM) would keep the BAM's reference, and needs a
      term of our own under this one; mapped here, it is flagged as a misfit.
  - term: AnalysisActivity
    output: {form: [file]}
    inputs:
      - {role: analysed, form: [file], required: true, many: true}
    reason: >-
      Too broad to say what passes: differential expression and splicing analysis share
      this term. A narrower term of our own under it declares its own.
  - term: ImageActivity
    output: {form: [file], kind: [images]}
    inputs:
      - {role: sample, form: [identifier], required: true, many: false}
    reason: An image is made from a sample; an identifier has no dimensions to pass.
  - term: IndexActivity
    output: {form: [file], kind: [index]}
    inputs:
      - role: indexed
        form: [file]
        required: true
        many: false
        passes: [data_modality, assay_type, platform, instrument_model, reference_assembly, variant_kind, variant_origin]
        passes_samples: true
    reason: >-
      An index describes the data it points into, so it takes every dimension but its own
      kind, `data_type`, and the samples that data holds (#668).
  - term: ChecksumActivity
    output: {form: [file], kind: [checksum]}
    inputs:
      - role: checked
        form: [file]
        required: true
        many: false
        passes_samples: true
    reason: >-
      A checksum is a hash of its file's bytes, so it takes no dimension from it, and the step
      is the link (ADR-0002 decision 8, amended by #596). For an `.md5`, the `checksum_file`
      rule makes the dimensions `not_applicable`. It is about exactly its file, so it takes
      that file's samples (#668).
  - term: QualityControlActivity
    output: {form: [file], kind: [qc_report, annotations]}
    inputs:
      - role: reported_on
        form: [file]
        required: true
        many: false
        passes: [data_modality, assay_type, platform, instrument_model, reference_assembly]
        passes_samples: true
    reason: >-
      A report on one file's content (samtools stats, mosdepth, bcftools stats, #683) describes that file's data,
      so it takes every dimension but its own kind, and that file's samples (#668).
  - term: CoverageActivity
    output: {form: [file], kind: [annotations]}
    inputs:
      - role: covered
        form: [file]
        kind: [alignments]
        required: true
        many: false
        passes: [data_modality, assay_type, platform, instrument_model, reference_assembly]
        passes_samples: true
    reason: >-
      A track of one alignment's read depth at each position is in that alignment's
      coordinates and counts its reads, so it takes every dimension but its own kind, and
      the alignment's samples (#668).
  - term: GenomeAnnotationActivity
    output: {form: [file], kind: [annotations]}
    inputs:
      - role: annotated
        form: [file]
        kind: [assembly, sequence]
        required: true
        many: false
        passes: [data_modality, assay_type, platform, instrument_model, reference_assembly, variant_kind, variant_origin]
        passes_samples: true
    reason: >-
      Features found in one genome sequence and written in its own coordinates (HPRC_R2's
      RepeatMasker, centromeric satellite, segmental duplication and liftoff gene annotations of
      each assembly, #682) describe that sequence, so they take every dimension but their own
      kind, and its samples. An annotation of a genome sequence is not a callset, so the
      sequence's variant kind and origin pass too; a callset's annotation is a
      VariantProcessingActivity, which is why the input is a sequence or an assembly only.
  - term: LiftoverActivity
    output: {form: [file]}
    inputs:
      - role: lifted
        form: [file]
        required: true
        many: false
        passes: [data_modality, assay_type, platform, instrument_model]
    reason: A liftover changes the reference and keeps the rest.
  - term: VariantProcessingActivity
    abstract: true
    output: {form: [file], kind: [variants, genotypes]}
    inputs:
      - role: processed
        form: [file]
        kind: [variants, genotypes]
        required: true
        many: false
        passes: [data_modality, assay_type, platform, instrument_model, reference_assembly, variant_origin]
    reason: >-
      A callset processed into another keeps the calls it keeps as they were made: rows are
      labelled, removed or annotated, or some samples are dropped, but every call left came
      from the same reads, aligned to the same reference, by the same caller, so what those
      say still holds, the calls' origin among it (#658). The variant kind does not pass: a
      selection by type (SelectVariants keeping SNPs) narrows it (#654).
  - term: VariantFilterActivity
    reason: >-
      A filter labels or drops rows and changes nothing about the reads or reference behind
      the rows it keeps, so it passes what its parent declares.
  - term: MergeActivity
    output: {form: [file]}
    inputs:
      - role: shard
        form: [file]
        required: true
        many: true
        passes: [data_modality, assay_type, platform, instrument_model, reference_assembly, variant_kind, variant_origin]
    reason: >-
      Files of one kind joined into one keep what they share; where the inputs differ, the
      output is mixed (ADR-0002 decision 8).
  - term: CohortMergeActivity
    output: {form: [file]}
    inputs:
      - role: input_list
        form: [file]
        required: true
        many: false
        read_through: member
        passes: [data_modality, assay_type, platform, instrument_model, reference_assembly, variant_kind, variant_origin]
        passes_samples: true
    reason: >-
      A merge of the files a cohort's list names (a GenomicsDB workspace built from a GATK
      sample-name map, #621): its input is the list, not each file, and the list passes
      no dimension of its own, so the output takes what the list's members settle to, read
      through it, as a merge takes what its shards share. Its samples are the ones the list
      names, taken from the list itself (#668).
  - term: CohortDefinitionActivity
    output: {form: [file]}
    inputs:
      - role: member
        form: [file]
        kind: [variants]
        required: true
        many: true
    reason: >-
      A list of the files processed together (a GATK sample-name map, #621) is not their
      data: a list of names is not Illumina data, so it passes nothing, as a checksum
      passes no dimension (#596). A step given the list reads its members' answers through it
      (`read_through`). The list names its samples itself, in its first column (#668).
  - term: AssemblyActivity
    output: {form: [file], kind: [assembly]}
    inputs:
      - role: reads
        form: [file]
        kind: [reads]
        required: true
        many: true
        passes: [data_modality, assay_type, platform, instrument_model]
    reason: An assembly is its own reference, so the reads' reference does not pass.
