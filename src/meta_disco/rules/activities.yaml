# What each activity takes in and passes on (#580). Shape: the LinkML class
# `ActivityDeclarations`. `kind` absent: any; `passes` absent: nothing.
activities:
  - term: Activity
    output: {form: [file, identifier]}
    inputs:
      - {role: input, form: [file, identifier], required: true, many: true}
    reason: >-
      The step is not known, so nothing is known to pass: a generic `derived_from` in the
      source (IGVF's `file.derived_from` between two content types no term names) or an
      `activity_type` of `Unknown`, whose rows name files and samples alike.
  - term: SampleCollectionActivity
    output: {form: [identifier]}
    inputs:
      - {role: donor, form: [identifier], required: true, many: false}
    reason: >-
      A sample taken from a donor, the donor read from the sample's own row
      (`anvil_biosample.donor_id`, a submitter donor column); an identifier has no
      dimensions to pass.
  - term: SampleTreatmentActivity
    output: {form: [identifier]}
    inputs:
      - {role: sample, form: [identifier], required: true, many: false}
    reason: One sample made from another; an identifier has no dimensions to pass.
  - term: SequenceActivity
    output: {form: [file], kind: [reads, raw_signal]}
    inputs:
      - {role: sample, form: [identifier], required: true, many: true}
    reason: >-
      Reads made from a sample. Its input is a sample identifier, which has no dimensions;
      the reads' own platform and assay come from their own evidence.
  - term: AlignmentActivity
    output: {form: [file], kind: [alignments]}
    inputs:
      - role: reads
        form: [file]
        kind: [reads]
        required: true
        many: true
        passes: [data_modality, assay_type, platform, instrument_model]
      - role: reference
        form: [file]
        kind: [sequence, assembly, pangenome]
        required: true
        many: false
        passes: [reference_assembly]
    reason: >-
      An alignment is its reads placed on a reference: the sequencer and the library pass
      from the reads, and the reference assembly from the reference it was aligned to.
  - term: VariantCallActivity
    output: {form: [file], kind: [variants, genotypes]}
    inputs:
      - role: calls_from
        form: [file]
        kind: [alignments, variants]
        required: true
        many: true
        passes: [data_modality, assay_type, platform, instrument_model, reference_assembly]
    reason: >-
      Variants are called in the coordinates of the alignments (or gVCFs) they are called
      from, so the reference passes with the sequencer and the library.
  - term: ExpressionActivity
    output: {form: [file], kind: [quantification, expression_matrix]}
    inputs:
      - {role: quantified, form: [file], kind: [reads, alignments], required: true, many: true}
    reason: >-
      Not decided: whether a quantification keeps its reads' reference depends on the tool
      (salmon quantifies against a transcriptome), and no translation row maps to this term yet.
  - term: AnalysisActivity
    output: {form: [file]}
    inputs:
      - {role: analysed, form: [file], required: true, many: true}
    reason: >-
      Too broad to say what passes: differential expression and splicing analysis share
      this term. A narrower term of our own under it declares its own.
  - term: ImageActivity
    output: {form: [file], kind: [images]}
    inputs:
      - {role: sample, form: [identifier], required: true, many: false}
    reason: An image is made from a sample; an identifier has no dimensions to pass.
  - term: IndexActivity
    output: {form: [file], kind: [index]}
    inputs:
      - role: indexed
        form: [file]
        required: true
        many: false
        passes: [data_modality, assay_type, platform, instrument_model, reference_assembly]
    reason: >-
      An index describes the data it points into, so it takes every dimension but its own
      kind, `data_type`.
  - term: ChecksumActivity
    output: {form: [file], kind: [checksum]}
    inputs:
      - role: checked
        form: [file]
        required: true
        many: false
    reason: >-
      A checksum is a hash of one file's bytes and holds no data the dimensions could
      describe, so it takes nothing from that file (#596, amending ADR-0002 decision 8):
      the `checksum_file` rule makes them `not_applicable`. The step is still the link to
      the file it checks. An index differs: it points into coordinates on its file's
      reference, so it takes every dimension but its own kind.
  - term: QualityControlActivity
    output: {form: [file], kind: [qc_report, annotations]}
    inputs:
      - role: reported_on
        form: [file]
        required: true
        many: false
        passes: [data_modality, assay_type, platform, instrument_model, reference_assembly]
    reason: >-
      A report on one file's content (samtools stats, mosdepth) describes that file's data,
      so it takes every dimension but its own kind.
  - term: LiftoverActivity
    output: {form: [file]}
    inputs:
      - role: lifted
        form: [file]
        required: true
        many: false
        passes: [data_modality, assay_type, platform, instrument_model]
    reason: A liftover changes the reference and keeps the rest.
  - term: MergeActivity
    output: {form: [file]}
    inputs:
      - role: shard
        form: [file]
        required: true
        many: true
        passes: [data_modality, assay_type, platform, instrument_model, reference_assembly]
    reason: >-
      Files of one kind joined into one keep what they share; where the inputs differ, the
      output is mixed (ADR-0002 decision 8).
  - term: AssemblyActivity
    output: {form: [file], kind: [assembly]}
    inputs:
      - role: reads
        form: [file]
        kind: [reads]
        required: true
        many: true
        passes: [data_modality, assay_type, platform, instrument_model]
    reason: An assembly is its own reference, so the reads' reference does not pass.
