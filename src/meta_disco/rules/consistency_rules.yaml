# Self-consistency invariants (#314) — cross-field semantic rules over CLASSIFIED
# records. Each violation is a concrete internal contradiction ("these two fields
# can't both be true"), caught with no ground truth. This is a post-hoc QA layer,
# separate from the classification rule engine (unified_rules.yaml).
#
# Rule shape (evaluated by consistency.py):
#   id:          stable identifier
#   description: human-readable statement of the invariant
#   when:        field -> matcher; the rule is ACTIVE only when every matcher holds
#                  "<value>"            -> field is classified AND value == <value>
#                  {under: <term>}      -> classified AND value is <term> or below it in
#                                          the field's `is_a` tree (#563)
#                  {value_in: [...]}    -> classified AND value in list
#                  {status: <status>}   -> field status == <status>
#   require:     field -> matcher; a violation is raised when any is UNsatisfied
#                  {value_in: [...]}    -> violation if classified AND value not in list
#                  {value_not_in: [...]}-> violation if classified AND value in list
#                  {under: <term>}      -> violation if classified AND value is neither <term>
#                                          nor below it in the field's `is_a` tree (#533)
#                  {not_under: <term>}  -> violation if classified AND value is <term> or
#                                          below it in the field's `is_a` tree
#                  {status_not: <s>}    -> violation if field status == <s>
#                  {status: <s>}        -> violation if field status != <s>
#
# `value_in`/`value_not_in`/`under`/`not_under` only fire on CLASSIFIED fields, so absence of a value
# is never flagged — only a determined value that contradicts another determined one.
#
# Scope note: the flat/deterministic subset only (spike). Conditional rules
# (reference-applicability #4, degenerate-guard #7, data_type<->modality #2) and
# index inertness (the propagation question, #312) are deferred follow-ups.

rules:
  # --- 1. modality <-> assay family -------------------------------------------
  - id: assay_for_transcriptomic
    description: A transcriptomic file's assay, if classified, must be RNA-seq or a term under it.
    when: {data_modality: {under: transcriptomic}}
    require: {assay_type: {under: RNA-seq}}

  - id: assay_for_genomic
    description: A genomic file's assay, if classified, must be WGS or WES.
    when: {data_modality: "genomic"}
    require: {assay_type: {value_in: ["WGS", "WES"]}}

  - id: assay_for_chromatin_accessibility
    description: >-
      A chromatin-accessibility file's assay, if classified, must be ATAC-seq or a term
      under it. SHARE-seq is not under it (its one `is_a` is sc/snRNA-seq, #533), so a
      SHARE-seq file classified as chromatin accessibility would be flagged. It cannot fire yet:
      the linter reads inference output, where no rule emits SHARE-seq (only the translation
      table declares it, at reconcile).
    when: {data_modality: {under: epigenomic.chromatin_accessibility}}
    require: {assay_type: {under: ATAC-seq}}

  - id: assay_for_histone_modification
    description: A histone-modification file's assay, if classified, must be ChIP-seq.
    when: {data_modality: {under: epigenomic.dna_binding.histone_modification}}
    require: {assay_type: {value_in: ["ChIP-seq"]}}

  - id: assay_for_methylation
    description: A methylation file's assay, if classified, must be Bisulfite-seq or Methylation array.
    when: {data_modality: {under: epigenomic.methylation}}
    require: {assay_type: {value_in: ["Bisulfite-seq", "Methylation array"]}}

  # --- 3. imaging exclusivity -------------------------------------------------
  - id: imaging_exclusive
    description: >-
      A microscopy image carries no sequencing signal: when classified, data_type
      must be images and assay_type must be Histology, the one microscopy assay in
      today's vocabulary (widen it as others arrive); platform, instrument_model,
      reference_assembly, variant_kind and variant_origin must not be classified at all (a slide image with
      platform=ILLUMINA or reference=GRCh38 is unmistakably wrong).
    when: {data_modality: {under: imaging.microscopy}}
    require:
      data_type: {value_in: ["images"]}
      assay_type: {value_in: ["Histology"]}
      platform: {status_not: "classified"}
      instrument_model: {status_not: "classified"}
      reference_assembly: {status_not: "classified"}
      variant_kind: {status_not: "classified"}
      variant_origin: {status_not: "classified"}

  # --- 5. platform <-> modality family ----------------------------------------
  # Conservative form: a platform, a sequencer's or an array scanner's (#603), must not
  # sit on an imaging modality (an array scanner images the chip, but its data is
  # intensities, not an imaging modality),
  # `imaging` or anything under it in the schema's `is_a` tree (#563). The enum's
  # other non-sequencing families (proteomic, metabolomic) are left out: nothing
  # classifies them today, and a proteomics dataset can carry sequencing files.
  # microbiome is a sequencing modality (16S, shotgun metagenomics) and is not denied.
  # Deliberately a deny of the imaging subtree, not an allow-list of sequencing
  # modalities: that would false-positive if the enum later gains a new sequencing
  # modality (accuracy over coverage — no false positives). It cross-checks, from
  # the platform side, the contradiction imaging_exclusive catches from the
  # modality side for microscopy.
  - id: sequencing_platform_excludes_imaging
    description: A platform (a sequencer's or an array scanner's) must not sit on an imaging modality.
    when: {platform: {value_in: ["ILLUMINA", "PACBIO", "ONT", "MGI", "ELEMENT", "ULTIMA"]}}
    require: {data_modality: {not_under: imaging}}

  # --- 6. auxiliary-type inertness (checksum/log; index deferred to #312) ------
  - id: auxiliary_inert
    description: >-
      A checksum, log or sample map describes other files and carries no signal of its own,
      so modality / reference / assay / platform / instrument model / variant kind / variant
      origin must not be
      classified (e.g. a .md5 classified genomic is inconsistent). Index inertness
      is the #312 propagation question and is intentionally out of scope here.
    when: {data_type: {value_in: ["checksum", "log", "sample_map"]}}
    require:
      data_modality: {status_not: "classified"}
      reference_assembly: {status_not: "classified"}
      assay_type: {status_not: "classified"}
      platform: {status_not: "classified"}
      instrument_model: {status_not: "classified"}
      variant_kind: {status_not: "classified"}
      variant_origin: {status_not: "classified"}

  # --- 7. variant kind <-> data type (#654) -------------------------------------
  - id: variant_kind_on_variants
    description: >-
      A variant kind is the kind of a callset's calls, so a file given one holds variants:
      its data_type, if classified, must be variants or a term under it. Read on inference
      output, as every rule here is: an index takes its parent's kind only at reconcile.
    when: {variant_kind: {status: "classified"}}
    require: {data_type: {under: variants}}

  # --- 8. variant origin <-> data type (#658) -----------------------------------
  - id: variant_origin_on_variants
    description: >-
      A variant origin is the origin of a callset's calls, so a file given one holds variants:
      its data_type, if classified, must be variants or a term under it. Read on inference
      output, as every rule here is: an index takes its parent's origin only at reconcile.
    when: {variant_origin: {status: "classified"}}
    require: {data_type: {under: variants}}
