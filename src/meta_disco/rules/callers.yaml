# The variant callers, the kind of variant and the origin each calls, and the steps that keep
# a callset's calls (#654, #658).
#
# A VCF's `variant_kind` and `variant_origin` are read from the caller that made it
# (`meta_disco.callers`): the producing step of its header, walked back through the steps
# listed under `keeps_calls`, or, where no command line names a caller, the one tool its
# `##source` and `##DeepVariant_version` lines name. A caller's `pattern` is matched whole
# and case-insensitively against a step's tool (as `validators.command_lines` reads it) and
# against a `##source` value; the `keeps_calls` and `merges` names are matched whole,
# case-insensitively, against a step's tool.
#
# `callers`: a tool, the kind of variant it calls and their origin, with why. A tool not
# listed gives neither, and its file is `not_classified` on both, never guessed.
# `somatic_mode` (optional): a caller that calls germline variants by default and somatic or
# mosaic ones when a flag says so. Its origin holds only where the header records the
# caller's command line without one of `flags`, or names the caller only by a `##source`
# spelling listed in `predates`, written by a version that had no such mode
# (`meta_disco.variant_origins`).
# `keeps_calls`: steps whose output holds the calls of their input and no new ones, so the
# kind and origin of what they write are their input's. A selection may narrow a mixed
# callset, but a caller here calls one kind of one origin, which a narrowing keeps.
# `merges`: steps joining several callsets into one; their kind and origin are settled by
# every caller the header names (rule 5 of #654). `producer_steps.STEP_RULES` names `concat`
# too, for the step it writes (MergeActivity); a merge tool added here may belong there as well.

callers:
  - name: HaplotypeCaller
    pattern: HaplotypeCaller
    kind: small
    origin: germline
    reason: >-
      GATK's germline caller of SNVs and indels by local assembly; structural variants
      are outside what it calls.
  - name: GenotypeGVCFs
    pattern: GenotypeGVCFs
    kind: small
    origin: germline
    reason: >-
      GATK's joint genotyping of HaplotypeCaller gVCFs: it genotypes the small germline
      variants those gVCFs hold, and calls no other kind.
  - name: GenomicsDBImport
    pattern: GenomicsDBImport
    kind: small
    origin: germline
    reason: >-
      The import step of GATK's joint calling, gathering HaplotypeCaller gVCFs for
      GenotypeGVCFs; a callset made from it holds the small germline variants those gVCFs hold.
  - name: CombineGVCFs
    pattern: CombineGVCFs
    kind: small
    origin: germline
    reason: >-
      GATK's merge of HaplotypeCaller gVCFs for joint genotyping, the older path beside
      GenomicsDBImport.
  - name: DeepVariant
    pattern: DeepVariant
    kind: small
    origin: germline
    reason: >-
      Google's deep-learning germline caller of SNVs and small indels; it does not call
      structural variants, and its somatic counterpart is a separate tool, DeepSomatic.
  - name: PEPPER-Margin-DeepVariant
    pattern: PEPPER[-_]?Margin[-_]?DeepVariant
    kind: small
    origin: germline
    reason: >-
      DeepVariant on long reads, after PEPPER's candidate finding and Margin's phasing; a
      germline caller of SNVs and small indels, as DeepVariant is.
  - name: Sniffles
    pattern: "sniffles2?(?:[_-]v?[0-9][0-9.]*)?"
    kind: structural
    origin: germline
    somatic_mode:
      flags: [--non-germline, --mosaic]
      predates: [Sniffles]
      reason: >-
        Sniffles2 calls germline structural variants by default, and rare, somatic or mosaic
        ones with --non-germline (2.0.x) or --mosaic (2.2 on), as each version's own options
        say; it records its command line under ##command. Sniffles 1 has no such mode (1.0.12's
        options were read on 2026-10-10) and writes its ##source as plain "Sniffles".
    reason: >-
      A long-read structural-variant caller (Sniffles and Sniffles2): it calls
      insertions, deletions, duplications, inversions and breakends.
  - name: SVIM
    pattern: "svim(?:-asm)?(?:[_-]v?[0-9][0-9.]*)?"
    kind: structural
    origin: germline
    reason: >-
      Structural-variant callers from long reads (SVIM) and from assemblies (SVIM-asm), both
      calling the germline variants of one sample.

keeps_calls:
  - SelectVariants
  - FilterMutectCalls
  - ApplyVQSR
  - ApplyRecalibration
  - view
  - norm
  - annotate

merges:
  - concat
  - merge
