# The activity translation table (#584): what a lineage line's step is, as an activity of
# activities.yaml and the role its parent takes. Shape and rules: src/meta_disco/activity_map.py.
# `make seed-activity-map` appends a seeded row (no reason, declares nothing) per key no row
# matches; `make review-queue` lists them. An authored row that covers seeded keys replaces
# them: delete those rows, since no two rows may match one line.
rows:
  - id: activity.indexing
    match: {source_type: repository_activity, table: anvil_activity, raw_activity: Indexing, parent_column: used_file_id}
    declares: {activity: IndexActivity, role: indexed}
    reason: >-
      AnVIL's Indexing step makes an index of the one file it used (a CRAM, a VCF, a
      mosdepth regions BED). Named with its file parent column, so a sample parent is not read as one.
  - id: activity.checksum
    match: {source_type: repository_activity, table: anvil_activity, raw_activity: Checksum, parent_column: used_file_id}
    declares: {activity: ChecksumActivity, role: checked}
    reason: AnVIL's Checksum step makes the checksum file of the one file it used.
  - id: activity.alignment_star
    match: {source_type: repository_activity, table: anvil_activity, raw_activity: 'Alignment: STAR', parent_column: used_file_id}
    declares: {activity: AlignmentActivity, role: reads}
    reason: >-
      STAR aligns reads; every file this step used in anvil15 is a trimmed FASTQ. Its sample
      parents (`used_biosample_id`) are not matched here.
  - id: activity.t2t_quality_control
    match:
      source_type: repository_metadata
      table: [1KGP_CHM13v2_sample, SGDP_CHM13v2_sample, SGDP_GRCh38_sample, participant]
      child_column: [full_samtools_stats, chrx_samtools_stats, chry_samtools_stats, samtools_stats, mosdepth_global_dist, mosdepth_regions_bed, mosdepth_regions_dist, mosdepth_summary]
      parent_column: cram
    declares: {activity: QualityControlActivity, role: reported_on}
    reason: >-
      samtools stats and mosdepth read the CRAM on the same sample row and report on its content.
  - id: activity.t2t_alignment
    match: {source_type: repository_metadata, table: [1KGP_CHM13v2_sample, SGDP_CHM13v2_sample, SGDP_GRCh38_sample, participant], child_column: cram, parent_column: [read_1_fastq, read_2_fastq]}
    declares: {activity: AlignmentActivity, role: reads}
    reason: The sample row's CRAM is its two FASTQs aligned.
  - id: activity.t2t_variant_call
    match:
      source_type: repository_metadata
      table: [1KGP_CHM13v2_sample, SGDP_CHM13v2_sample, SGDP_GRCh38_sample, participant]
      child_column: [chr1_hcvcf_gz, chr2_hcvcf_gz, chr3_hcvcf_gz, chr4_hcvcf_gz, chr5_hcvcf_gz, chr6_hcvcf_gz, chr7_hcvcf_gz, chr8_hcvcf_gz, chr9_hcvcf_gz, chr10_hcvcf_gz, chr11_hcvcf_gz, chr12_hcvcf_gz, chr13_hcvcf_gz, chr14_hcvcf_gz, chr15_hcvcf_gz, chr16_hcvcf_gz, chr17_hcvcf_gz, chr18_hcvcf_gz, chr19_hcvcf_gz, chr20_hcvcf_gz, chr21_hcvcf_gz, chr22_hcvcf_gz, xx_x_hcvcf_gz, xy_x_nonpar_hcvcf_gz, xy_x_par_hcvcf_gz, xy_y_nonpar_hcvcf_gz]
      parent_column: cram
    declares: {activity: VariantCallActivity, role: calls_from}
    reason: HaplotypeCaller's per-chromosome VCFs are called from the sample row's CRAM.
  - id: activity.t2t_index
    match:
      source_type: repository_metadata
      table: [1KGP_CHM13v2_sample, SGDP_CHM13v2_sample, SGDP_GRCh38_sample, participant]
      child_column: [cram_index, mosdepth_regions_index, mosdepth_regions_bed_idx, chr1_hcvcf_index, chr2_hcvcf_index, chr3_hcvcf_index, chr4_hcvcf_index, chr5_hcvcf_index, chr6_hcvcf_index, chr7_hcvcf_index, chr8_hcvcf_index, chr9_hcvcf_index, chr10_hcvcf_index, chr11_hcvcf_index, chr12_hcvcf_index, chr13_hcvcf_index, chr14_hcvcf_index, chr15_hcvcf_index, chr16_hcvcf_index, chr17_hcvcf_index, chr18_hcvcf_index, chr19_hcvcf_index, chr20_hcvcf_index, chr21_hcvcf_index, chr22_hcvcf_index, xx_x_hcvcf_index, xy_x_nonpar_hcvcf_index, xy_x_par_hcvcf_index, xy_y_nonpar_hcvcf_index]
      parent_column: [cram, mosdepth_regions_bed, chr1_hcvcf_gz, chr2_hcvcf_gz, chr3_hcvcf_gz, chr4_hcvcf_gz, chr5_hcvcf_gz, chr6_hcvcf_gz, chr7_hcvcf_gz, chr8_hcvcf_gz, chr9_hcvcf_gz, chr10_hcvcf_gz, chr11_hcvcf_gz, chr12_hcvcf_gz, chr13_hcvcf_gz, chr14_hcvcf_gz, chr15_hcvcf_gz, chr16_hcvcf_gz, chr17_hcvcf_gz, chr18_hcvcf_gz, chr19_hcvcf_gz, chr20_hcvcf_gz, chr21_hcvcf_gz, chr22_hcvcf_gz, xx_x_hcvcf_gz, xy_x_nonpar_hcvcf_gz, xy_x_par_hcvcf_gz, xy_y_nonpar_hcvcf_gz]
    declares: {activity: IndexActivity, role: indexed}
    reason: >-
      Each index column on a sample row indexes the file in the column it is named after
      (`cram_index` the `cram`, `chr1_hcvcf_index` the `chr1_hcvcf_gz`). The two lists match
      every combination, not only those pairs: no other pair occurs, and any index of one of
      these files is an index of it.
  - id: activity.igvf_index
    match: {source_type: repository_metadata, table: file, child_column: file_path, parent_column: derived_from, child_data_type: index, parent_data_type: [alignments, fragments]}
    declares: {activity: IndexActivity, role: indexed}
    reason: An IGVF index is derived from the alignments or fragments file it indexes.
  - id: activity.igvf_alignment
    match: {source_type: repository_metadata, table: file, child_column: file_path, parent_column: derived_from, child_data_type: alignments, parent_data_type: reads}
    declares: {activity: AlignmentActivity, role: reads}
    reason: IGVF alignments derived from reads are those reads aligned.
