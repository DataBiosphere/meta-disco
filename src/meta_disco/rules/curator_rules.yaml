# Curator rules (claims contract 1.6, 1.7, 4.7; #397): a person's answer to a conflict, written as a rule
# and reviewed as one. Shape and checks: `meta_disco.curator_rules`. Today one kind, `samples` (#777): a
# row answers a file whose samples conflict only because the repository's record of the step that
# generated it (AnVIL's `anvil_activity.used_biosample_id`, #698) names another sample than the file's
# other sources. It answers with those sources' samples only where every one agrees, each submitter
# table's is a cell of the row's `table` in one of its `columns`, and the file's own content (a read
# group) or its name confirms them. A name only confirms: it never enters the answer. `same_sample` pairs a name's
# identifier with the table's for this check alone; no record, list or identifier rule carries them.
# The conflict is not erased: reconcile lists it with every source, `answered_by` the row.
samples:
  - id: hprc_parent_reads_named_by_sample_table
    author: NoopDog
    date: "2026-11-10"
    dataset: ANVIL_HPRC
    table: sample
    columns: [maternal_id, paternal_id]
    same_sample:
      - name: "coriell:NA24694"
        sample: "giab:HG006"
        cited: >-
          NCBI BioSample SAMN21924297, "NIST HG006": male, cell line "NA24694 at Coriell". GIAB names
          NA24694 the father of HG005 (https://github.com/genome-in-a-bottle/about_GIAB).
      - name: "coriell:NA24695"
        sample: "giab:HG007"
        cited: >-
          NCBI BioSample SAMN21924298, "NIST HG007": female, cell line "NA24695 at Coriell". GIAB names
          NA24695 the mother of HG005.
    rationale: >-
      HPRC's `sample` table has one row per assembled child, listing the parents' Illumina reads in
      `mat_ilmn` and `pat_ilmn` beside `maternal_id` and `paternal_id`; the parents have no row of their
      own. AnVIL makes one `anvil_activity` from each row, whose `used_biosample_id` is the child's
      biosample and whose `generated_file_id` lists every file of the row, the parents' reads included
      (docs/anvil-data-issues.md, issue 1; measured on anvil15: all 1,314 such files, each in one parent
      column of one row and generated by the one activity made from that row). So where the file's read
      group or its name names the parent the column names, the activity is the one source naming the
      wrong person. NA21309's parents' four FASTQs are named by a barcode alone, and stay conflicts.
