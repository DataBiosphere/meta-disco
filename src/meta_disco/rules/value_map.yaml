# The value translation table (#414): raw source values to vocabulary terms.
# Shape, matching, selection and the seeder: src/meta_disco/value_map.py.
# A row with a `reason` is authored; without one it is seeded and declares nothing.
rows:
  # --- assay_type -----------------------------------------------------------------
  - id: "assay_type.hi_c"
    match: {slot: assay_type, value: "Hi-C", alternates: ["hic"]}
    declares: {data_modality: genomic}
    reason: >-
      Hi-C is chromatin-conformation sequencing of genomic DNA, so the modality is genomic.
      The vocabulary has no assay term for it yet (#399), so nothing is declared for assay_type.
      `hic` is the table-name span of the same data.
    seeded_from: ["anvil/anvil15/ANVIL_HPRC/20260920T175642Z", "anvil/anvil15/AnVIL_HPRC_R2/20260920T175642Z"]
  - id: "assay_type.isoseq"
    match: {slot: assay_type, value: "isoseq"}
    seeded_from: ["anvil/anvil15/AnVIL_HPRC_R2/20260920T175642Z"]
  - id: "assay_type.wgs"
    match: {slot: assay_type, value: "WGS"}
    declares: {assay_type: WGS, data_modality: genomic}
    reason: Whole-genome sequencing, spelled as our term; a WGS library is genomic DNA.
    seeded_from: ["anvil/anvil15/AnVIL_HPRC_R2/20260920T175642Z"]
  # --- data_modality --------------------------------------------------------------
  - id: "data_modality.genomic"
    match: {slot: data_modality, value: "GENOMIC"}
    declares: {data_modality: genomic}
    reason: >-
      SRA's library_source value for genomic DNA, spelled as our term. Identity by ruling, not by
      spelling; if a bisulfite or ATAC library ever arrives under it, narrow this row rather than rank it.
    seeded_from: ["anvil/anvil15/AnVIL_HPRC_R2/20260920T175642Z"]
  - id: "data_modality.methylation"
    match: {slot: data_modality, value: "methylation"}
    declares: {data_modality: epigenomic.methylation}
    reason: The `ont_methylation` table-name span; its files are bigwig methylation tracks.
    seeded_from: ["anvil/anvil15/AnVIL_HPRC_R2/20260920T175642Z"]
  - id: "data_modality.transcriptomic"
    match: {slot: data_modality, value: "transcriptomic"}
    seeded_from: ["anvil/anvil15/AnVIL_HPRC_R2/20260920T175642Z"]
  # --- data_type ------------------------------------------------------------------
  - id: "data_type.alignments"
    match: {slot: data_type, value: "alignments"}
    seeded_from: ["anvil/anvil15/AnVIL_HPRC_R2/20260920T175642Z"]
  - id: "data_type.annotation"
    match: {slot: data_type, value: "annotation"}
    declares: {data_type: annotations}
    reason: The `assembly_annotation` table-name span; its files are feature annotations of an assembly.
    seeded_from: ["anvil/anvil15/ANVIL_HPRC/20260920T175642Z"]
  - id: "data_type.assembly"
    match: {slot: data_type, value: "assembly"}
    declares: {data_type: assembly}
    reason: The `assembly` table-name span; its files are the de-novo assemblies (.fa.gz).
    seeded_from: ["anvil/anvil15/AnVIL_HPRC_R2/20260920T175642Z"]
  - id: "data_type.bam"
    match: {slot: data_type, value: "bam"}
    declares: {}
    reason: >-
