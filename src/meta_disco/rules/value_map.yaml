  - id: "data_type.annotation"
    match: {slot: data_type, value: "annotation"}
    declares: {data_type: annotations}
    reason: The `assembly_annotation` table-name span; its files are feature annotations of an assembly.
    seeded_from: ["anvil/anvil15/ANVIL_HPRC/20260920T175642Z"]
  - id: "data_type.assembly"
    match: {slot: data_type, value: "assembly"}
