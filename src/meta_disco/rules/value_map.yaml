    seeded_from: ["anvil/anvil15/AnVIL_HPRC_R2/20260920T175642Z"]
  - id: "data_type.bam"
    match: {slot: data_type, value: "bam"}
    declares: {}
    reason: >-
      A file format, not a data type: the kinnex table's data_type column holds what its
      filetype column should. Ruled to mean nothing here rather than left queued.
    seeded_from: ["anvil/anvil15/AnVIL_HPRC_R2/20260920T175642Z"]
  - id: "data_type.censat"
