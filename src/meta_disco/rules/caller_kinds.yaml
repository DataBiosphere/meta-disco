# The kind of variant each caller calls, and the steps that keep a callset's kind (#654).
#
# A VCF's `variant_kind` is read from the caller that made it (`meta_disco.variant_kinds`):
# the producing step of its header, walked back through the steps listed under
# `keeps_kind`, or, where no command line names a caller, the one tool its
# `##source` and `##DeepVariant_version` lines name. A caller's `pattern` is matched whole
# and case-insensitively against a step's tool (as `validators.command_lines` reads it) and
# against a `##source` value; the `keeps_kind` and `merges` names are matched whole,
# case-insensitively, against a step's tool.
#
# `callers`: a tool and the kind of variant it calls, with why. A tool not listed gives no
# kind, and its file is `not_classified`, never guessed.
# `keeps_kind`: steps whose output holds the calls of their input and no new ones, so the
# kind of what they write is their input's. A selection may narrow a mixed callset, but a
# caller here calls one kind, which a narrowing keeps.
# `merges`: steps joining several callsets into one; their kind is settled by every caller
# the header names (rule 5 of #654). `producer_steps.STEP_RULES` names `concat` too, for
# the step it writes (MergeActivity); a merge tool added here may belong there as well.

callers:
  - name: HaplotypeCaller
    pattern: HaplotypeCaller
    kind: small
    reason: >-
      GATK's germline caller of SNVs and indels by local assembly; structural variants
      are outside what it calls.
  - name: GenotypeGVCFs
    pattern: GenotypeGVCFs
    kind: small
    reason: >-
      GATK's joint genotyping of HaplotypeCaller gVCFs: it genotypes the small variants
      those gVCFs hold, and calls no other kind.
  - name: GenomicsDBImport
    pattern: GenomicsDBImport
    kind: small
    reason: >-
      The import step of GATK's joint calling, gathering HaplotypeCaller gVCFs for
      GenotypeGVCFs; a callset made from it holds the small variants those gVCFs hold.
  - name: CombineGVCFs
    pattern: CombineGVCFs
    kind: small
    reason: >-
      GATK's merge of HaplotypeCaller gVCFs for joint genotyping, the older path beside
      GenomicsDBImport.
  - name: DeepVariant
    pattern: DeepVariant
    kind: small
    reason: >-
      Google's deep-learning caller of SNVs and small indels; it does not call
      structural variants.
  - name: PEPPER-Margin-DeepVariant
    pattern: PEPPER[-_]?Margin[-_]?DeepVariant
    kind: small
    reason: >-
      DeepVariant on long reads, after PEPPER's candidate finding and Margin's phasing; a
      caller of SNVs and small indels, as DeepVariant is.
  - name: Sniffles
    pattern: "sniffles2?(?:[_-]v?[0-9][0-9.]*)?"
    kind: structural
    reason: >-
      A long-read structural-variant caller (Sniffles and Sniffles2): it calls
      insertions, deletions, duplications, inversions and breakends.
  - name: SVIM
    pattern: "svim(?:-asm)?(?:[_-]v?[0-9][0-9.]*)?"
    kind: structural
    reason: >-
      Structural-variant callers from long reads (SVIM) and from assemblies (SVIM-asm).

keeps_kind:
  - SelectVariants
  - ApplyVQSR
  - ApplyRecalibration
  - view
  - norm
  - annotate

merges:
  - concat
  - merge
