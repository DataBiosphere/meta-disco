_gz' \u00b7 'chr11_hcvcf_gz' \u00b7 'chr12_hcvcf_gz' \u00b7 'chr13_hcvcf_gz' \u00b7 'chr14_hcvcf_gz' \u00b7 'chr15_hcvcf_gz' \u00b7 'chr16_hcvcf_gz' \u00b7 'chr17_hcvcf_gz' \u00b7 'chr18_hcvcf_gz' \u00b7 'chr19_hcvcf_gz' \u00b7 'chr1_hcvcf_gz' \u00b7 'chr20_hcvcf_gz' \u00b7 'chr21_hcvcf_gz' \u00b7 'chr22_hcvcf_gz' \u00b7 'chr2_hcvcf_gz' \u00b7 'chr3_hcvcf_gz' \u00b7 'chr4_hcvcf_gz' \u00b7 'chr5_hcvcf_gz' \u00b7 'chr6_hcvcf_gz' \u00b7 'chr7_hcvcf_gz' \u00b7 'chr8_hcvcf_gz' \u00b7 'chr9_hcvcf_gz' \u00b7 'cram' \u00b7 'mosdepth_regions_bed' \u00b7 'xx_x_hcvcf_gz' \u00b7 'xy_x_nonpar_hcvcf_gz' \u00b7 'xy_x_par_hcvcf_gz' \u00b7 'xy_y_nonpar_hcvcf_gz'", "reads_is_catalog": true, "rationale": "Each index column on a sample row indexes the file in the column it is named after (`cram_index` the `cram`, `chr1_hcvcf_index` the `chr1_hcvcf_gz`). The two lists match every combination, not only those pairs: no other pair occurs, and any index of one of these files is an index of it.", "claims": 104302, "files": 104302, "won": 0, "datasets": {"ANVIL_T2T_CHRY": 97898, "ANVIL_T2T": 6404}, "source_types": {}}, {"id": "activity.t2t_joint_genotype", "activity": "VariantCallActivity / calls_from", "defined_in": "src/meta_disco/rules/activity_map.yaml", "reads": "source_type: 'repository_metadata'; table: 'interval'; child_column: 'genotyped_bgzip'; parent_column: 'genomics_db_tar'", "reads_is_catalog": true, "rationale": "The interval row's VCF is its GenomicsDB workspace genotyped across every sample (GATK GenotypeGVCFs reads the workspace) and trimmed to the interval (SelectVariants). The VCF's header carries the workspace's GenomicsDBImport line and SelectVariants', but not GenotypeGVCFs', so the row is what states the link (#610).", "claims": 31155, "files": 31155, "won": 0, "datasets": {"ANVIL_T2T": 31155}, "source_types": {}}, {"id": "activity.t2t_variant_filter", "activity": "VariantFilterActivity / processed", "defined_in": "src/meta_disco/rules/activity_map.yaml", "reads": "source_type: 'repository_metadata'; table: 'chromosome'; child_column: 'chm13_pass_vcf_gz' \u00b7 'chm13_recalibrated_vcf_gz' \u00b7 'grch38_pass_vcf_gz'; parent_column: 'chm13_raw_vcf_gz' \u00b7 'chm13_recalibrated_vcf_gz' \u00b7 'grch38_recalibrated_vcf_gz'", "reads_is_catalog": true, "rationale": "On a chromosome row, the recalibrated callset is the raw one with every row labelled by GATK's ApplyVQSR (its header records both passes), and the PASS callset is the recalibrated one with only its passing rows kept (`bcftools view -f PASS`). The row holds CHM13's raw, recalibrated and PASS callsets and GRCh38's recalibrated and PASS ones. The lists match every combination, but the lineage map pairs each chain only within itself, so no line pairs a CHM13 file with a GRCh38 one (#610).", "claims": 72, "files": 72, "won": 0, "datasets": {"ANVIL_T2T": 72}, "source_types": {}}, {"id": "activity.igvf_index", "activity": "IndexActivity / indexed", "defined_in": "src/meta_disco/rules/activity_map.yaml", "reads": "source_type: 'repository_metadata'; table: 'file'; child_column: 'file_path'; parent_column: 'derived_from'; child_data_type: 'index'; parent_data_type: 'alignments' \u00b7 'fragments'", "reads_is_catalog": true, "rationale": "An IGVF index is derived from the alignments or fragments file it indexes.", "claims": 4, "files": 4, "won": 0, "datasets": {"AnVIL_IGVF_Mouse_R1": 4}, "source_types": {}}, {"id": "activity.igvf_alignment", "activity": "AlignmentActivity / reads", "defined_in": "src/meta_disco/rules/activity_map.yaml", "reads": "source_type: 'repository_metadata'; table: 'file'; child_column: 'file_path'; parent_column: 'derived_from'; child_data_type: 'alignments'; parent_data_type: 'reads'", "reads_is_catalog": true, "rationale": "IGVF alignments derived from reads are those reads aligned.", "claims": 6, "files": 2, "won": 0, "datasets": {"AnVIL_IGVF_Mouse_R1": 2}, "source_types": {}}, {"id": "activity.track_bedgraphtobigwig", "activity": "CoverageActivity / covered", "defined_in": "src/meta_disco/rules/activity_map.yaml", "reads": "source_type: 'repository_activity'; table: 'anvil_activity'; raw_activity: 'Track: bedGraphToBigWig'; parent_column: 'used_file_id'", "reads_is_catalog": true, "rationale": "Each step used one STAR BAM and generated its four `Signal.{Unique,UniqueMultiple}.strand\u00b1` bigWigs: STAR's per-strand coverage of that BAM, converted by bedGraphToBigWig, so the raw words name the conversion, not what was computed.", "claims": 2536, "files": 2536, "won": 0, "datasets": {"AnVIL_ENCORE_RS293": 1640, "AnVIL_ENCORE_293T": 896}, "source_types": {}}, {"id": "activity.quantification_salmon", "activity": "ExpressionActivity / quantified", "defined_in": "src/meta_disco/rules/activity_map.yaml", "reads": "source_type: 'repository_activity'; table: 'anvil_activity'; raw_activity: 'Quantificatioin: salmon'; parent_column: 'used_file_id'", "reads_is_catalog": true, "rationale": "salmon quantifies the reads it used; every file this step used in anvil15 is a trimmed FASTQ. `Quantificatioin` is AnVIL's spelling, matched as written.", "claims": 1268, "files": 634, "won": 0, "datasets": {"AnVIL_ENCORE_RS293": 410, "AnVIL_ENCORE_293T": 224}, "source_types": {}}, {"id": "activity.merger_fastq", "activity": "MergeActivity / shard", "defined_in": "src/meta_disco/rules/activity_map.yaml", "reads": "source_type: 'repository_activity'; table: 'anvil_activity'; raw_activity: 'Merger: multiple FASTQ files'; parent_column: 'used_file_id'", "reads_is_catalog": true, "rationale": "The step joins the FASTQs it used into one FASTQ.", "claims": 20, "files": 8, "won": 0, "datasets": {"AnVIL_ENCORE_293T": 8}, "source_types": {}}], "callers": [{"name": "HaplotypeCaller", "pattern": "HaplotypeCaller", "kind": "small", "origin": "germline", "somatic_mode": "", "reason": "GATK's germline caller of SNVs and indels by local assembly; structural variants are outside what it calls.", "kind_files": 168827, "origin_files": 168827}, {"name": "GenotypeGVCFs", "pattern": "GenotypeGVCFs", "kind": "small", "origin": "germline", "somatic_mode": "", "reason": "GATK's joint genotyping of HaplotypeCaller gVCFs: it genotypes the small germline variants those gVCFs hold, and calls no other kind.", "kind_files": 0, "origin_files": 0}, {"name": "GenomicsDBImport", "pattern": "GenomicsDBImport", "kind": "small", "origin": "germline", "somatic_mode": "", "reason": "The import step of GATK's joint calling, gathering HaplotypeCaller gVCFs for GenotypeGVCFs; a callset made from it holds the small germline variants those gVCFs hold.", "kind_files": 33411, "origin_files": 33411}, {"name": "CombineGVCFs", "pattern": "CombineGVCFs", "kind": "small", "origin": "germline", "somatic_mode": "", "reason": "GATK's merge of HaplotypeCaller gVCFs for joint genotyping, the older path beside GenomicsDBImport.", "kind_files": 0, "origin_files": 0}, {"name": "DeepVariant", "pattern": "DeepVariant", "kind": "small", "origin": "germline", "somatic_mode": "", "reason": "Google's deep-learning germline caller of SNVs and small indels; it does not call structural variants, and its somatic counterpart is a separate tool, DeepSomatic.", "kind_files": 18, "origin_files": 24}, {"name": "PEPPER-Margin-DeepVariant", "pattern": "PEPPER[-_]?Margin[-_]?DeepVariant", "kind": "small", "origin": "germline", "somatic_mode": "", "reason": "DeepVariant on long reads, after PEPPER's candidate finding and Margin's phasing; a germline caller of SNVs and small indels, as DeepVariant is.", "kind_files": 0, "origin_files": 0}, {"name": "Sniffles", "pattern": "sniffles2?(?:[_-]v?[0-9][0-9.]*)?", "kind": "structural", "origin": "germline", "somatic_mode": "flags --mosaic, --non-germline; predated by sniffles. Sniffles2 calls germline structural variants by default, and rare, somatic or mosaic ones with --non-germline (2.0.x) or --mosaic (2.2 on), as each version's own options say; it records its command line under ##command. Sniffles 1 has no such mode (1.0.12's options were read on 2026-10-10) and writes its ##source as plain \"Sniffles\".", "reason": "A long-read structural-variant caller (Sniffles and Sniffles2): it calls insertions, deletions, duplications, inversions and breakends.", "kind_files": 136, "origin_files": 136}, {"name": "SVIM", "pattern": "svim(?:-asm)?(?:[_-]v?[0-9][0-9.]*)?", "kind": "structural", "origin": "germline", "somatic_mode": "", "reason": "Structural-variant callers from long reads (SVIM) and from assemblies (SVIM-asm), both calling the germline variants of one sample.", "kind_files": 17, "origin_files": 29}], "undeclared": [], "labels": {"yaml": ["When", "Then"], "code": ["Reads", "Sets"], "mapping": ["Match", "Declares"]}, "text": {"intro": "Every rule meta-disco uses to describe a file, such as \"a .bam file holds alignments\" or \"a CRAM whose chromosome lengths match GRCh38 is aligned to GRCh38\". Each row shows what the rule looks at, what it concludes and why, and how often it applied in the classification named below.", "key": [["Kind", "where the rule is written: yaml, the rules file; code, in Python, for checks a rules file cannot express, such as comparing chromosome lengths; mapping, a translation from a value a submitter wrote (\"Revio\") to our term (\"PACBIO\")."], ["Basis", "what the rule looks at: the file's extension, its size, its name, the dataset it belongs to, its contents (headers, chromosome names and lengths, what a tar archive holds), the answer for the file it was made from (parent_file, for an index), or a submitter's value (mapping)."], ["Files", "how many files the rule gave an answer for."], ["Claims", "how many answers it gave: one rule can answer several fields of one file."], ["Won", "how many of those files ended up with the rule's answer, or a more specific form of it (a rule saying CHM13 on a file found to be T2T-CHM13v2.0). It can be lower when a stronger rule, or the submitter's metadata, gave a different answer. For our own rules, this compares with the answer meta-disco worked out on its own, before the submitter's metadata; for a mapping, with the file's final answer."], ["Highlighted", "a rule that gave no answer for any file this time."]], "markers_note": "Not rules. Each is a reason a field of a file was left without an answer.", "edge_rules_note": "Rules that say which file a file was made from, rather than giving a field an answer. The code rules name the parent from the file's own name, or from the command line in its header that made it (#609), and only where exactly one file of the dataset carries that name. The activity-map rows (#584) translate what a source table says about a step, and reconcile resolves the parent that table names (#577). Counted by the inputs of the reconciled `generated_by` that cite them.", "callers_note": "The rows of `rules/callers.yaml` (#654, #658): each variant caller, the kind of variant it calls and their origin, which the caller rules look up once they have found the caller in a VCF's header. A caller with a somatic mode gives its origin only where its command line shows none of the mode's flags, or a `##source` spelling predates the mode. Counted by the files whose kind or origin a caller rule took from the row: a merge counts each of its callers.", "undeclared_head": "Rule names with no rule behind them", "undeclared_note": "The counts name these rules, but the rule files in this version of meta-disco do not contain them. That happens when a rule was renamed or removed after the files were classified, or when a change still under review added it. There is nothing to show for them but the count. Once the files are classified again with the current rules, this list is empty.", "none_note": "None: every rule the counts name is in the rule files."}};
    const LABELS = DATA.labels, TEXT = DATA.text;
    const fmt = n => n.toLocaleString();
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
    const where = d => Object.entries(d).map(([k, v]) => `${esc(k || "(no dataset title)")} ${fmt(v)}`).join("<br>");

    document.getElementById("intro").textContent = TEXT.intro;
    document.getElementById("provenance").textContent = DATA.provenance;
    document.getElementById("key").innerHTML = TEXT.key.map(([k, v]) => `<li><strong>${esc(k)}</strong>: ${esc(v)}</li>`).join("");
    document.getElementById("markers-note").textContent = TEXT.markers_note;
    document.getElementById("edge-rules-note").textContent = TEXT.edge_rules_note;
    document.getElementById("callers-note").textContent = TEXT.callers_note;
    document.getElementById("undeclared-head").textContent = TEXT.undeclared_head;
    document.getElementById("undeclared-note").textContent = TEXT.undeclared_note;

    for (const [id, key] of [["kind", "kind"], ["basis", "basis"]]) {
      const sel = document.getElementById(id);
      for (const v of [...new Set(DATA.rules.map(r => r[key]))].sort()) sel.add(new Option(v, v));
    }

    const rule = r =>
      (r.expanded.length ? `<div class="sub">written with ${r.expanded.map(a => `<code>*${esc(a)}</code>`).join(", ")}, shown expanded</div>` : "") +
      `<div class="lbl">${LABELS[r.kind][0]}</div><pre>${esc(r.condition)}</pre>` +
      `<div class="lbl">${LABELS[r.kind][1]}</div><pre>${esc(r.effect)}</pre>`;
    const COLS = [
      ["id", "id", r => `<code>${esc(r.id)}</code><div class="sub">${esc(r.kind)} &middot; ${esc(r.basis)}${r.tier ? ` &middot; tier ${esc(r.tier)}` : ""}</div><div class="sub"><code>${esc(r.defined_in)}</code></div>`],
      ["rule", null, rule],
      ["rationale", null, r => r.rationale ? esc(r.rationale) : '<span class="sub">seeded: declares nothing</span>'],
      ["dataset", "dataset", r => esc(r.dataset)],
      ["files", "files", r => fmt(r.files), true],
      ["claims", "claims", r => fmt(r.claims), true],
      ["won", "won", r => fmt(r.won), true],
      ["datasets", null, r => where(r.datasets) +
        (Object.keys(r.source_types).length ? `<div class="sub">answers by source: ${where(r.source_types)}</div>` : "")],
    ];
    let sortKey = null, sortDir = 1;

    function render() {
      const kind = document.getElementById("kind").value;
      const basis = document.getElementById("basis").value;
      const never = document.getElementById("never").checked;
      const q = document.getElementById("search").value.toLowerCase();
      let rows = DATA.rules.filter(r =>
        (!kind || r.kind === kind) && (!basis || r.basis === basis) && (!never || !r.files) &&
        (!q || [r.id, r.dataset, r.rationale, r.condition, r.effect, Object.keys(r.datasets).join(" ")].join(" ").toLowerCase().includes(q)));
      if (sortKey) rows = [...rows].sort((a, b) => (a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0) * sortDir);
      // A sortable heading is a button, so it can be reached and pressed from the keyboard.
      const head = "<tr>" + COLS.map(([name, key]) => key ? `<th><button type="button" class="sort" data-key="${key}">${name}</button></th>` : `<th>${name}</th>`).join("") + "</tr>";
      const body = rows.map(r => "<tr>" +
        COLS.map(([name, , cell, num]) => `<td class="${num ? "num" : ""}${num && !r.files ? " zero" : ""}${name === "rule" ? " rule" : ""}${name === "rationale" ? " why" : ""}">${cell(r)}</td>`).join("") +
        "</tr>").join("");
      const table = document.getElementById("rules");
      table.innerHTML = head + body;
      document.getElementById("count").textContent = `${rows.length} of ${DATA.rules.length} rules`;
      table.querySelectorAll("button.sort").forEach(button => button.onclick = () => {
        const key = button.dataset.key;
        sortDir = sortKey === key ? -sortDir : (["files", "claims", "won"].includes(key) ? -1 : 1);
        sortKey = key;
        render();
      });
    }
    for (const id of ["kind", "basis", "never", "search"]) document.getElementById(id).oninput = render;
    render();

    document.getElementById("markers").innerHTML =
      "<tr><th>id</th><th>written as</th><th>files</th><th>meaning</th></tr>" +
      DATA.markers.map(m => `<tr><td><code>${esc(m.id)}</code></td><td>${esc(m.written_as)}</td>` +
        `<td class="num">${fmt(m.files)}</td><td>${esc(m.meaning)}</td></tr>`).join("");

    document.getElementById("edge-rules").innerHTML =
      "<tr><th>id</th><th>states</th><th>files</th><th>reads</th><th>rationale</th><th>in</th></tr>" +
      DATA.edge_rules.map(e => `<tr><td><code>${esc(e.id)}</code></td><td><code>${esc(e.activity)}</code></td>` +
        `<td class="num">${fmt(e.files)}</td><td>${esc(e.reads)}</td><td>${esc(e.rationale)}</td>` +
        `<td><code>${esc(e.defined_in)}</code></td></tr>`).join("");

    document.getElementById("callers").innerHTML =
      "<tr><th>caller</th><th>kind</th><th>origin</th><th>reason</th><th>somatic mode</th><th>kind files</th><th>origin files</th><th>pattern</th></tr>" +
      DATA.callers.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.kind)}</td><td>${esc(c.origin)}</td>` +
        `<td>${esc(c.reason)}</td><td>${esc(c.somatic_mode)}</td><td class="num${c.kind_files ? "" : " zero"}">${fmt(c.kind_files)}</td>` +
        `<td class="num${c.origin_files ? "" : " zero"}">${fmt(c.origin_files)}</td><td><code>${esc(c.pattern)}</code></td></tr>`).join("");

    document.getElementById("undeclared").innerHTML = DATA.undeclared.length
      ? "<table><tr><th>id</th><th>files</th><th>claims</th></tr>" + DATA.undeclared.map(u =>
          `<tr><td><code>${esc(u.id)}</code></td><td class="num">${fmt(u.files)}</td><td class="num">${fmt(u.claims)}</td></tr>`).join("") + "</table>"
      : `<p class="note">${esc(TEXT.none_note)}</p>`;
  </script>
